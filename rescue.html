<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centric · إنقاذ</title>
<style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:16px}h1{font-size:20px}.c{background:#1e293b;border-radius:14px;padding:12px;margin:0 0 12px}button{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:16px;font-weight:700}button.o{background:#b45309}pre{white-space:pre-wrap;word-break:break-all;font-size:12px;direction:ltr;text-align:left;margin:6px 0 0}iframe{width:100%;height:55vh;border:1px solid #334155;border-radius:12px;background:#fff;display:none}</style></head><body>
<h1>🛟 Centric · صفحة الإنقاذ</h1>
<button onclick="dbg()">🔍 1) شغّل البرنامج هنا وورّيني الخطأ</button>
<div class="c"><b>📋 النتيجة</b><pre id="out">لسه</pre></div>
<iframe id="fr"></iframe>
<button class="o" onclick="home()">🧹 2) افتح البرنامج على الرئيسية</button>
<button onclick="dlLS()">⬇️ نزّل كل البيانات</button>
<script>
const out=document.getElementById('out'),log=t=>{out.textContent=(out.textContent==='لسه'?'':out.textContent+'\n')+t};
function save(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function dlLS(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);o[k]=localStorage.getItem(k)}save('centric-data-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json',JSON.stringify(o))}
function home(){localStorage.removeItem('centric-state');location.href='/'}
addEventListener('message',e=>{const d=e.data||{};if(!d.t)return;if(/serviceworker/i.test(d.m+d.st))return;log((d.t==='err'?'❌ ':'ℹ️ ')+d.m+(d.s?' @ '+d.s+':'+d.l+':'+d.c:'')+(d.st?'\n'+d.st:''))});
async function dbg(){
  out.textContent='⏳ بشغّل البرنامج... استنى 10 ثواني';
  try{const st=JSON.parse(localStorage.getItem('centric-state')||'{}');log('آخر شاشة: '+(st.v||'—'))}catch(e){}
  let h;try{h=await (await fetch('/?dbg='+Date.now(),{cache:'no-store'})).text()}catch(e){return log('❌ مش قادر أجيب البرنامج: '+e.message)}
  const C='<script>window.onerror=function(m,s,l,c,e){parent.postMessage({t:"err",m:String(m),s:String(s||"").split("/").pop(),l:l,c:c,st:e&&e.stack?String(e.stack).slice(0,700):""},"*")};addEventListener("unhandledrejection",function(e){var r=e.reason||{};parent.postMessage({t:"err",m:"Promise: "+(r.message||r),st:r.stack?String(r.stack).slice(0,700):""},"*")});setTimeout(function(){var b=document.getElementById("xboot");parent.postMessage({t:"info",m:"بعد 8 ثواني: شاشة التحميل "+(b?"لسه موجودة":"اختفت")+" · الإصدار "+(typeof XVER!=="undefined"?XVER:"؟")+" · الشاشة "+(typeof view!=="undefined"?view:"؟")},"*")},8000)<\/script>';
  h=/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+C):C+h;
  const f=document.getElementById('fr');f.style.display='block';f.srcdoc=h;
}
</script></body></html>
