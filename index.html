<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fawzy Folio">
<meta name="author" content="Eng.Ahmed Fawzy - DeTech Solutions">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fawzy Folio</title>
<style>
:root{--p:#0f766e;--bg:#f4f6f8;--card:#fff;--soft:#eef1f4;--soft2:#f8fafc;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--inc:#16a34a;--exp:#dc2626;--tr:#2563eb}
body.dark{--bg:#0b1220;--card:#162032;--soft:#22304a;--soft2:#1a2538;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2b3a52;--inc:#22c55e;--exp:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
header{background:var(--p);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}
body.dark header{background:var(--card);border-bottom:1px solid var(--bd)}
header h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header span{font-size:12px;opacity:.85}
header .hr{display:flex;align-items:center;gap:8px;flex-shrink:0}
#bell{position:relative;background:#ffffff26;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px}
#bell b{position:absolute;top:-4px;left:-4px;background:#dc2626;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
#bell b:empty{display:none}
main{max-width:560px;margin:auto;padding:10px 10px calc(86px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mu);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;white-space:nowrap}
nav button span{font-size:18px}nav button.on{color:var(--p);font-weight:700}
nav .fab{flex:0 0 48px;height:48px;border-radius:50%;background:var(--p);color:#fff;font-size:26px;margin:-24px 3px 0;box-shadow:0 4px 12px #0004;justify-content:center;line-height:1}
input[type=file]{display:none!important}
h3{font-size:14px;margin:14px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h3 small{font-weight:400;color:var(--mu);font-size:12px}
.muted{color:var(--mu);font-weight:400}
.mbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:5px;margin-bottom:8px;gap:6px}
.mbar button{width:36px;height:34px;flex:0 0 36px;border:0;background:var(--soft);border-radius:9px;font-size:19px;color:var(--tx)}
.mbar b{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center}
.lock{font-size:11px;background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-weight:600;cursor:pointer}.lock.op{background:#dcfce7;color:#166534}
.hero{background:var(--p);background-image:linear-gradient(135deg,#ffffff14,#0000002e);color:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
.hero-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;line-height:1.9;padding:2px 2px 0}
.hero-t .hm{font-weight:700;background:#ffffff2e;padding:0 10px;border-radius:12px}
.hero-t em{font-style:normal;font-size:11px;font-weight:700;padding:0 9px;border-radius:12px;margin-inline-start:auto;cursor:pointer}
.hero-t em.op{background:#dcfce7;color:#166534}.hero-t em.cl{background:#fef3c7;color:#92400e}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hbtns button{background:#ffffff1f;border:1px solid #ffffff38;border-radius:12px;color:#fff;font:inherit;padding:8px 10px;text-align:right;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.hbtns small{font-size:11px;opacity:.9}.hbtns b{font-size:19px}.hbtns i{font-style:normal;font-size:11px;opacity:.8;align-self:flex-end}
.hnet{margin-top:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#0000001f;border-radius:10px;padding:7px 10px}.hnet b{font-size:16px}
.hneg{background:#fee2e2;color:#b91c1c;padding:1px 10px;border-radius:10px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:3px}
.tile.hot{border-color:#fca5a5;box-shadow:inset 0 3px 0 #dc2626}.tile.soon{border-color:#fcd34d;box-shadow:inset 0 3px 0 #d97706}
.tth{display:flex;align-items:center;gap:6px;min-width:0}.tth .ti{font-size:18px}.tth .tl{font-size:12px;font-weight:600;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tth .tb{background:#dc2626;color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
.tile>b{font-size:16px}.tile>small{color:var(--mu);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;background:var(--soft);border-radius:3px;margin:2px 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--inc)}
.svgc{width:100%;height:auto;display:block}.svgc text{font-family:inherit}
.donut{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.dleg{flex:1;min-width:150px;font-size:12px}.dleg div{display:flex;align-items:center;gap:6px;margin:4px 0}
.dleg i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}.dleg span{flex:1}
.pos{color:var(--inc)!important}.neg{color:var(--exp)!important}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--soft);cursor:pointer}.row:last-child{border-bottom:0}
.row.col{flex-direction:column;align-items:stretch;gap:0}
a.row{color:inherit;text-decoration:none}
.row.off,tr.off{opacity:.5}
.rowin{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.grow{flex:1;min-width:0}
.nrow b,.nrow small{white-space:normal!important}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 32px;font-weight:700}
.amt{text-align:left;font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}.amt.inc{color:var(--inc)}.amt.exp{color:var(--exp)}
.amt small{text-align:left;font-weight:400;font-size:11px}
.empty{text-align:center;color:var(--mu);padding:20px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:6px 14px;font:inherit;font-size:13px;color:var(--tx);flex:1}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.sseg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:2px}
.sseg button{border:0;background:none;padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;color:var(--mu)}
.sseg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:0 1px 2px #0002}
.seg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;color:var(--tx)}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px #0002}
.seg button.on.exp{color:var(--exp)}.seg button.on.inc{color:var(--inc)}.seg button.on.tr{color:var(--tr)}
label,.fl{display:block;margin:8px 0;font-size:12px;color:var(--mu)}
input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;font:inherit;font-size:16px;background:var(--card);color:var(--tx)}
input:disabled,select:disabled{opacity:.5}
.inl{display:flex;gap:6px;align-items:stretch;margin-top:4px}.inl select,.inl input{margin-top:0!important;flex:1;min-width:0}.inl .mini{white-space:nowrap;font-weight:700;font-size:16px;padding:0 12px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}label.chk input{width:19px;height:19px}
.fxbox{background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:700}
.fxin{background:var(--soft2);border:1px solid var(--bd);border-radius:12px;padding:2px 12px 10px;margin:-4px 0 8px}
.qbox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:6px 12px 10px;margin:8px 0}
.qbox.exp{background:#fef2f2;border-color:#fecaca}
body.dark .qbox{background:#14281f;border-color:#1f4d36}body.dark .qbox.exp{background:#2a1618;border-color:#5b2328}
.qbox b{font-size:13px}
.amt-in{font-size:28px!important;text-align:center;font-weight:700;margin-top:8px!important}
.two{display:flex;gap:8px}.two>label,.two>.btn{flex:1;min-width:0}
.btn{display:block;width:100%;padding:10px;border:0;border-radius:10px;background:var(--p);color:#fff;font:inherit;font-size:14px;font-weight:700;margin-top:8px;cursor:pointer}
a.btn{text-align:center;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--p);border:1px solid var(--bd)}.btn.danger{color:var(--exp)}.btn:disabled{opacity:.4}.btn.dz{background:var(--exp);color:#fff}
.mini{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;color:var(--tx);white-space:nowrap;cursor:pointer}
.mini.pri{background:var(--p);color:#fff;border-color:var(--p)}
.mini.danger{color:var(--exp)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.badge{font-size:11px;padding:1px 8px;border-radius:20px;white-space:nowrap;display:inline-block;font-weight:600}
.badge.done{background:#dcfce7;color:#166534}.badge.wait{background:#fef9c3;color:#854d0e}.badge.late{background:#fee2e2;color:#991b1b}
.badge.rej{background:#e5e7eb;color:#374151}.badge.soon{background:#dbeafe;color:#1e40af}
.warn{background:#fef3c7;color:#78350f;padding:9px 12px;border-radius:12px;font-size:13px;margin:0 0 10px;cursor:pointer}
.tbl{overflow-x:auto;background:var(--card);border-radius:12px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;vertical-align:middle}th{background:var(--soft2);color:var(--mu);font-weight:600}
td input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--p)}
.pt input{min-width:130px;margin:0;padding:7px;font-size:14px}
.etbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.box{background:var(--card);border-radius:12px;padding:4px 12px 12px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 4px;font:inherit;font-size:11px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:5px}
.th i{width:24px;height:24px;border-radius:50%;background:var(--c)}.th.on{border-color:var(--p);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rbtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 4px;font:inherit;font-size:12px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.rbtn span{font-size:24px}
.phead{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}.phead h3,.phead h2{margin:0;flex:1;font-size:15px}
.pcard{margin-bottom:8px;cursor:pointer;background:var(--card);border-radius:12px;padding:10px 12px}
.pcard small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
details.gen{background:var(--soft2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0}
details.gen summary{cursor:pointer;font-weight:700;font-size:13px}
/* --- قوايم الشاشة اللي بتفتح وتقفل --- */
details.grp{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:14px;background:var(--soft2)}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:'▾';color:var(--mu);font-size:16px;transition:transform .2s}
details.grp[open]>summary::after{transform:rotate(180deg)}
details.grp[open]>summary{border-bottom:1px solid var(--bd)}
details.grp>summary .gs{margin-inline-start:auto;font-size:14px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.fth,.fadd{width:70px;height:80px;border:1px solid var(--bd);border-radius:10px;background:var(--soft2);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:22px;padding:0;color:var(--tx);font-family:inherit}
.fth img{width:100%;height:58px;object-fit:cover;background:var(--soft)}
.fth small,.fadd small{font-size:10px;color:var(--mu);max-width:66px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fadd{border-style:dashed;color:var(--p)}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
/* --- بيانات المطور --- */
.brand{position:relative;text-align:center;color:var(--mu);font-size:11px;margin-top:26px;line-height:1.7;display:flex;flex-direction:column;align-items:center;gap:8px}
.brand::before{content:'';position:absolute;top:4px;left:50%;width:240px;height:80px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--p),transparent);opacity:.28;filter:blur(20px);pointer-events:none}
.pill{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding:10px 30px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.2));backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 28px rgba(15,23,42,.13),inset 0 1px 0 rgba(255,255,255,.85)}
body.dark .pill{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-color:rgba(255,255,255,.14);box-shadow:0 10px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.pill b{color:var(--tx);font-size:13px}.pill .co{color:var(--p);font-weight:700;letter-spacing:.3px}
.brand a{color:var(--tx);text-decoration:none}
/* --- البنود اللي بتفتح --- */
.ckx{display:flex;align-items:flex-start;border-bottom:1px solid var(--soft)}.ckx:last-child{border-bottom:0}
.ckx>input[type=checkbox]{width:24px;height:24px;flex:0 0 24px;accent-color:#16a34a;margin:12px 12px 0 0}
.ckx>.cki{margin:12px 12px 0 0}
.ckx>details{flex:1;min-width:0}
.cki{width:24px;height:24px;flex:0 0 24px;border-radius:6px;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.xr{border-bottom:1px solid var(--soft)}.ckx .xr,.xr:last-child{border-bottom:0}
.xr summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.xr summary::-webkit-details-marker{display:none}
.xr summary::after{content:'▾';color:var(--mu);font-size:14px;transition:transform .2s;flex:0 0 auto}
.xr[open] summary::after{transform:rotate(180deg)}
.xr[open]{background:var(--soft2)}
.xr summary .grow b{display:block}.xr summary .grow small{display:block;color:var(--mu);font-size:11px;margin-top:1px}
.xr.done summary .grow>b{color:var(--inc)}
.xb{padding:0 12px 12px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd)}.kv span{color:var(--mu)}
.xl{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd);cursor:pointer}.xl:last-child{border-bottom:0}
.xl span{color:var(--mu);font-size:12px;white-space:nowrap}.xl .grow{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* --- الكروت والجداول --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:0 0 8px}
.kpi{border-radius:12px;padding:9px 10px;background:#f1f5f9;border-top:4px solid #94a3b8;min-width:0}
.kpi small{display:block;font-size:11px;color:#6b7280}.kpi b{font-size:15px;color:#1f2937;word-break:break-word}
.kpi.inc{background:#f0fdf4;border-color:#16a34a}.kpi.inc b{color:#15803d}
.kpi.exp{background:#fef2f2;border-color:#dc2626}.kpi.exp b{color:#b91c1c}
.kpi.net{background:#eff6ff;border-color:#2563eb}.kpi.net b{color:#1d4ed8}
.kpi.warn{background:#fffbeb;border-color:#d97706}.kpi.warn b{color:#b45309}
.ptbl{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:8px}
.ptbl th{background:var(--p);color:#fff;font-weight:700}
.ptbl tbody tr:nth-child(even) td{background:var(--soft2)}
.ptbl tfoot td{background:var(--soft);font-weight:800}
.ptbl td.wrap{white-space:normal;min-width:110px}
.ptbl tr.clk{cursor:pointer}.ptbl tr.clk:active td{background:var(--soft)}
.ptbl tr.hl td{background:#fff7ed!important}
.ptbl .inc{color:var(--inc)}.ptbl .exp{color:var(--exp)}
.pnote{padding:14px;text-align:center;color:var(--mu)}
.pb{display:flex;align-items:center;gap:6px;min-width:100px}.pbar{flex:1;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.inc,.tag.ok{background:#dcfce7;color:#166534!important}.tag.exp,.tag.late{background:#fee2e2;color:#991b1b!important}
.tag.wait{background:#fef9c3;color:#854d0e}.tag.rej{background:#e5e7eb;color:#374151}.tag.ctr,.tag.tr{background:#dbeafe;color:#1e40af}
/* --- التنبيهات --- */
.ncard{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-right:4px solid #2563eb;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ncard.late{border-right-color:#dc2626}.ncard.soon{border-right-color:#d97706}.ncard.ok{border-right-color:#16a34a}
.nic{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:0 0 38px}
.ncard b{display:block;font-size:13px}.ncard small{display:block;color:var(--mu);font-size:12px;margin-top:2px;line-height:1.5}
.nchev{color:var(--mu);font-size:18px;padding:0 4px;cursor:pointer}
.nempty{text-align:center;padding:26px 10px;color:var(--mu)}.nempty div{font-size:40px}.nempty b{display:block;color:var(--tx);font-size:15px;margin-top:4px}
#banner{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;width:min(94vw,520px);transform:translate(-50%,-160%);z-index:57;transition:transform .4s cubic-bezier(.2,.9,.3,1.15);cursor:pointer}
#banner.on{transform:translate(-50%,0)}
#banner .ncard{margin:0;box-shadow:0 12px 34px #0005}
.pg h3{margin-top:12px}
/* --- نافذة التأكيد --- */
#dlg{position:fixed;inset:0;z-index:58;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}
#dlg.on{display:flex}

/* ========== الإصدار والمطور ========== */

/* ========== ثوابت وأدوات ========== */
const KEY='masrofi-data-v1',BKEY='masrofi-lastbackup',NKEY='masrofi-notified',LKEY='masrofi-lock',BNKEY='masrofi-banner';

const COLORS=['#16a34a','#0f766e','#0891b2','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#475569'];
const PAL=['#0f766e','#2563eb','#db2777','#ea580c','#7c3aed','#ca8a04','#0891b2','#64748b'];
const THEMES={teal:{n:'أخضر',p:'#0f766e'},blue:{n:'أزرق',p:'#1d4ed8'},purple:{n:'بنفسجي',p:'#6d28d9'},rose:{n:'وردي',p:'#be185d'},orange:{n:'برتقالي',p:'#c2410c'},slate:{n:'رمادي',p:'#334155'},dark:{n:'داكن',p:'#14b8a6',dark:true}};
const LDEF={home:'الرئيسية',col:'التحصيلات',exps:'المصروفات',reports:'التقارير',more:'المزيد',settings:'الإعدادات',exp:'المصروفات',inc:'التحصيلات',expOne:'مصروف',incOne:'تحصيل',net:'الناتج',cur:'الشهر الحالي',fixed:'البنود الثابتة',contracts:'التحصيلات السنوية',inst:'الأقساط',docs:'المرفقات',items:'البنود',pm:'الحسابات',cash:'السحب الكاش'};

const EVERY=[[1,'شهري'],[2,'كل شهرين'],[3,'كل 3 شهور'],[4,'كل 4 شهور'],[6,'كل 6 شهور'],[12,'سنوي'],[18,'كل سنة ونص'],[24,'كل سنتين']];
const PERIODS=[['m','الشهر الحالي'],['pm','الشهر اللي فات'],['y','السنة الحالية'],['py','السنة اللي فاتت'],['all','كل الفترات'],['custom','فترة مخصصة']];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ym=(y,m)=>y+'-'+pad(m);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const r2=n=>Math.round(n*100)/100;
const num=n=>r2(n).toLocaleString('en-US');
const fmt=n=>num(n)+' ج.م';
const netTxt=n=>n<0?`${num(-n)} ج.م سالب`:fmt(n);
const netCls=n=>n<0?'exp':'net';
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
const dmy=d=>d?d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'—';
const fdate=d=>d?`${+d.slice(8)} ${MONTHS[+d.slice(5,7)-1]} ${d.slice(0,4)}`:'—';
const lastDay=key=>{const[y,m]=key.split('-').map(Number);return new Date(y,m,0).getDate()};
const mName=key=>{const[y,m]=key.split('-').map(Number);return MONTHS[m-1]+' '+y};
const mShort=key=>+key.slice(5)+'/'+key.slice(2,4);
const mRange=k=>[k+'-01',k+'-'+pad(lastDay(k))];
const prevKey=key=>{const[y,m]=key.split('-').map(Number);const d=new Date(y,m-2,1);return ym(d.getFullYear(),d.getMonth()+1)};
const mdiff=(a,b)=>{const[ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return(by*12+bm)-(ay*12+am)};
const daysBetween=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const addMonths=(d,k)=>{const[y,m,day]=d.split('-').map(Number);const t=new Date(y,m-1+k,1);const ld=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ym(t.getFullYear(),t.getMonth()+1)+'-'+pad(Math.min(day,ld))};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseNum(s){s=String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(/[,٬\s]/g,'');return parseFloat(s)}
const L=k=>(S&&S.settings&&S.settings.labels&&S.settings.labels[k])||LDEF[k];
const appName=()=>(S&&S.settings&&S.settings.appName)||DEF_NAME;
const hmode=k=>((S.settings&&S.settings.hw)||{})[k]||HWDEF[k];
const wOn=(k,rel)=>{const m=hmode(k);return m==='show'||(m==='auto'&&!!rel)};
const leadA=()=>+S.settings.leadA||15;
const leadI=()=>+S.settings.lead||10;
const actBadge=v=>v!==false?'<span class="badge done">مفعّل</span>':'<span class="badge rej">موقوف</span>';
const short=v=>v>=1e6?r2(v/1e6)+'M':v>=1e3?r2(v/1e3)+'K':String(Math.round(v));
const everyTxt=n=>(EVERY.find(x=>x[0]===+n)||[0,`كل ${n} شهر`])[1];
const leftTxt=l=>l<0?`متأخر ${-l} يوم`:l===0?'النهارده':`باقي ${l} يوم`;

/* ========== نافذة التأكيد داخل البرنامج ========== */
function ask(title,msg,o={}){
  return new Promise(res=>{
    const d=$('#dlg'),inp=$('#din'),yes=$('#dyes'),no=$('#dno'),isIn=o.input!=null;
    $('#dic').textContent=o.icon||'❓';$('#dtt').textContent=title;$('#dmsg').textContent=msg||'';$('#dmsg').style.display=msg?'':'none';
    inp.style.display=isIn?'':'none';inp.value=isIn?String(o.input):'';inp.setAttribute('inputmode',o.num?'decimal':'text');
    yes.textContent=o.ok||'تأكيد';yes.className='btn'+(o.danger?' dz':'');
    no.style.display=o.alert?'none':'';no.textContent=o.cancel||'إلغاء';
    d.classList.add('on');if(isIn)setTimeout(()=>{inp.focus();inp.select()},60);
    const done=v=>{d.classList.remove('on');yes.onclick=no.onclick=inp.onkeydown=null;res(v)};
    yes.onclick=()=>done(isIn?inp.value:true);no.onclick=()=>done(isIn?null:false);
    inp.onkeydown=e=>{if(e.key==='Enter')yes.onclick()};
  });
}
const askInput=(title,msg,def,numeric)=>ask(title,msg,{input:def??'',num:numeric,icon:'✏️',ok:'حفظ'});
const say=(title,msg,icon)=>ask(title,msg,{alert:true,ok:'تمام',icon:icon||'ℹ️'});

/* ========== تنبيه جوه البرنامج ========== */
let bnT;
function banner(ic,title,body,go,lv){
  const b=$('#banner');
  b.innerHTML=`<div class="ncard ${lv||'info'}"><div class="nic">${ic}</div><div class="grow"><b>${esc(title)}</b>${body?`<small>${esc(body)}</small>`:''}</div><span class="nchev" onclick="event.stopPropagation();hideBanner()">✕</span></div>`;
  b.onclick=()=>{hideBanner();if(go)go()};
  b.classList.add('on');clearTimeout(bnT);bnT=setTimeout(hideBanner,7000);
}
function hideBanner(){$('#banner').classList.remove('on')}
function inAppAlerts(force){
  if($('#lock').classList.contains('on'))return;
  const al=alerts();if(!al.length)return;
  const sig=today()+':'+al.map(a=>a.id).join(',');
  if(!force&&localStorage.getItem(BNKEY)===sig)return;
  localStorage.setItem(BNKEY,sig);
  const late=al.some(a=>a.lv==='late');
  setTimeout(()=>banner('🔔',al.length>1?`عندك ${al.length} تنبيه`:al[0].title,al.length>1?al.slice(0,2).map(a=>a.title).join(' · '):al[0].body,()=>openNotifs(),late?'late':'soon'),700);
}

/* ========== البيانات ========== */
function defaults(){
  const m=(name,type,color)=>({id:uid(),name,type,bank:'',color,active:true});
  const c=(name,kind)=>({id:uid(),name,kind,active:true});
  return {version:5,
    methods:[m('كاش','cash','#16a34a')],
    cats:[...['أكل وشرب','مواصلات وبنزين','فواتير ومرافق','إيجار','صحة وعلاج','أخرى'].map(n=>c(n,'exp')),c('الراتب','inc')],
    txs:[],closed:{},cash:[],docs:[],plans:[],fmeta:{},settings:{}};
}
function migrate(d){
  const now=new Date(),nk=ym(now.getFullYear(),now.getMonth()+1);
  if((d.version||1)<3){
    d.annual=d.annual||[];
    (d.cats||[]).filter(c=>c.kind==='inc'&&c.freq==='yearly').forEach(c=>{
      const used=(d.txs||[]).some(t=>t.cat===c.id),plan=c.plan||{};
      if(used||Object.keys(plan).length||c.name!=='أرباح سنوية')d.annual.push({id:uid(),name:c.name,due:pad(c.dueMonth||1)+'-01',note:'',active:c.active!==false,amounts:{...plan},st:{}});
      if(!used)d.cats=d.cats.filter(x=>x!==c);
    });
  }
  if((d.version||1)<4){
    d.recur=d.recur||[];
    (d.monthly||[]).forEach(i=>{
      const sk=i.start||nk;
      const r={id:i.id,name:i.name,kind:'fixed',amount:+i.amount||0,every:1,start:sk+'-'+pad(Math.min(+i.day||1,28)),pct:0,note:i.note||'',active:i.active!==false,amt:{},st:{}};
      Object.entries(d.mst||{}).forEach(([key,recs])=>{const rec=(recs||{})[i.id];if(!rec)return;const k=mdiff(sk,key);if(k>=0)r.st[k]=rec});
      d.recur.push(r);
    });
    (d.annual||[]).forEach(a=>{
      const am=a.amounts||{},years=Object.keys(am).concat(Object.keys(a.st||{})).map(Number).filter(Boolean);
      const y0=years.length?Math.min(...years):now.getFullYear();
      const r={id:a.id,name:a.name,kind:'contract',amount:+am[y0]||0,every:12,start:`${y0}-${a.due||'01-01'}`,pct:0,note:a.note||'',active:a.active!==false,amt:{},st:{}};
      Object.entries(am).forEach(([y,v])=>{r.amt[+y-y0]=+v});
      Object.entries(a.st||{}).forEach(([y,rec])=>{r.st[+y-y0]=rec});
      Object.keys(am).map(Number).forEach(y=>{if(y<now.getFullYear()&&!r.st[y-y0])r.st[y-y0]={st:'old'}});
      d.recur.push(r);
    });
    delete d.monthly;delete d.mst;delete d.annual;delete d.expected;
  }
  if((d.version||1)<5){
    (d.recur||[]).forEach(r=>{
      let c=d.cats.find(x=>x.kind==='inc'&&x.name===r.name);
      if(!c){c={id:uid(),name:r.name,kind:'inc',active:true};d.cats.push(c)}
      Object.assign(c,{fixed:true,amount:+r.amount||0,every:+r.every||1,start:r.start,pct:+r.pct||0,note:r.note||c.note||'',amt:r.amt||{},st:r.st||{}});
      if(r.active===false)c.active=false;
      (d.txs||[]).forEach(t=>{if(t.src&&t.src.k==='r'&&t.src.id===r.id)t.src.id=c.id});
      ((d.settings||{}).pins||[]).forEach(p=>{if(p.type==='recur'&&p.ref===r.id){p.type='cat';p.ref=c.id}});
    });
    delete d.recur;
  }
  d.version=5;return d;
}
function normalize(d){
  d.methods=d.methods||[];d.cats=d.cats||[];d.closed=d.closed||{};
  d.txs=(d.txs||[]).map(t=>({...t,amount:+t.amount||0}));
  migrate(d);
  d.cats=d.cats.map(c=>({files:[],amt:{},st:{},every:1,pct:0,...c}));
  d.cash=(d.cash||[]).map(c=>({...c,amount:+c.amount||0}));
  d.docs=(d.docs||[]).map(x=>({files:[],...x}));d.plans=(d.plans||[]).map(p=>({files:[],items:[],...p}));d.fmeta=d.fmeta||{};
  d.settings=Object.assign({lead:10,leadA:15,appName:DEF_NAME,theme:'teal',labels:{},hw:{},pins:[]},d.settings||{});
  if(!d.settings.appName||d.settings.appName==='مصروفي')d.settings.appName=DEF_NAME;
  return d;
}
let S=null;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}S=normalize(S&&S.methods?S:defaults())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('مشكلة في الحفظ: المساحة ممكن تكون خلصت')}}
const M=id=>S.methods.find(x=>x.id===id);
const C=id=>S.cats.find(x=>x.id===id);
const R=C;
const isClosed=date=>!!S.closed[date.slice(0,7)];
const keyTx=k=>S.txs.filter(t=>t.date.startsWith(k+'-'));
function sums(l){let inc=0,exp=0;for(const t of l){if(t.type==='inc')inc+=t.amount;else if(t.type==='exp')exp+=t.amount}return{inc,exp,net:inc-exp}}
function pmStats(list){
  return S.methods.map(m=>{let i=0,o=0,n=0;list.forEach(t=>{if(t.method!==m.id)return;n++;if(t.type==='exp')o+=t.amount;else if(t.type==='inc')i+=t.amount});return{m,i,o,n}})
    .filter(x=>x.m.active||x.i||x.o).sort((a,b)=>(b.o+b.i)-(a.o+a.i));
}
const byDesc=(a,b)=>b.date.localeCompare(a.date)||b.created-a.created;
const byAsc=(a,b)=>a.date.localeCompare(b.date)||a.created-b.created;

async function compressImg(f){
  try{
    const url=URL.createObjectURL(f);const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
    const sc=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));return b&&b.size<f.size?b:f;
  }catch(e){return f}
}

function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));return Math.ceil(m/p*2)/2*p}
function svgChart(labels,series,type,o={}){
  const W=640,H=280,pl=52,pr=12,pt=30,pb=38,n=labels.length,id=o.id||'c';
  const max=Math.max(1,...series.flatMap(s=>s.values)),top=niceMax(max),cw=(W-pl-pr)/n,ih=H-pt-pb,base=H-pb;
  const y=v=>pt+ih*(1-v/top),xc=i=>pl+cw*(n-1-i)+cw/2,showV=n*series.length<=14;
  let defs='',g='';
  series.forEach((s,si)=>defs+=`<linearGradient id="${id}g${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="1"/><stop offset="1" stop-color="${s.color}" stop-opacity=".6"/></linearGradient>`);
  if(o.hi!=null&&o.hi>=0)g+=`<rect x="${xc(o.hi)-cw/2+3}" y="${pt-22}" width="${cw-6}" height="${ih+22}" rx="10" fill="#94a3b8" fill-opacity=".13"/>`;
  for(let i=0;i<=4;i++){const v=top*i/4,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#94a3b8" stroke-opacity="${i?.25:.55}" ${i?'stroke-dasharray="4 5"':''}/><text x="${pl-8}" y="${yy+4}" font-size="12" text-anchor="end" fill="#94a3b8">${short(v)}</text>`}
  const gap=Math.min(6,cw*.06),bw=Math.min(34,(cw*.76-gap*(series.length-1))/series.length),tw=bw*series.length+gap*(series.length-1);
  series.forEach((s,si)=>s.values.forEach((v,i)=>{
    const bx=xc(i)-tw/2+si*(bw+gap),hh=v?Math.max(3,base-y(v)):0;
    if(hh)g+=`<rect x="${bx}" y="${base-hh}" width="${bw}" height="${hh}" rx="${Math.min(7,bw/2)}" fill="url(#${id}g${si})"/>`;
    if(showV&&v)g+=`<text x="${bx+bw/2}" y="${base-hh-6}" font-size="${series.length>1?11:12}" font-weight="700" text-anchor="middle" fill="${s.color}">${short(v)}</text>`;
  }));
  labels.forEach((l,i)=>g+=`<text x="${xc(i)}" y="${H-12}" font-size="12" text-anchor="middle" fill="${i===o.hi?'currentColor':'#94a3b8'}" font-weight="${i===o.hi?700:400}">${esc(l)}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" class="svgc"><defs>${defs}</defs>${g}</svg>`;
}

function alerts(){
  const out=[],td=today();
  FX().filter(r=>r.active!==false).forEach(r=>{
    const ann=isAnn(r),lim=ann?leadA():0,inc=r.kind==='inc';
    for(let k=0;k<1000;k++){
      const d=occDate(r,k),left=daysBetween(d,td);
      if(left>lim)break;
      if(left<-62)continue;
      if(stOf(occRec(r,k)).st!=='wait')continue;
      const amt=occAmt(r,k),w=inc?'تحصيل':'دفع';
      if(ann){
        const last=lastDone(r);
        out.push({id:`c-${r.id}-${k}`,ic:'📆',lv:left<0?'late':'soon',title:left<0?`${w} ${r.name} متأخر ${-left} يوم`:left===0?`النهارده ميعاد ${w} ${r.name}`:`${w} ${r.name} ميعاده قرب، باقي ${left} يوم`,body:`الميعاد ${fdate(d)} · المبلغ ${fmt(amt)}${r.pct?` (زيادة ${r.pct}%)`:''}${last?` · المرة اللي فاتت ${fmt(last.amount)}`:''}${r.note?' · '+r.note:''}`,go:`openRep('contracts')`});
      }else{
        out.push({id:`f-${r.id}-${k}`,ic:inc?'💼':'🧾',lv:'late',title:`${r.name}: ${inc?'لم يتم تحصيله':'لم يتم دفعه'} إلى الآن`,body:`${mName(d.slice(0,7))} · المتوقع ${fmt(amt)}${r.note?' · '+r.note:''}`,go:inc?`openRep('cols',()=>RF.month='${d.slice(0,7)}')`:`openRep('month',()=>RF.month='${d.slice(0,7)}')`});
      }
    }
  });
  S.plans.forEach(p=>{
    const un=p.items.filter(it=>!itTx(it)&&it.due).sort((a,b)=>a.due.localeCompare(b.due));if(!un.length)return;
    const late=un.filter(it=>it.due<td),nx=un[0],left=daysBetween(nx.due,td),go=`openRep('inst',()=>RF.plan='${p.id}')`;
    if(late.length)out.push({id:`i-${p.id}-late-${late.length}`,ic:'🏦',lv:'late',title:`${p.name}: ${late.length} قسط متأخر`,body:`أقدم قسط ${fdate(late[0].due)} · ${fmt(+late[0].amount||0)}`,go});
    else if(left<=leadI())out.push({id:`i-${p.id}-${nx.id}`,ic:'🏦',lv:'soon',title:left?`قسط ${p.name} باقي عليه ${left} يوم`:`النهارده ميعاد قسط ${p.name}`,body:`${fdate(nx.due)} · ${fmt(+nx.amount||0)}`,go});
  });
  const pk=prevKey(NKM);
  if(!S.closed[pk]&&keyTx(pk).length)out.push({id:'close-'+pk,ic:'🔓',lv:'info',title:`${mName(pk)} لسه مفتوح`,body:'اقفله عشان الأرقام تتثبت',go:`go('months')`});
  const lb=localStorage.getItem(BKEY);
  if(S.txs.length&&(!lb||(Date.now()-new Date(lb))/864e5>30))out.push({id:'backup',ic:'💾',lv:'info',title:'وقت النسخة الاحتياطية',body:lb?'آخر نسخة من أكتر من شهر':'لسه معملتش نسخة احتياطية',go:`stab='data';go('settings')`});
  return out;
}

async function pushAlerts(){

    const sent=JSON.parse(localStorage.getItem(NKEY)||'{}'),td=today();
    const list=alerts().filter(a=>sent[a.id]!==td);if(!list.length)return;
    if(list.length>3)await showNotif(`${appName()}: عندك ${list.length} تنبيه`,{body:list.slice(0,3).map(a=>a.ic+' '+a.title).join('\n'),tag:'masrofi-sum'});

/* ========== القفل: رقم سري + بصمة ========== */
async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('masrofi:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of 'masrofi:'+s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}
}
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

  try{
    if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return toast('الجهاز ده مش بيدعم البصمة');
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:appName()},user:{id:rnd(16),name:'masrofi-user',displayName:appName()},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    LK.bio=b64(c.rawId);saveLK();render();toast('اتفعّلت البصمة ✓');
  }catch(e){toast('ما اتفعّلتش البصمة')}
}

  if(!LK.bio)return;
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(LK.bio)}],userVerification:'required',timeout:60000}});unlock()}

}

  });

  if(!occ.length)return h+'<p class="empty">لا يوجد تحصيلات سنوية في السنة دي</p>';
  const row=o=>{

      <div class="etbar" style="margin:8px 0 0">${done||old?'':`<button class="mini pri" onclick="occSheet('${o.r.id}',${o.k})">✏️ تعديل</button>`}<button class="mini" onclick="contractSheet('${o.r.id}')">📄 السجل</button><button class="mini" onclick="catForm('${o.r.id}')">⚙️ البند</button></div>`;

  const inc=r.kind==='inc',date=occDate(r,k),prev=k>0?occActual(r,k-1):null,meths=S.methods.filter(m=>m.active);

async function occCollect(id,k,quick){

    method=r.acct&&M(r.acct)?r.acct:defMethod();date=defCollectDate(occDate(r,k));

function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function parseSchedule(text){
  const t=text.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
  const out=[];
  t.split(/\n+/).forEach(line=>{
    let due=null,l=line,m=l.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
    if(m){due=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;l=l.replace(m[0],' ')}
    else if((m=l.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;due=`${y}-${pad(+m[2])}-${pad(+m[1])}`;l=l.replace(m[0],' ')}
    if(!due)return;
    const[,Mo,D]=due.split('-').map(Number);if(Mo<1||Mo>12||D<1||D>31)return;
    const nums=(l.match(/\d[\d,]*(\.\d+)?/g)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>x>=10);
    if(!nums.length)return;
    out.push({id:uid(),due,amount:String(Math.max(...nums))});
  });
  return out;
}
function ocrStart(){
  grabPF();
  pickFiles('img',async ids=>{
    if(!ids.length)return;
    PF.files=PF.files.concat(ids);planForm();
    const st=()=>$('#ocrst');
    try{
      st()&&(st().innerHTML='<p class="warn">⏳ جاري تجهيز القراءة...</p>');
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const w=await Tesseract.createWorker('ara+eng',1,{logger:m=>{if(m.status==='recognizing text'&&st())st().innerHTML=`<p class="warn">⏳ جاري قراءة الصورة ${Math.round(m.progress*100)}%</p>`}});
      let rows=[];for(const id of ids){const r=await FDB.get(id);const{data}=await w.recognize(r.blob);rows=rows.concat(parseSchedule(data.text))}
      await w.terminate();
      grabPF();PF.items=PF.items.concat(rows);planForm();
      toast(rows.length?`اتقرا ${rows.length} قسط ✓ راجعهم قبل الحفظ`:'ما قدرتش أقرا أقساط من الصورة');
    }catch(e){if(st())st().innerHTML='';toast('القراءة ما نفعتش، اتأكد من النت')}
  });
}

function bCmp(){
  let ks=[];
  if(RF.crange.startsWith('y:')){const y=+RF.crange.slice(2);for(let i=1;i<=12;i++)ks.push(ym(y,i))}
  else{const n=+RF.crange;for(let i=n-1;i>=0;i--){const d=new Date(NY,NM-1-i,1);ks.push(ym(d.getFullYear(),d.getMonth()+1))}}
  const cc=RF.ccat,kind=cc==='ALL_INC'?'inc':cc==='ALL_EXP'?'exp':(C(cc)?.kind||'exp');
  const name=cc==='ALL_EXP'?'كل '+L('exp'):cc==='ALL_INC'?'كل '+L('inc'):(C(cc)?.name||'—');
  const match=t=>cc==='ALL_EXP'?t.type==='exp':cc==='ALL_INC'?t.type==='inc':t.cat===cc;
  const vals=ks.map(k=>keyTx(k).filter(match).reduce((a,t)=>a+t.amount,0));
  const tot=vals.reduce((a,b)=>a+b,0),avg=tot/ks.length,mxv=Math.max(...vals);
  const mx=vals.indexOf(mxv),nz=vals.filter(v=>v>0),mn=nz.length?vals.indexOf(Math.min(...nz)):-1;
  const color=kind==='exp'?'#dc2626':'#16a34a',isAll=cc.startsWith('ALL_');
  let ups=0;

    const v=vals[i],pv=i?vals[i-1]:null,d=pv==null?null:v-pv,pc=pv?d/pv*100:null;

    const dc=d==null?'—':`<span class="${(kind==='exp'?d>0:d<0)?'exp':'inc'}">${d>0?'+':''}${num(d)}</span>`;
    const [f,t]=mRange(k);
    return `<tr class="clk ${i===mx&&v>0?'hl':''}" onclick="${dS(f,t,isAll?'':cc,kind)}"><td><b>${mName(k)}</b></td><td><b>${num(v)}</b></td><td>${dc}</td><td>${pc==null?'—':(pc>0?'+':'')+Math.round(pc)+'%'}</td><td>${st}</td><td>${pbar(mxv?v/mxv*100:0,color)}</td></tr>`;
  });
  let b=kpis([['الإجمالي',fmt(tot),kind],['المتوسط الشهري',fmt(avg),'net'],['أعلى شهر',vals[mx]?`${MONTHS[+ks[mx].slice(5)-1]} · ${num(vals[mx])}`:'—','warn'],['أقل شهر',mn>=0?`${MONTHS[+ks[mn].slice(5)-1]} · ${num(vals[mn])}`:'—'],['شهور زادت',ups]]);
  b+=sec('الرسم البياني')+`<div class="pchart">${svgChart(ks.map(k=>ks.length<=6?MONTHS[+k.slice(5)-1]:mShort(k)),[{name,color,values:vals}],'bars',{id:'rc',hi:mx})}</div>`;
  b+=sec('مقارنة شهر بشهر')+tbl(['الشهر','المبلغ','الفرق عن اللي قبله','التغيير','الحالة',''],rows,`<tr><td>الإجمالي</td><td>${num(tot)}</td><td colspan="4">المتوسط: ${num(avg)}</td></tr>`);
  return{title:'مقارنة: '+name,sub:`${mName(ks[0])} - ${mName(ks[ks.length-1])}`,body:b,
    csv:{head:['الشهر','المبلغ','الفرق','التغيير %'],rows:ks.map((k,i)=>{const pv=i?vals[i-1]:null;return[mName(k),vals[i],pv==null?'':vals[i]-pv,pv?Math.round((vals[i]-pv)/pv*100):'']})}};

function newTx(type){
  const act=S.methods.filter(m=>m.active),dm=defMethod();
  if(!dm){toast('ضيف حساب الأول');TXBACK=false;F=null;return editMethod()}
  F={id:null,type:type||'exp',amount:'',cat:'',newCat:'',method:dm,to:(act.find(m=>m.id!==dm)||{}).id||'',via:'',date:today(),note:'',files:[],created:0};
  txForm();
}
function editTx(id){const t=S.txs.find(x=>x.id===id);if(!t)return;F={...t,amount:String(t.amount),cat:t.cat||'',newCat:'',via:t.via||'',to:t.to||'',note:t.note||'',files:[...(t.files||[])]};txForm()}
function grab(){
  const v=s=>$(s)?$(s).value:null;
  if(v('#f-amt')!==null)F.amount=v('#f-amt');if(v('#f-d')!==null)F.date=v('#f-d');if(v('#f-n')!==null)F.note=v('#f-n');
  if(v('#f-m')!==null)F.method=v('#f-m');if(v('#f-to')!==null)F.to=v('#f-to');if(v('#f-cat')!==null)F.cat=v('#f-cat');
  if(v('#f-new')!==null)F.newCat=v('#f-new');if(v('#f-v')!==null)F.via=v('#f-v');
}
function catPicked(v){
  grab();F.cat=v;const c=C(v);
  if(c&&c.fixed){if(!parseNum(F.amount))F.amount=String(c.amount||'');if(c.acct&&M(c.acct))F.method=c.acct;if(c.via)F.via=c.via}
  txForm();if(v==='__new')setTimeout(()=>$('#f-new')&&$('#f-new').focus(),80);
}
function setTxType(k){grab();if(k!==F.type){F.type=k;F.cat='';F.newCat=''}txForm()}
function txForm(){
  const orig=F.id&&S.txs.find(t=>t.id===F.id),locked=orig&&isClosed(orig.date),inc=F.type==='inc',tr=F.type==='tr';
  const cats=S.cats.filter(c=>c.kind===F.type&&(c.active!==false||c.id===F.cat));
  const meths=S.methods.filter(m=>m.active||m.id===F.method||m.id===F.to);
  const addAcct=`<button type="button" class="mini" title="حساب جديد" onclick="grab();TXBACK=true;editMethod()">+</button>`;
  sheet(`<h2>${F.id?'✏️ تعديل العملية':tr?'تحويل بين حساباتك':inc?'تحصيل جديد':'مصروف جديد'}</h2>
  ${locked?'<p class="warn">🔒 الشهر ده مقفول</p>':''}
  ${orig&&isAnnualTx(orig)?'<p class="warn">📆 ده بند سنوي، ولو مسحته هيرجع "منتظر" في الجدول السنوي</p>':''}
  <div class="seg">${[['inc','💰 تحصيل'],['exp','💸 مصروف'],['tr','🔁 تحويل']].map(([k,l])=>`<button class="${F.type===k?'on '+k:''}" onclick="setTxType('${k}')">${l}</button>`).join('')}</div>
  <input id="f-amt" class="amt-in" type="text" inputmode="decimal" placeholder="0" value="${esc(F.amount)}">
  ${tr?`<label>من حساب<div class="inl"><select id="f-m">${opt(meths,F.method)}</select>${addAcct}</div></label>
    <label>إلى حساب<div class="inl"><select id="f-to">${opt(meths,F.to)}</select>${addAcct}</div></label>
    <label>الطريقة<select id="f-v">${viaOpts(F.via)}</select></label>`
  :`<label>البند<select id="f-cat" onchange="catPicked(this.value)"><option value="">— اختار البند —</option>${cats.map(c=>`<option value="${c.id}" ${c.id===F.cat?'selected':''}>${c.fixed?'📌 ':''}${esc(c.name)}</option>`).join('')}<option value="__new" ${F.cat==='__new'?'selected':''}>➕ بند جديد...</option></select></label>
    ${F.cat==='__new'?`<label>اسم البند الجديد<input id="f-new" value="${esc(F.newCat||'')}" placeholder="${inc?'مثلاً: مشروع كذا':'مثلاً: طازة'}"></label>`:''}
    <div class="two"><label>${inc?'استلمت في حساب':'دفعت من حساب'}<div class="inl"><select id="f-m">${opt(meths,F.method)}</select>${addAcct}</div></label>
    <label>الطريقة<select id="f-v">${viaOpts(F.via)}</select></label></div>`}
  <div class="two"><label>التاريخ<input id="f-d" type="date" value="${F.date}"></label><label>ملاحظة<input id="f-n" type="text" value="${esc(F.note)}"></label></div>
  <div class="fl">المرفقات</div>${filesBox(F.files,'tx')}
  <button class="btn" onclick="saveTx()" ${locked?'disabled':''}>سجّل</button>
  ${F.id&&!locked?'<button class="btn ghost danger" onclick="delTx()">حذف العملية</button>':''}`);
}
function saveTx(){
  grab();const amount=parseNum(F.amount);
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!F.date)return toast('اختار التاريخ');
  if(isClosed(F.date))return toast(`شهر ${mName(F.date.slice(0,7))} مقفول`);
  if(!F.method)return toast('اختار الحساب');
  const t={id:F.id||uid(),type:F.type,amount,method:F.method,via:F.via||'',date:F.date,note:(F.note||'').trim(),files:F.files||[],created:F.created||Date.now()};
  if(F.type==='tr'){if(!F.to||F.to===F.method)return toast('اختار حسابين مختلفين');t.to=F.to}
  else{
    let cid=F.cat;
    if(cid==='__new'){const n=(F.newCat||'').trim();if(!n)return toast('اكتب اسم البند الجديد');const c=ensureCat(n,F.type);c.active=true;cid=c.id}
    if(!cid||!C(cid))return toast('اختار البند');
    t.cat=cid;
  }
  if(F.src&&F.type!=='tr')t.src=F.src;
  const i=S.txs.findIndex(x=>x.id===t.id);if(i>=0)S.txs[i]=t;else S.txs.push(t);
  save();closeSheet();render();refreshRV();toast('اتسجّلت ✓');
}
async function delTx(){
  if(!await ask('حذف العملية؟',`${F.type==='tr'?'تحويل':C(F.cat)?.name||''} · ${fmt(parseNum(F.amount)||0)}`,{danger:true,icon:'🗑',ok:'حذف'}))return;
  S.txs=S.txs.filter(t=>t.id!==F.id);
  S.plans.forEach(p=>p.items.forEach(it=>{if(it.txId===F.id)it.txId=null}));
  save();closeSheet();render();refreshRV();toast('اتمسحت');
}

/* ========== النسخ الاحتياطي ========== */
const blob2b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function backupBlob(){
  toast('⏳ جاري تجهيز النسخة...');
  const files=[];
  for(const id of Object.keys(S.fmeta||{})){try{const r=await FDB.get(id);if(r)files.push({id,name:r.name,type:r.type,data:await blob2b64(r.blob)})}catch(e){}}
  return new Blob([JSON.stringify({app:'masrofi',appVersion:APP_VERSION,exported:new Date().toISOString(),data:S,files})],{type:'application/json'});
}
const backupName=()=>`fawzy-folio-backup-${today()}.json`;
function markBackup(){localStorage.setItem(BKEY,today());render()}
async function backup(){dlBlob(await backupBlob(),backupName());markBackup();toast('اتنزلت النسخة ✓')}
async function driveBackup(){
  const f=new File([await backupBlob()],backupName(),{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:appName()+' backup'});markBackup();toast('اختار Drive من القايمة ✓');return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  dlBlob(f,f.name);markBackup();
  sheet(`<h2>☁️ حفظ على Google Drive</h2><div class="ncard ok" style="cursor:default"><div class="nic">⬇️</div><div class="grow"><b>النسخة اتنزلت على جهازك</b><small>${esc(f.name)}</small></div></div>
  <div class="ncard" style="cursor:default"><div class="nic">☁️</div><div class="grow"><b>افتح Google Drive وارمي الملف جواه</b><small>من فولدر التنزيلات (Downloads)</small></div></div>
  <a class="btn" href="https://drive.google.com/drive/my-drive" target="_blank" rel="noopener">فتح Google Drive</a>`);
}
function restore(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{
    let root;try{root=JSON.parse(r.result)}catch(e){return say('ملف غير صالح','الملف ده مش نسخة احتياطية من التطبيق','⚠️')}
    const d=root.data||root,files=root.files||[];
    if(!Array.isArray(d.methods)||!Array.isArray(d.txs))return say('ملف غير صالح','الملف ده مش نسخة احتياطية من التطبيق','⚠️');
    if(!await ask('استرجاع النسخة؟',`فيها ${d.txs.length} عملية و ${files.length} مرفق.\nهتستبدل البيانات الحالية.`,{icon:'⬆️',ok:'استرجاع',danger:true}))return;
    toast('⏳ جاري الاسترجاع...');
    for(const x of files){try{const b=await (await fetch(x.data)).blob();await FDB.put({id:x.id,blob:b,name:x.name,type:x.type})}catch(e){}}
    S=normalize(d);save();applyTheme();applyName();go('home');toast('اتسترجعت البيانات ✓');
  };
  r.readAsText(f);
}
async function resetAll(){
  if(!await ask('مسح كل البيانات؟','هتمسح كل العمليات والمرفقات والإعدادات من الجهاز ده',{danger:true,icon:'⚠️',ok:'مسح'}))return;
  if(!await ask('آخر تأكيد','المسح مش هيترجع. عندك نسخة احتياطية؟',{danger:true,icon:'🗑',ok:'امسح كل حاجة'}))return;
  S=normalize(defaults());save();gcFiles();applyTheme();applyName();go('home');toast('اتمسح كل شيء');
}

/* ========== تشغيل ========== */
$('#hd').textContent=NOW.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
applyTheme();applyName();save();render();gcFiles();
if(LK.pin){showLock();if(LK.bio)setTimeout(()=>bioUnlock(true),400)}else inAppAlerts();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>setTimeout(pushAlerts,1500)).catch(()=>{}));
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(LK.pin&&hiddenAt&&(Date.now()-hiddenAt)/60000>=(LK.after??1))showLock();
  updateBell();pushAlerts();inAppAlerts();
});
</script>
</body>
