<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفي">
<meta name="author" content="Eng.Ahmed Fawzy - DETech Solutions">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مصروفي</title>
<style>
:root{--p:#0f766e;--bg:#f4f6f8;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--inc:#16a34a;--exp:#dc2626;--tr:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:var(--p);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px}header span{font-size:13px;opacity:.85}
main{max-width:560px;margin:auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;align-items:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px}
nav button span{font-size:20px}nav button.on{color:var(--p);font-weight:700}
nav .fab{flex:0 0 58px;height:58px;border-radius:50%;background:var(--p);color:#fff;font-size:32px;margin:-30px 6px 0;box-shadow:0 4px 14px #0f766e66;justify-content:center;line-height:1}
h3{font-size:15px;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--mu);font-weight:400}
.mbar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:12px;padding:6px;margin-bottom:10px}
.mbar button{width:42px;height:40px;border:0;background:#f1f5f9;border-radius:10px;font-size:22px;color:var(--tx)}
.lock{font-size:12px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-weight:400}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cards.c3{grid-template-columns:1fr 1fr 1fr}.cards.c3 b{font-size:14px}.cards.c3 .card{padding:10px}
.card{background:#fff;border-radius:14px;padding:12px 14px}.card small{display:block;color:var(--mu);font-size:12px;margin-bottom:2px}.card b{font-size:18px}
.card.inc b{color:var(--inc)}.card.exp b{color:var(--exp)}.card.net{margin-bottom:10px}
.pos{color:var(--inc)!important}.neg{color:var(--exp)!important}
.list{background:#fff;border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #f1f3f5;cursor:pointer}.row:last-child{border-bottom:0}
a.row{color:inherit;text-decoration:none}
.row.off{opacity:.5}.row.zero{opacity:.55}.row.col{flex-direction:column;align-items:stretch}
.rowin{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.grow{flex:1;min-width:0}.grow small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 36px;font-weight:700}
.ic.exp{background:#fee2e2;color:var(--exp)}.ic.inc{background:#dcfce7;color:var(--inc)}.ic.tr{background:#dbeafe;color:var(--tr)}
.amt{text-align:left;font-weight:700;white-space:nowrap}.amt.exp{color:var(--exp)}.amt.inc{color:var(--inc)}.amt.tr{color:var(--tr)}
.amt small{text-align:left;font-weight:400}
.bar{height:6px;background:#eef0f2;border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
i.inc{background:var(--inc)}i.exp{background:var(--exp)}
.acc{background:#fff;border-radius:14px;margin:10px 0;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:8px;padding:15px 14px;font-weight:700;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary span{flex:1}
.acc summary::after{content:'▾';color:var(--mu);font-size:18px;transition:transform .2s}
.acc[open] summary::after{transform:rotate(180deg)}
.accb{border-top:1px solid var(--bd)}
.addbtn{display:block;width:100%;background:#f0fdfa;color:var(--p);border:0;border-top:1px solid var(--bd);padding:13px;font:inherit;font-weight:700}
.day{font-size:12px;color:var(--mu);margin:14px 4px 6px}
.empty{text-align:center;color:var(--mu);padding:24px 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:14px;color:var(--tx)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.seg{display:flex;background:#e9edf0;border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font:inherit;color:var(--tx)}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px #0002}
.seg button.on.exp{color:var(--exp)}.seg button.on.inc{color:var(--inc)}.seg button.on.tr{color:var(--tr)}
label,.fl{display:block;margin:10px 0;font-size:13px;color:var(--mu)}
input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--bd);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--tx)}
.inl{display:flex;gap:8px;align-items:stretch;margin-top:4px}.inl select{margin-top:0;flex:1}.inl .mini{white-space:nowrap;font-weight:700;color:var(--p)}
label.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:15px}label.chk input{width:20px;height:20px}
.amt-in{font-size:32px!important;text-align:center;font-weight:700;margin-top:10px!important}
.two{display:flex;gap:8px}.two>label,.two>.btn{flex:1}.two>.btn{margin-top:0}
.plan{background:#f8fafc;border:1px solid var(--bd);border-radius:12px;padding:2px 12px 10px;margin-top:8px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--p);color:#fff;font:inherit;font-weight:700;margin-top:10px}
.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--bd)}.btn.danger{color:var(--exp)}.btn:disabled{opacity:.4}
.mini{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 14px;font:inherit;font-size:13px;color:var(--tx)}
.mini.pri{background:var(--p);color:#fff;border-color:var(--p)}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap}
.badge.done{background:#dcfce7;color:#166534}.badge.wait{background:#fef9c3;color:#854d0e}.badge.late{background:#fee2e2;color:#991b1b}
.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.7}
.alert.info{background:#eff6ff;border-color:#bfdbfe}
.warn{background:#fef3c7;padding:10px;border-radius:10px;font-size:14px}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;background:#fff;border-radius:12px;padding:12px 8px 6px;margin:4px 0}
.cm{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px}
.bars i{width:42%;max-width:11px;border-radius:3px 3px 0 0;min-height:1px}
.cm small{font-size:11px;color:var(--mu);margin-top:4px}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mu);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px}
.tbl{overflow-x:auto;background:#fff;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{background:#f8fafc;color:var(--mu);font-weight:600}
td:nth-child(2){white-space:normal;min-width:110px}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
.ltr{direction:ltr;text-align:right;display:block}
#sheet{position:fixed;inset:0;z-index:20;visibility:hidden}#sheet.open{visibility:visible}
#sheet .bk{position:absolute;inset:0;background:#0007;opacity:0;transition:opacity .2s}#sheet.open .bk{opacity:1}
#sheet .body{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .25s}
#sheet.open .body{transform:none}#sheet h2{margin:2px 0 8px;font-size:18px}
#toast{position:fixed;bottom:110px;left:50%;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.25s;z-index:30;pointer-events:none;font-size:14px;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--mu);font-size:12px;margin-top:22px;line-height:1.8}
</style>
</head>
<body>
<header><h1>مصروفي</h1><span id="hd"></span></header>
<main id="view"></main>
<nav>
  <button data-v="home" onclick="go('home')"><span>🏠</span>الرئيسية</button>
  <button data-v="txs" onclick="go('txs')"><span>📋</span>الحركات</button>
  <button class="fab" onclick="newTx()" aria-label="حركة جديدة">+</button>
  <button data-v="reports" onclick="go('reports')"><span>📊</span>التقارير</button>
  <button data-v="settings" onclick="go('settings')"><span>⚙️</span>الإعدادات</button>
</nav>
<div id="sheet"><div class="bk" onclick="closeSheet()"></div><div class="body"></div></div>
<div id="toast"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden onchange="restore(this)">

<script>
/* ========== الإصدار والمطور ========== */
const APP_VERSION='1.1.1';
const APP_BUILD='11/10/2026 - 11:40 ص';
const DEV={name:'Eng.Ahmed Fawzy',company:'DETech Solutions',phones:['01285258400','01060008747']};

/* ========== ثوابت وأدوات ========== */
const KEY='masrofi-data-v1', BKEY='masrofi-lastbackup';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TYPES={cash:'كاش',instapay:'إنستاباي',card:'فيزا / كارت',bank:'حساب بنكي',wallet:'محفظة موبايل'};
const FREQ={monthly:'شهري',yearly:'سنوي',variable:'متغير'};
const COLORS=['#16a34a','#0f766e','#0891b2','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#475569'];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ym=(y,m)=>y+'-'+pad(m);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const r2=n=>Math.round(n*100)/100;
const num=n=>r2(n).toLocaleString('en-US');
const fmt=n=>num(n)+' ج.م';
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monthOpts=sel=>MONTHS.map((n,i)=>`<option value="${i+1}" ${+sel===i+1?'selected':''}>${n}</option>`).join('');
function parseNum(s){s=String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(/[,٬\s]/g,'');return parseFloat(s)}

/* ========== البيانات ========== */
function defaults(){
  const m=(name,type,color)=>({id:uid(),name,type,bank:'',color,active:true});
  const c=(name,kind,freq='variable',dueMonth=1)=>({id:uid(),name,kind,freq,dueMonth,expected:0,plan:{},active:true});
  return {version:2,
    methods:[m('كاش','cash','#16a34a'),m('إنستاباي','instapay','#7c3aed'),m('فيزا / كارت','card','#2563eb'),m('حساب بنكي','bank','#0891b2'),m('محفظة موبايل','wallet','#dc2626')],
    cats:[...['أكل وشرب','مواصلات وبنزين','فواتير ومرافق','إيجار','صحة وعلاج','تعليم','ملابس','بيت ومستلزمات','ترفيه وخروجات','هدايا ومناسبات','أخرى'].map(n=>c(n,'exp')),
      c('الراتب','inc','monthly'),c('أرباح سنوية','inc','yearly',12),c('شغل إضافي','inc','variable'),c('تحصيلات أخرى','inc','variable')],
    txs:[],closed:{}};
}
function normalize(d){
  d.methods=d.methods||[];d.cats=(d.cats||[]).map(c=>({plan:{},...c}));d.closed=d.closed||{};
  d.txs=(d.txs||[]).map(t=>({...t,amount:+t.amount||0}));d.version=2;return d;
}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}S=S&&S.methods?normalize(S):defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('مشكلة في الحفظ: المساحة ممكن تكون خلصت')}}
const M=id=>S.methods.find(x=>x.id===id);
const C=id=>S.cats.find(x=>x.id===id);
const isClosed=date=>!!S.closed[date.slice(0,7)];
const monthTx=(y,m)=>S.txs.filter(t=>t.date.startsWith(ym(y,m)+'-'));
function sums(l){let inc=0,exp=0;for(const t of l){if(t.type==='inc')inc+=t.amount;else if(t.type==='exp')exp+=t.amount}return{inc,exp,net:inc-exp}}
function pmStats(list){
  return S.methods.map(m=>{let i=0,o=0;list.forEach(t=>{if(t.method!==m.id)return;if(t.type==='exp')o+=t.amount;else if(t.type==='inc')i+=t.amount});return{m,i,o}})
    .filter(x=>x.m.active||x.i||x.o).sort((a,b)=>(b.o+b.i)-(a.o+a.i));
}
function collectedIn(c,y){return S.txs.filter(t=>t.type==='inc'&&t.cat===c.id&&t.date.startsWith(y+'-')).reduce((a,t)=>a+t.amount,0)}
function expectedFor(c,y){const p=c.plan||{};return p[y]!=null?+p[y]:(+c.expected||0)}
function lastYearAmt(c,y){const p=c.plan||{};return p[y-1]!=null?+p[y-1]:collectedIn(c,y-1)}
function annualStatus(c,y){
  const got=collectedIn(c,y),exp=expectedFor(c,y);
  const n=new Date(),cy=n.getFullYear(),cm=n.getMonth()+1;
  let st;if(got>0&&got>=exp)st='done';else if(y<cy||(y===cy&&cm>c.dueMonth))st='late';else st='wait';
  return{got,st};
}
const byDesc=(a,b)=>b.date.localeCompare(a.date)||b.created-a.created;
const byAsc=(a,b)=>a.date.localeCompare(b.date)||a.created-b.created;

/* ========== الحالة ========== */
load();
const NOW=new Date(),NY=NOW.getFullYear();
let cur={y:NY,m:NOW.getMonth()+1};
let view='home',rtab='month',ctab='exp',txF='all',txQ='',F=null;
let acc={exp:false,inc:false,pm:false};
let stmt={kind:'cat',id:null,from:ym(cur.y,cur.m)+'-01',to:today()};
let CAN_SHARE=false;try{CAN_SHARE=!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.json',{type:'application/json'})]}))}catch(e){}

/* ========== العرض ========== */
function render(){
  document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#view').innerHTML=({home:vHome,txs:vTxs,reports:vReports,settings:vSettings})[view]();
}
function go(v){view=v;render();scrollTo(0,0)}
function shiftM(d){cur.m+=d;if(cur.m<1){cur.m=12;cur.y--}if(cur.m>12){cur.m=1;cur.y++}render()}
function monthBar(){const k=ym(cur.y,cur.m);return `<div class="mbar"><button onclick="shiftM(-1)">›</button><b>${MONTHS[cur.m-1]} ${cur.y} ${S.closed[k]?'<span class="lock">🔒 مقفول</span>':''}</b><button onclick="shiftM(1)">‹</button></div>`}
function yearBar(){return `<div class="mbar"><button onclick="cur.y--;render()">›</button><b>${cur.y}</b><button onclick="cur.y++;render()">‹</button></div>`}
function cards(s){return `<div class="cards"><div class="card inc"><small>تحصيلات</small><b>${fmt(s.inc)}</b></div><div class="card exp"><small>مصروفات</small><b>${fmt(s.exp)}</b></div></div><div class="card net"><small>الصافي</small><b class="${s.net<0?'neg':'pos'}">${fmt(s.net)}</b></div>`}
function txRow(t){
  const m=M(t.method);let title,sub,sign='';
  if(t.type==='tr'){title='تحويل';sub=`من ${esc(m?.name)} إلى ${esc(M(t.to)?.name)}`}
  else{title=esc(C(t.cat)?.name||'—');sub=esc(m?.name||'');sign=t.type==='exp'?'-':'+'}
  const ic=t.type==='exp'?'↑':t.type==='inc'?'↓':'⇄';
  return `<div class="row" onclick="editTx('${t.id}')"><span class="ic ${t.type}">${ic}</span><div class="grow"><b>${title}</b><small>${sub}${t.note?' · '+esc(t.note):''}</small></div><div class="amt ${t.type}">${sign}${fmt(t.amount)}<small>${fd(t.date)}${isClosed(t.date)?' 🔒':''}</small></div></div>`;
}
const txList=l=>l.length?`<div class="list">${l.map(txRow).join('')}</div>`:'<p class="empty">مفيش حركات لسه. دوس + عشان تسجّل أول حركة</p>';
function accSection(k,title,total,cls,body){
  return `<details class="acc" ${acc[k]?'open':''} ontoggle="acc['${k}']=this.open"><summary><span>${title}</span>${total!=null?`<b class="${cls}">${fmt(total)}</b>`:''}</summary><div class="accb">${body}</div></details>`;
}
function catRows(list,kind){
  const g={};list.filter(t=>t.type===kind).forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amount);
  const tot=Object.values(g).reduce((a,b)=>a+b,0);
  const rows=S.cats.filter(c=>c.kind===kind&&(c.active||g[c.id])).map(c=>({c,v:g[c.id]||0})).sort((a,b)=>b.v-a.v);
  if(!rows.length)return '<p class="empty">مفيش بنود</p>';
  return rows.map(({c,v})=>`<div class="row col ${v?'':'zero'}" onclick="openStmt('cat','${c.id}')"><div class="rowin"><span>${esc(c.name)}</span><b>${fmt(v)}${v&&tot?` <small class="muted" style="display:inline">${Math.round(v/tot*100)}%</small>`:''}</b></div>${v?`<div class="bar"><i class="${kind}" style="width:${v/tot*100}%"></i></div>`:''}</div>`).join('');
}
function pmRows(list){
  const rows=pmStats(list);
  if(!rows.length)return '<p class="empty">مفيش طرق دفع</p>';
  return rows.map(({m,i,o})=>`<div class="row ${i||o?'':'zero'}" onclick="openStmt('method','${m.id}')"><span class="dot" style="background:${m.color}"></span><div class="grow"><b>${esc(m.name)}</b>${m.bank?`<small>${esc(m.bank)}</small>`:''}</div><div class="amt"><span class="neg">صرفت ${num(o)}</span><small class="pos">قبضت ${num(i)}</small></div></div>`).join('');
}

/* --- الرئيسية --- */
function vHome(){
  const list=monthTx(cur.y,cur.m),s=sums(list);
  let h=monthBar()+cards(s);
  const nm=NOW.getMonth()+1;
  const al=S.cats.filter(c=>c.active&&c.kind==='inc'&&c.freq==='yearly').map(c=>({c,...annualStatus(c,NY)})).filter(x=>x.st==='late'||(x.st==='wait'&&x.c.dueMonth===nm));
  if(al.length)h+=`<div class="alert" onclick="rtab='annual';cur.y=${NY};go('reports')">${al.map(x=>`<div>${x.st==='late'?'⚠️':'⏳'} ${esc(x.c.name)}: ${x.st==='late'?'متأخر':'مستحق الشهر ده'}${expectedFor(x.c,NY)?' — '+fmt(expectedFor(x.c,NY)):''}</div>`).join('')}</div>`;
  const lb=localStorage.getItem(BKEY);

  h+=accSection('exp','💸 المصروفات',s.exp,'neg',catRows(list,'exp')+`<button class="addbtn" onclick="editCat(null,'exp')">+ إضافة بند مصروف</button>`);
  h+=accSection('inc','💰 التحصيلات',s.inc,'pos',catRows(list,'inc')+`<button class="addbtn" onclick="editCat(null,'inc')">+ إضافة بند تحصيل</button>`);
  h+=accSection('pm','💳 حسب طريقة الدفع',null,'',pmRows(list));

}

/* --- الحركات --- */
function vTxs(){
  return monthBar()+`<div class="tabs">${[['all','الكل'],['exp','مصروفات'],['inc','تحصيلات']].map(([k,l])=>`<button class="${txF===k?'on':''}" onclick="txF='${k}';render()">${l}</button>`).join('')}</div>

}
function txGroups(){

/* --- التقارير --- */
function vReports(){
  const tabs=[['month','الشهر'],['year','السنة'],['stmt','كشف حساب'],['annual','التحصيلات السنوية']];
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="${rtab===k?'on':''}" onclick="rtab='${k}';render()">${l}</button>`).join('')}</div>`+({month:rMonth,year:rYear,stmt:rStmt,annual:rAnnual})[rtab]();
}
function breakdown(list,kind){
  const g={};list.filter(t=>t.type===kind).forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amount);
  const tot=Object.values(g).reduce((a,b)=>a+b,0);if(!tot)return '<p class="empty">لا يوجد</p>';
  return '<div class="list">'+Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div class="row col" onclick="openStmt('cat','${id}')"><div class="rowin"><b>${esc(C(id)?.name||'—')}</b><span>${fmt(v)} <small class="muted" style="display:inline">${Math.round(v/tot*100)}%</small></span></div><div class="bar"><i class="${kind}" style="width:${v/tot*100}%"></i></div></div>`).join('')+'</div>';
}
function rMonth(){
  const list=monthTx(cur.y,cur.m),key=ym(cur.y,cur.m),cl=S.closed[key];
  let h=monthBar()+cards(sums(list));
  if(cl)h+=`<div class="alert info">🔒 اتقفل يوم ${new Date(cl.at).toLocaleDateString('ar-EG')}.</div>`;
  h+='<h3>المصروفات حسب البند</h3>'+breakdown(list,'exp')+'<h3>التحصيلات حسب البند</h3>'+breakdown(list,'inc');
  h+='<h3>حسب طريقة الدفع</h3><div class="list">'+pmRows(list)+'</div>';
  h+=`<button class="btn ghost" onclick="${cl?'openMonth':'closeMonth'}('${key}')">${cl?'🔓 فتح الشهر':'🔒 قفل الشهر'}</button>`;
  return h;
}
function rYear(){
  const y=cur.y,data=MONTHS.map((n,i)=>sums(monthTx(y,i+1)));
  const yl=S.txs.filter(t=>t.date.startsWith(y+'-')),max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  let h=yearBar()+cards(sums(yl));
  h+=`<div class="chart">${data.map((d,i)=>`<div class="cm" onclick="cur.m=${i+1};rtab='month';render()"><div class="bars"><i class="inc" style="height:${d.inc/max*100}%"></i><i class="exp" style="height:${d.exp/max*100}%"></i></div><small>${i+1}</small></div>`).join('')}</div>
  <div class="legend"><span><i class="inc"></i>تحصيلات</span><span><i class="exp"></i>مصروفات</span></div>`;
  const rows=data.map((d,i)=>(d.inc||d.exp)?`<div class="row" onclick="cur.m=${i+1};rtab='month';render()"><div class="grow"><b>${MONTHS[i]} ${S.closed[ym(y,i+1)]?'🔒':''}</b><small><span class="pos">+${num(d.inc)}</span> · <span class="neg">-${num(d.exp)}</span></small></div><b class="${d.net<0?'neg':'pos'}">${fmt(d.net)}</b></div>`:'').join('');
  h+='<h3>شهر بشهر</h3>'+(rows?`<div class="list">${rows}</div>`:'<p class="empty">مفيش حركات في السنة دي</p>');
  h+='<h3>مصروفات السنة حسب البند</h3>'+breakdown(yl,'exp');
  return h;
}
function openStmt(kind,id,year){
  stmt.kind=kind;stmt.id=id;
  if(year){stmt.from=year+'-01-01';stmt.to=year+'-12-31'}
  else{stmt.from=ym(cur.y,cur.m)+'-01';stmt.to=ym(cur.y,cur.m)+'-'+pad(new Date(cur.y,cur.m,0).getDate())}
  rtab='stmt';go('reports');
}
function rStmt(){
  const isM=stmt.kind==='method',opts=isM?S.methods:S.cats;
  if(!stmt.id||!(isM?M(stmt.id):C(stmt.id)))stmt.id=opts[0]?.id;
  let h=`<div class="seg">${[['cat','بند'],['method','طريقة دفع']].map(([k,l])=>`<button class="${stmt.kind===k?'on':''}" onclick="stmt.kind='${k}';stmt.id=null;render()">${l}</button>`).join('')}</div>
  <select onchange="stmt.id=this.value;render()">${opts.map(o=>`<option value="${o.id}" ${o.id===stmt.id?'selected':''}>${esc(o.name)}${isM?'':(o.kind==='exp'?' (مصروف)':' (تحصيل)')}</option>`).join('')}</select>
  <div class="two"><label>من<input type="date" value="${stmt.from}" onchange="stmt.from=this.value;render()"></label><label>إلى<input type="date" value="${stmt.to}" onchange="stmt.to=this.value;render()"></label></div>`;
  const id=stmt.id;if(!id)return h;
  const inR=t=>t.date>=stmt.from&&t.date<=stmt.to;
  if(isM){
    const rows=S.txs.filter(t=>inR(t)&&t.method===id&&t.type!=='tr').sort(byAsc);let i=0,o=0;
    const body=rows.map(t=>{const isIn=t.type==='inc';if(isIn)i+=t.amount;else o+=t.amount;
      return `<tr onclick="editTx('${t.id}')"><td>${fd(t.date)}</td><td>${esc(C(t.cat)?.name||'')}${t.note?' · '+esc(t.note):''}</td><td class="pos">${isIn?num(t.amount):''}</td><td class="neg">${isIn?'':num(t.amount)}</td></tr>`}).join('');
    h+=`<div class="cards"><div class="card inc"><small>قبضت</small><b>${fmt(i)}</b></div><div class="card exp"><small>صرفت</small><b>${fmt(o)}</b></div></div>`;
    h+=rows.length?`<div class="tbl"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>قبضت</th><th>صرفت</th></tr></thead><tbody>${body}</tbody></table></div>`:'<p class="empty">مفيش حركات في الفترة دي</p>';
  }else{
    const rows=S.txs.filter(t=>inR(t)&&t.cat===id).sort(byAsc);let cum=0;
    const body=rows.map(t=>{cum+=t.amount;return `<tr onclick="editTx('${t.id}')"><td>${fd(t.date)}</td><td>${esc(M(t.method)?.name||'')}${t.note?' · '+esc(t.note):''}</td><td>${num(t.amount)}</td><td>${num(cum)}</td></tr>`}).join('');
    h+=`<div class="cards"><div class="card ${C(id).kind}"><small>الإجمالي</small><b>${fmt(cum)}</b></div><div class="card"><small>عدد الحركات</small><b>${rows.length}</b></div></div>`;
    h+=rows.length?`<div class="tbl"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>التراكمي</th></tr></thead><tbody>${body}</tbody></table></div>`:'<p class="empty">مفيش حركات في الفترة دي</p>';
  }
  return h;
}
function rAnnual(){
  const y=cur.y;let h=yearBar();
  h+=`<div class="two" style="margin-bottom:10px"><button class="btn ghost" onclick="editCat(null,'inc','yearly')">+ بند سنوي جديد</button><button class="btn ghost" onclick="applyAllPct()">٪ زيادة على الكل</button></div>`;
  const cats=S.cats.filter(c=>c.kind==='inc'&&c.freq==='yearly').sort((a,b)=>a.dueMonth-b.dueMonth);
  if(!cats.length)return h+'<p class="empty">مفيش بنود سنوية لسه.<br>دوس "+ بند سنوي جديد" وضيف مثلاً عقد صيانة.</p>';
  const L={done:'اتحصّل ✓',wait:'منتظر',late:'متأخر'};let tl=0,te=0,tg=0;
  const rows=cats.map(c=>{
    const a=annualStatus(c,y),last=lastYearAmt(c,y),ex=expectedFor(c,y);tl+=last;te+=ex;tg+=a.got;
    const pct=last>0&&ex>0?r2((ex/last-1)*100):null;
    return `<div class="row ${c.active?'':'off'}" onclick="planSheet('${c.id}')"><div class="grow"><b>${esc(c.name)}</b>
      <small>${y-1}: ${fmt(last)} ← ${y}: <b style="color:var(--tx)">${fmt(ex)}</b>${pct!==null?` (${pct>0?'+':''}${pct}%)`:''}</small>
      <small>يستحق في ${MONTHS[c.dueMonth-1]} · اتحصّل ${fmt(a.got)}</small></div><span class="badge ${a.st}">${L[a.st]}</span></div>`}).join('');
  return h+`<div class="cards c3"><div class="card"><small>${y-1}</small><b>${fmt(tl)}</b></div><div class="card"><small>متوقع ${y}</small><b>${fmt(te)}</b></div><div class="card inc"><small>اتحصّل</small><b>${fmt(tg)}</b></div></div>
  <div class="list">${rows}</div><p class="foot">دوس على أي بند عشان تعدّل مبلغ السنة اللي فاتت ونسبة الزيادة</p>`;
}

/* --- مبالغ التحصيل السنوي ونسبة الزيادة --- */
function planFields(c,y){
  const p=c.plan||{};
  const last=p[y-1]!=null?p[y-1]:(c.id?(collectedIn(c,y-1)||''):'');
  const curv=p[y]!=null?p[y]:'';
  const pct=(+last>0&&+curv>0)?r2((curv/last-1)*100):'';
  return `<div class="plan">
  <label>مبلغ سنة ${y-1} (اللي فاتت)<input id="p-last" inputmode="decimal" value="${last}" placeholder="0" oninput="planCalc('last')"></label>
  <label>نسبة الزيادة %<input id="p-pct" inputmode="decimal" value="${pct}" placeholder="مثلاً 10" oninput="planCalc('pct')"></label>
  <label>مبلغ سنة ${y} (المتوقع)<input id="p-cur" inputmode="decimal" value="${curv}" placeholder="0" oninput="planCalc('cur')"></label>
  <small class="muted">اكتب مبلغ السنة اللي فاتت والنسبة، والبرنامج يحسب مبلغ السنة دي لوحده. أو اكتب المبلغ مباشرة والنسبة تتحسب.</small></div>`;
}
function planCalc(src){
  const L=parseNum($('#p-last').value),P=parseNum($('#p-pct').value),V=parseNum($('#p-cur').value);
  if(src==='cur'){$('#p-pct').value=(L>0&&V>0)?r2((V/L-1)*100):''}
  else if(L>0&&!isNaN(P))$('#p-cur').value=r2(L*(1+P/100));
}
function readPlan(c,y){
  c.plan=c.plan||{};const L=parseNum($('#p-last').value),V=parseNum($('#p-cur').value);
  if(!isNaN(L))c.plan[y-1]=L;else delete c.plan[y-1];
  if(!isNaN(V))c.plan[y]=V;else delete c.plan[y];
}
function planSheet(id){
  const c=C(id),y=cur.y;
  sheet(`<h2>${esc(c.name)} — ${y}</h2>
  <label>شهر الاستحقاق<select id="c-due">${monthOpts(c.dueMonth)}</select></label>${planFields(c,y)}
  <button class="btn" onclick="savePlan('${id}')">حفظ</button>
  <button class="btn ghost" onclick="closeSheet();openStmt('cat','${id}',${y})">كشف حساب البند</button>
  <button class="btn ghost" onclick="editCat('${id}')">تعديل اسم البند أو إيقافه</button>`);
}
function savePlan(id){const c=C(id);c.dueMonth=+$('#c-due').value;readPlan(c,cur.y);save();closeSheet();render();toast('اتحفظ ✓')}
function applyAllPct(){
  const y=cur.y,cats=S.cats.filter(c=>c.kind==='inc'&&c.freq==='yearly');
  if(!cats.length)return toast('مفيش بنود سنوية');
  const p=parseNum(prompt(`نسبة الزيادة على مبالغ ${y-1} لكل البنود السنوية (%)`,'10'));if(isNaN(p))return;
  let n=0;cats.forEach(c=>{c.plan=c.plan||{};const base=lastYearAmt(c,y);if(base>0){c.plan[y-1]=base;c.plan[y]=r2(base*(1+p/100));n++}});
  if(!n)return toast(`مفيش مبالغ مسجلة لسنة ${y-1}`);
  save();render();toast(`اتحسبت زيادة ${p}% لـ ${n} بند ✓`);
}

  <button class="btn" onclick="backup()">⬇️ تنزيل نسخة</button>

  <button class="btn ghost" onclick="$('#restoreFile').click()">⬆️ استرجاع نسخة</button>`;
  h+=`<h3>عن التطبيق</h3><div class="list">
  <div class="row"><span class="ic" style="background:#ccfbf1;color:var(--p)">م</span><div class="grow"><b>مصروفي</b><small>الإصدار ${APP_VERSION} · ${APP_BUILD}</small></div></div>
  <div class="row"><span class="ic" style="background:#f1f5f9">👨‍💻</span><div class="grow"><small>تطوير</small><b class="ltr">${DEV.name}</b><small class="ltr">${DEV.company}</small></div></div>
  ${DEV.phones.map(p=>`<a class="row" href="tel:${p}"><span class="ic" style="background:#dcfce7">📞</span><div class="grow"><b class="ltr">${p}</b></div></a>`).join('')}
  </div>`;
  h+=`<h3>منطقة خطر</h3><button class="btn ghost danger" onclick="resetAll()">مسح كل البيانات</button>

  return h;

/* ========== الشيت والنماذج ========== */
function sheet(html){$('#sheet .body').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2300)}
const opt=(arr,sel)=>arr.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}</option>`).join('');

/* --- حركة --- */
function newTx(){
  const dm=(S.methods.find(m=>m.active&&m.type==='cash')||S.methods.find(m=>m.active)||{}).id;
  if(!dm)return toast('ضيف طريقة دفع الأول من الإعدادات');
  const isNow=cur.y===NY&&cur.m===NOW.getMonth()+1;
  F={id:null,type:'exp',amount:'',cat:'',method:dm,to:'',date:isNow?today():ym(cur.y,cur.m)+'-01',note:'',created:0};
  txForm();
}
function editTx(id){const t=S.txs.find(x=>x.id===id);if(!t)return;F={...t,amount:String(t.amount),cat:t.cat||'',to:t.to||'',note:t.note||''};txForm()}
function grab(){
  const v=s=>$(s)?$(s).value:null;
  if(v('#f-amt')!==null)F.amount=v('#f-amt');if(v('#f-d')!==null)F.date=v('#f-d');if(v('#f-n')!==null)F.note=v('#f-n');
  if(v('#f-m')!==null)F.method=v('#f-m');if(v('#f-to')!==null)F.to=v('#f-to');if(v('#f-cat')!==null)F.cat=v('#f-cat');
}
function txForm(){
  const orig=F.id&&S.txs.find(t=>t.id===F.id),locked=orig&&isClosed(orig.date);
  const cats=S.cats.filter(c=>c.kind===F.type&&(c.active||c.id===F.cat));
  const meths=S.methods.filter(m=>m.active||m.id===F.method||m.id===F.to);
  if(F.type!=='tr'&&!cats.some(c=>c.id===F.cat))F.cat=cats[0]?.id||'';
  const types=[['exp','مصروف'],['inc','تحصيل']].concat(F.type==='tr'?[['tr','تحويل']]:[]);
  sheet(`<h2>${F.id?'تعديل حركة':'حركة جديدة'}</h2>
  ${locked?'<p class="warn">🔒 الشهر ده مقفول. افتحه من الإعدادات ← قفل الشهور عشان تعدّل.</p>':''}
  <div class="seg">${types.map(([k,l])=>`<button class="${F.type===k?'on '+k:''}" onclick="grab();F.type='${k}';txForm()">${l}</button>`).join('')}</div>
  <input id="f-amt" class="amt-in" type="text" inputmode="decimal" placeholder="0" value="${esc(F.amount)}">
  ${F.type==='tr'
    ?`<label>من<select id="f-m">${opt(meths,F.method)}</select></label><label>إلى<select id="f-to">${opt(meths,F.to)}</select></label>`
    :`<div class="fl">البند<div class="inl"><select id="f-cat">${opt(cats,F.cat)}</select><button type="button" class="mini" onclick="quickCat()">+ جديد</button></div></div>
      <label>${F.type==='exp'?'دفعت بـ':'استلمت على'}<select id="f-m">${opt(meths,F.method)}</select></label>`}
  <label>التاريخ<input id="f-d" type="date" value="${F.date}"></label>
  <label>ملاحظة<input id="f-n" type="text" value="${esc(F.note)}" placeholder="اختياري"></label>
  <button class="btn" onclick="saveTx()" ${locked?'disabled':''}>سجّل</button>
  ${F.id&&!locked?'<button class="btn ghost danger" onclick="delTx()">حذف الحركة</button>':''}`);
  if(!F.id)setTimeout(()=>$('#f-amt')&&$('#f-amt').focus(),260);
}
function quickCat(){
  grab();
  const n=(prompt(F.type==='exp'?'اسم بند المصروف الجديد (مثلاً: طازة، قسط العربية)':'اسم بند التحصيل الجديد (مثلاً: الراتب، عقد صيانة)')||'').trim();
  if(!n)return;
  let c=S.cats.find(x=>x.kind===F.type&&x.name===n);
  if(!c){c={id:uid(),name:n,kind:F.type,freq:'variable',dueMonth:NOW.getMonth()+1,expected:0,plan:{},active:true};S.cats.push(c)}
  c.active=true;save();F.cat=c.id;txForm();toast('اتضاف البند ✓');
}
function saveTx(){
  grab();const amount=parseNum(F.amount);
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!F.date)return toast('اختار التاريخ');
  if(isClosed(F.date))return toast(`شهر ${MONTHS[+F.date.slice(5,7)-1]} مقفول`);
  if(!F.method)return toast('اختار طريقة الدفع');
  if(F.type==='tr'){if(!F.to||F.to===F.method)return toast('اختار طريقتين مختلفتين')}
  else if(!F.cat)return toast('اختار البند');
  const t={id:F.id||uid(),type:F.type,amount,method:F.method,date:F.date,note:(F.note||'').trim(),created:F.created||Date.now()};
  if(F.type==='tr')t.to=F.to;else t.cat=F.cat;
  const i=S.txs.findIndex(x=>x.id===t.id);if(i>=0)S.txs[i]=t;else S.txs.push(t);
  save();closeSheet();render();toast('اتسجّلت ✓');
}
function delTx(){if(!confirm('تمسح الحركة دي؟'))return;S.txs=S.txs.filter(t=>t.id!==F.id);save();closeSheet();render();toast('اتمسحت')}

/* --- طريقة دفع --- */
function editMethod(id){
  const m=id?M(id):{name:'',type:'cash',bank:'',color:COLORS[1],active:true};
  const used=id&&S.txs.some(t=>t.method===id||t.to===id);
  sheet(`<h2>${id?'تعديل':'إضافة'} طريقة دفع</h2>
  <label>الاسم<input id="m-name" value="${esc(m.name)}" placeholder="مثلاً: فيزا البنك الأهلي"></label>
  <label>النوع<select id="m-type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${m.type===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>البنك / الجهة<input id="m-bank" value="${esc(m.bank)}" placeholder="اختياري"></label>
  <div style="margin-top:10px;font-size:13px;color:var(--mu)">اللون</div>
  <div class="colors">${COLORS.map(c=>`<button type="button" class="sw ${c===m.color?'on':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('')}</div>
  <input type="hidden" id="m-color" value="${m.color}">
  ${id?`<label class="chk"><input type="checkbox" id="m-act" ${m.active?'checked':''}> شغالة (تظهر في تسجيل الحركات)</label>`:''}
  <button class="btn" onclick="saveMethod('${id||''}')">حفظ</button>
  ${id&&!used?`<button class="btn ghost danger" onclick="delMethod('${id}')">حذف</button>`:''}
  ${used?'<small class="muted">عليها حركات، تقدر توقفها بدل ما تمسحها.</small>':''}`);
}
function pickColor(el,c){document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#m-color').value=c}
function saveMethod(id){
  const name=$('#m-name').value.trim();if(!name)return toast('اكتب الاسم');
  const m=id?M(id):{id:uid(),active:true};
  Object.assign(m,{name,type:$('#m-type').value,bank:$('#m-bank').value.trim(),color:$('#m-color').value});
  if($('#m-act'))m.active=$('#m-act').checked;if(!id)S.methods.push(m);
  save();closeSheet();render();toast('اتحفظ ✓');
}
function delMethod(id){if(!confirm('تمسح طريقة الدفع دي؟'))return;S.methods=S.methods.filter(m=>m.id!==id);save();closeSheet();render()}

/* --- بند --- */
function editCat(id,kind,preset){
  const c=id?C(id):{name:'',kind,freq:preset||'variable',dueMonth:NOW.getMonth()+1,expected:0,plan:{},active:true};
  const used=id&&S.txs.some(t=>t.cat===id);
  sheet(`<h2>${id?'تعديل':'إضافة'} بند ${c.kind==='exp'?'مصروف':'تحصيل'}</h2>
  <label>الاسم<input id="c-name" value="${esc(c.name)}" placeholder="${c.kind==='exp'?'مثلاً: طازة، قسط العربية':'مثلاً: الراتب، عقد صيانة شركة ...'}"></label>
  ${c.kind==='inc'?`<label>نوع التحصيل<select id="c-freq" onchange="$('#c-y').style.display=this.value==='yearly'?'':'none'">${Object.entries(FREQ).map(([k,l])=>`<option value="${k}" ${c.freq===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <div id="c-y" style="${c.freq==='yearly'?'':'display:none'}"><label>شهر الاستحقاق<select id="c-due">${monthOpts(c.dueMonth)}</select></label>${planFields(c,NY)}</div>`:''}
  ${id?`<label class="chk"><input type="checkbox" id="c-act" ${c.active?'checked':''}> شغال (يظهر في تسجيل الحركات)</label>`:''}
  <button class="btn" onclick="saveCat('${id||''}','${c.kind}')">حفظ</button>
  ${id&&!used?`<button class="btn ghost danger" onclick="delCat('${id}')">حذف البند</button>`:''}
  ${used?'<small class="muted">البند عليه حركات، تقدر توقفه بدل ما تمسحه.</small>':''}`);
  if(!id)setTimeout(()=>$('#c-name')&&$('#c-name').focus(),260);
}
function saveCat(id,kind){
  const name=$('#c-name').value.trim();if(!name)return toast('اكتب اسم البند');
  if(S.cats.some(x=>x.kind===kind&&x.name===name&&x.id!==id))return toast('البند ده موجود قبل كده');
  const c=id?C(id):{id:uid(),kind,active:true,freq:'variable',dueMonth:1,expected:0,plan:{}};
  c.name=name;
  if(kind==='inc'){c.freq=$('#c-freq').value;c.dueMonth=+$('#c-due').value;if(c.freq==='yearly')readPlan(c,NY)}
  if($('#c-act'))c.active=$('#c-act').checked;if(!id)S.cats.push(c);
  save();closeSheet();render();toast('اتحفظ ✓');
}
function delCat(id){if(!confirm('تمسح البند ده؟'))return;S.cats=S.cats.filter(c=>c.id!==id);save();closeSheet();render()}

/* ========== قفل الشهر ========== */
function closeMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`قفل ${MONTHS[m-1]} ${y}؟\nمش هتقدر تضيف أو تعدّل حركات الشهر ده لحد ما تفتحه تاني.`))return;
  const s=sums(monthTx(y,m));
  S.closed[k]={at:new Date().toISOString(),inc:s.inc,exp:s.exp};
  save();render();toast('اتقفل الشهر 🔒 وقت مناسب لنسخة احتياطية');
}
function openMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`فتح ${MONTHS[m-1]} ${y}؟\nهتقدر تعدّل حركاته تاني.`))return;
  delete S.closed[k];save();render();toast('اتفتح الشهر');
}

/* ========== النسخ الاحتياطي ========== */
const backupJSON=()=>JSON.stringify({app:'masrofi',appVersion:APP_VERSION,exported:new Date().toISOString(),data:S});
const backupName=()=>`masrofi-backup-${today()}.json`;
function markBackup(){localStorage.setItem(BKEY,today());render()}
function backup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
  a.download=backupName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);markBackup();toast('اتنزلت النسخة ✓');
}
async function shareBackup(){
  try{await navigator.share({files:[new File([backupJSON()],backupName(),{type:'application/json'})],title:'نسخة مصروفي'});markBackup()}catch(e){}
}
function restore(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    let d=JSON.parse(r.result);if(d.data)d=d.data;
    if(!Array.isArray(d.methods)||!Array.isArray(d.txs))throw 0;
    if(!confirm(`النسخة فيها ${d.txs.length} حركة.\nالاسترجاع هيمسح البيانات الحالية ويحط النسخة مكانها. نكمل؟`))return;
    S=normalize(d);save();go('home');toast('اتسترجعت البيانات ✓');
  }catch(e){alert('الملف ده مش نسخة احتياطية صالحة من مصروفي')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('هتمسح كل الحركات والإعدادات من الجهاز ده. متأكد؟'))return;
  if(!confirm('آخر تأكيد: عندك نسخة احتياطية؟ المسح مش هيترجع.'))return;
  S=defaults();save();go('home');toast('اتمسح كل شيء');
}

/* ========== تشغيل ========== */
$('#hd').textContent=NOW.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
save();render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
