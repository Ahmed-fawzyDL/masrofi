<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Centric">
<meta name="author" content="Eng.Ahmed Fawzy - DeTech Solutions">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Centric</title>
<style>
:root{--p:#0f766e;--bg:#f4f6f8;--card:#fff;--soft:#eef1f4;--soft2:#f8fafc;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--inc:#16a34a;--exp:#dc2626;--tr:#2563eb;--z:1.07;--ff:'Cairo',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body.dark{--bg:#0b1220;--card:#162032;--soft:#22304a;--soft2:#1a2538;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2b3a52;--inc:#22c55e;--exp:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;font-family:var(--ff);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55}
header,main,nav,.sz,.dbox,#banner,.paper{zoom:var(--z)}
header{background:var(--p);background-image:linear-gradient(135deg,#ffffff1a,#00000026);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}
body.dark header{background:var(--card);border-bottom:1px solid var(--bd)}
.appbox{direction:ltr;margin:0;font-size:17px;font-weight:800;letter-spacing:.5px;padding:6px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08));backdrop-filter:blur(12px) saturate(160%);-webkit-backdrop-filter:blur(12px) saturate(160%);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(0,0,0,.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}
.hdl{display:flex;align-items:center;gap:8px}
.hlg{width:34px;height:34px;flex:0 0 34px;border-radius:10px;overflow:hidden;box-shadow:0 4px 12px #0003}.hlg svg{width:100%;height:100%;display:block}
.dchip{background:#fef3c7;color:#92400e;font-size:11px;font-weight:800;padding:2px 10px;border-radius:12px}
#bell{position:relative;background:#ffffff26;border:1px solid #ffffff33;color:#fff;width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
#bell b{position:absolute;top:-4px;left:-4px;background:#dc2626;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
#bell b:empty{display:none}
main{max-width:600px;margin:auto;padding:12px 12px calc(86px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mu);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button span{font-size:18px}nav button.on{color:var(--p);font-weight:700}
nav .fab{flex:0 0 48px;height:48px;border-radius:50%;background:var(--p);color:#fff;font-size:27px;margin:-24px 3px 0;box-shadow:0 4px 12px #0004;justify-content:center;line-height:1}
.demo{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:12px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.demo .mini{margin-inline-start:auto}
input[type=file]{display:none!important}
h3{font-size:15px;margin:14px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h3 small{font-weight:400;color:var(--mu);font-size:12px}
.muted{color:var(--mu);font-weight:400}
.mbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:5px;margin-bottom:8px;gap:6px}
.mbar button{width:40px;height:36px;flex:0 0 40px;border:0;background:var(--soft);border-radius:9px;font-size:20px;color:var(--tx);cursor:pointer}
.mbar b{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center}
.lock{font-size:11px;background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-weight:600;cursor:pointer}.lock.op{background:#dcfce7;color:#166534}
.hero{background:var(--p);background-image:linear-gradient(135deg,#ffffff14,#0000002e);color:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
.hero-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;line-height:1.9;padding:2px 2px 0}
.hero-t .hm{font-weight:700;background:#ffffff2e;padding:0 10px;border-radius:12px}
.hero-t em{font-style:normal;font-size:11px;font-weight:700;padding:0 9px;border-radius:12px;margin-inline-start:auto;cursor:pointer}
.hero-t em.op{background:#dcfce7;color:#166534}.hero-t em.cl{background:#fef3c7;color:#92400e}.hero-t em.eye{background:#ffffff2e;color:#fff;font-size:13px}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hbtns button{background:#ffffff1f;border:1px solid #ffffff38;border-radius:12px;color:#fff;font:inherit;padding:8px 10px;text-align:right;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.hbtns small{font-size:11px;opacity:.9}.hbtns b{font-size:19px}.hbtns i{font-style:normal;font-size:11px;opacity:.8;align-self:flex-end}
.hnet{margin-top:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#0000001f;border-radius:10px;padding:7px 10px}.hnet b{font-size:16px}
.hneg{background:#fee2e2;color:#b91c1c;padding:1px 10px;border-radius:10px}
.msk{letter-spacing:3px;cursor:pointer;user-select:none}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:3px}
.tile.hot{border-color:#fca5a5;box-shadow:inset 0 3px 0 #dc2626}.tile.soon{border-color:#fcd34d;box-shadow:inset 0 3px 0 #d97706}
.tth{display:flex;align-items:center;gap:6px;min-width:0}.tth .ti{font-size:18px}.tth .tl{font-size:12px;font-weight:600;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tth .tb{background:#dc2626;color:#fff;border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}
.tile>b{font-size:16px}.tile>small{color:var(--mu);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;background:var(--soft);border-radius:3px;margin:2px 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--inc)}
.svgc{width:100%;height:auto;display:block}.svgc text{font-family:inherit}
.donut{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.dleg{flex:1;min-width:150px;font-size:12px}.dleg div{display:flex;align-items:center;gap:6px;margin:4px 0}
.dleg i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}.dleg span{flex:1}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.rg{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.rg svg{width:100%;max-width:104px;height:auto;display:block}.rg svg text{font-family:inherit}
.rg b{font-size:13px;color:#1f2937}.rg small{font-size:11px;color:#6b7280;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--inc)!important}.neg{color:var(--exp)!important}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--soft);cursor:pointer}.row:last-child{border-bottom:0}
.row.col{flex-direction:column;align-items:stretch;gap:0}
a.row{color:inherit;text-decoration:none}
.row.off,tr.off{opacity:.5}
.rowin{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.grow{flex:1;min-width:0}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 32px;font-weight:700}
.amt{text-align:left;font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}.amt.inc{color:var(--inc)}.amt.exp{color:var(--exp)}
.amt small{text-align:left;font-weight:400;font-size:11px}
.empty{text-align:center;color:var(--mu);padding:20px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:6px 14px;font:inherit;font-size:13px;color:var(--tx);flex:1;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.tabs.ctabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.tabs.ctabs button{flex:0 0 auto;padding:5px 12px}
.sseg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:2px}
.sseg button{border:0;background:none;padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;color:var(--mu);cursor:pointer}
.sseg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:0 1px 2px #0002}
.sortbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.seg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;color:var(--tx);cursor:pointer}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px #0002}
.seg button.on.exp{color:var(--exp)}.seg button.on.inc{color:var(--inc)}.seg button.on.tr{color:var(--tr)}
.seg.st button.on.wt{color:#b45309}.seg.st button.on.dn{color:var(--inc)}
label,.fl{display:block;margin:8px 0;font-size:12.5px;color:var(--mu)}
input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;font:inherit;font-size:16px;background:var(--card);color:var(--tx)}
input:disabled,select:disabled{opacity:.5}
input[type=range]{padding:0;border:0;accent-color:var(--p)}
.inl{display:flex;gap:6px;align-items:stretch;margin-top:4px}.inl select,.inl input{margin-top:0!important;flex:1;min-width:0}.inl .mini{white-space:nowrap;font-weight:700;font-size:14px;padding:0 12px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}label.chk input{width:19px;height:19px}
.fxbox{background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:700}
.fxin{background:var(--soft2);border:1px solid var(--bd);border-radius:12px;padding:2px 12px 10px;margin:-4px 0 8px}
.qbox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:6px 12px 10px;margin:8px 0}
.qbox.exp{background:#fef2f2;border-color:#fecaca}
body.dark .qbox{background:#14281f;border-color:#1f4d36}body.dark .qbox.exp{background:#2a1618;border-color:#5b2328}
.qbox b{font-size:13px}
.amt-in{font-size:28px!important;text-align:center;font-weight:700;margin-top:8px!important}
.two{display:flex;gap:8px}.two>label,.two>.btn{flex:1;min-width:0}
.btn{display:block;width:100%;padding:11px;border:0;border-radius:10px;background:var(--p);color:#fff;font:inherit;font-size:14px;font-weight:700;margin-top:8px;cursor:pointer}
a.btn{text-align:center;text-decoration:none}
.btn.ghost{background:var(--card);color:var(--p);border:1px solid var(--bd)}.btn.danger{color:var(--exp)}.btn:disabled{opacity:.4}.btn.dz{background:var(--exp);color:#fff}
.mini{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;color:var(--tx);white-space:nowrap;cursor:pointer}
.mini.pri{background:var(--p);color:#fff;border-color:var(--p)}
.mini.danger{color:var(--exp)}
.phead>button.mini:first-child,.bk-btn{font-size:20px;font-weight:800;padding:4px 16px;min-width:48px;height:40px;border-radius:12px}
.rvbar .mini{font-size:14px;padding:7px 12px;border-radius:10px}.rvbar .mini.x{font-size:18px;padding:5px 14px}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 8px;border-radius:20px;white-space:nowrap;display:inline-block;font-weight:600}
.badge.done{background:#dcfce7;color:#166534}.badge.wait{background:#fef9c3;color:#854d0e}.badge.late{background:#fee2e2;color:#991b1b}
.badge.rej{background:#e5e7eb;color:#374151}.badge.soon{background:#dbeafe;color:#1e40af}
.warn{background:#fef3c7;color:#78350f;padding:9px 12px;border-radius:12px;font-size:13px;margin:0 0 10px;cursor:pointer}
.tbl{overflow-x:auto;background:var(--card);border-radius:12px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;vertical-align:middle}th{background:var(--soft2);color:var(--mu);font-weight:600}
td input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--p)}
.pt input{min-width:130px;margin:0;padding:7px;font-size:14px}
.etbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.box{background:var(--card);border-radius:12px;padding:4px 12px 12px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 4px;font:inherit;font-size:11px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.th i{width:24px;height:24px;border-radius:50%;background:var(--c)}.th.on{border-color:var(--p);font-weight:700}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fnt{border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:10px;color:var(--tx);cursor:pointer;text-align:center;font-size:15px}
.fnt small{display:block;color:var(--mu);font-size:11px;font-family:system-ui}.fnt.on{border-color:var(--p);box-shadow:0 0 0 2px var(--p) inset}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rbtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 4px;font:inherit;font-size:12.5px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.rbtn span{font-size:25px}
.phead{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex-wrap:wrap}.phead h3,.phead h2{margin:0;flex:1;font-size:16px}
.pcard{margin-bottom:8px;cursor:pointer;background:var(--card);border-radius:12px;padding:10px 12px}
.pcard small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
details.gen{background:var(--soft2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0}
details.gen summary{cursor:pointer;font-weight:700;font-size:13px}
details.gen ol{margin:8px 0 0;padding-inline-start:20px;font-size:13px;line-height:1.9}
details.grp{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.grp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:14px;background:var(--soft2)}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:'▾';color:var(--mu);font-size:16px;transition:transform .2s}
details.grp[open]>summary::after{transform:rotate(180deg)}
details.grp[open]>summary{border-bottom:1px solid var(--bd)}
details.grp>summary .gs{margin-inline-start:auto;font-size:14px}
.chip{display:inline-block;font-size:11px;padding:0 8px;border-radius:10px;background:var(--soft);color:var(--mu);margin-inline-start:4px;font-weight:600}
.chip.fx{background:#dbeafe;color:#1e40af}.chip.pd{background:#fef3c7;color:#92400e}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.fth,.fadd{width:70px;height:80px;border:1px solid var(--bd);border-radius:10px;background:var(--soft2);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:22px;padding:0;color:var(--tx);font-family:inherit}
.fth img{width:100%;height:58px;object-fit:cover;background:var(--soft)}
.fth small,.fadd small{font-size:10px;color:var(--mu);max-width:66px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fadd{border-style:dashed;color:var(--p)}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
.brand{position:relative;text-align:center;color:var(--mu);font-size:11px;margin-top:26px;line-height:1.7;display:flex;flex-direction:column;align-items:center;gap:8px}
.brand::before{content:'';position:absolute;top:4px;left:50%;width:240px;height:80px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--p),transparent);opacity:.28;filter:blur(20px);pointer-events:none}
.pill{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding:10px 30px;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.2));backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 28px rgba(15,23,42,.13),inset 0 1px 0 rgba(255,255,255,.85)}
body.dark .pill{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-color:rgba(255,255,255,.14);box-shadow:0 10px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.pill b{color:var(--tx);font-size:13px}.pill .co{color:var(--p);font-weight:700;letter-spacing:.3px}
.brand a{color:var(--tx);text-decoration:none}
.ckx{display:flex;align-items:flex-start;border-bottom:1px solid var(--soft)}.ckx:last-child{border-bottom:0}
.ckx>input[type=checkbox]{width:24px;height:24px;flex:0 0 24px;accent-color:#16a34a;margin:12px 12px 0 0}
.ckx>details{flex:1;min-width:0}
.ckx>.mini{margin:10px 8px 0}
.xr{border-bottom:1px solid var(--soft)}.ckx .xr,.xr:last-child{border-bottom:0}
.xr summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.xr summary::-webkit-details-marker{display:none}
.xr summary::after{content:'▾';color:var(--mu);font-size:14px;transition:transform .2s;flex:0 0 auto}
.xr[open] summary::after{transform:rotate(180deg)}
.xr[open]{background:var(--soft2)}
.xr summary .grow b{display:block}.xr summary .grow small{display:block;color:var(--mu);font-size:11px;margin-top:1px}
.xr.done summary .grow>b{color:var(--inc)}
.xb{padding:0 12px 12px;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd)}.kv span{color:var(--mu)}
.xl{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd);cursor:pointer}.xl:last-child{border-bottom:0}
.xl span{color:var(--mu);font-size:12px;white-space:nowrap}.xl .grow{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:0 0 8px}
.kpi{border-radius:12px;padding:9px 10px;background:#f1f5f9;border-top:4px solid #94a3b8;min-width:0}
