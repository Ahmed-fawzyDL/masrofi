</style>

<script>
/* ========== الإصدار والمطور ========== */
const APP_VERSION='1.3.0';
const APP_BUILD='11/10/2026 - 12:45 م';
const DEV={name:'Eng.Ahmed Fawzy',company:'DETech Solutions',phones:['01285258400','01060008747']};

/* ========== ثوابت وأدوات ========== */
const KEY='masrofi-data-v1',BKEY='masrofi-lastbackup',NKEY='masrofi-notified',LKEY='masrofi-lock';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TYPES={cash:'كاش',instapay:'إنستاباي',card:'فيزا / كارت',bank:'حساب بنكي',wallet:'محفظة موبايل'};
const COLORS=['#16a34a','#0f766e','#0891b2','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#475569'];
const THEMES={teal:{n:'أخضر',p:'#0f766e'},blue:{n:'أزرق',p:'#1d4ed8'},purple:{n:'بنفسجي',p:'#6d28d9'},rose:{n:'وردي',p:'#be185d'},orange:{n:'برتقالي',p:'#c2410c'},slate:{n:'رمادي',p:'#334155'},dark:{n:'داكن',p:'#14b8a6',dark:true}};
const LDEF={home:'الرئيسية',col:'التحصيلات',reports:'التقارير',settings:'الإعدادات',exp:'المصروفات',inc:'التحصيلات',expOne:'مصروف',incOne:'تحصيل',net:'الناتج',monthly:'التحصيلات الشهرية',annual:'التحصيلات السنوية',expected:'التحصيلات المتوقعة',items:'تكويد البنود',pm:'طرق الدفع'};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ym=(y,m)=>y+'-'+pad(m);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const r2=n=>Math.round(n*100)/100;
const num=n=>r2(n).toLocaleString('en-US');
const fmt=n=>num(n)+' ج.م';
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
const fdate=d=>d?`${+d.slice(8)} ${MONTHS[+d.slice(5,7)-1]} ${d.slice(0,4)}`:'—';
const lastDay=key=>{const[y,m]=key.split('-').map(Number);return new Date(y,m,0).getDate()};
const mName=key=>{const[y,m]=key.split('-').map(Number);return MONTHS[m-1]+' '+y};
const daysBetween=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pj=p=>p==null?'null':typeof p==='string'?`'${p}'`:p;
function parseNum(s){s=String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(/[,٬\s]/g,'');return parseFloat(s)}
const L=k=>(S&&S.settings&&S.settings.labels&&S.settings.labels[k])||LDEF[k];
const appName=()=>(S&&S.settings&&S.settings.appName)||'مصروفي';

/* ========== البيانات ========== */
function defaults(){
  const m=(name,type,color)=>({id:uid(),name,type,bank:'',color,active:true});
  const c=(name,kind)=>({id:uid(),name,kind,active:true});
  return {version:3,
    methods:[m('كاش','cash','#16a34a'),m('إنستاباي','instapay','#7c3aed'),m('فيزا / كارت','card','#2563eb'),m('حساب بنكي','bank','#0891b2'),m('محفظة موبايل','wallet','#dc2626')],
    cats:[...['أكل وشرب','مواصلات وبنزين','فواتير ومرافق','إيجار','صحة وعلاج','تعليم','ملابس','بيت ومستلزمات','ترفيه وخروجات','هدايا ومناسبات','أخرى'].map(n=>c(n,'exp')),
      c('الراتب','inc'),c('شغل إضافي','inc'),c('تحصيلات أخرى','inc')],
    txs:[],closed:{},monthly:[],mst:{},annual:[],expected:[],settings:{}};
}
function normalize(d){
  d.methods=d.methods||[];d.cats=d.cats||[];d.closed=d.closed||{};
  d.txs=(d.txs||[]).map(t=>({...t,amount:+t.amount||0}));
  d.monthly=d.monthly||[];d.mst=d.mst||{};d.annual=d.annual||[];d.expected=d.expected||[];
  d.settings=Object.assign({lead:10,appName:'مصروفي',theme:'teal',labels:{}},d.settings||{});
  if((d.version||1)<3){
    d.cats.filter(c=>c.kind==='inc'&&c.freq==='yearly').forEach(c=>{
      const used=d.txs.some(t=>t.cat===c.id),plan=c.plan||{};
      if(used||Object.keys(plan).length||c.name!=='أرباح سنوية')
        d.annual.push({id:uid(),name:c.name,due:pad(c.dueMonth||1)+'-01',note:'',active:c.active!==false,amounts:{...plan},st:{}});
      if(used)c.freq='variable';else d.cats=d.cats.filter(x=>x!==c);
    });
    d.version=3;
  }
  return d;
}
let S=null;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}S=normalize(S&&S.methods?S:defaults())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('مشكلة في الحفظ: المساحة ممكن تكون خلصت')}}
const M=id=>S.methods.find(x=>x.id===id);
const C=id=>S.cats.find(x=>x.id===id);
const isClosed=date=>!!S.closed[date.slice(0,7)];
const monthTx=(y,m)=>S.txs.filter(t=>t.date.startsWith(ym(y,m)+'-'));
function sums(l){let inc=0,exp=0;for(const t of l){if(t.type==='inc')inc+=t.amount;else if(t.type==='exp')exp+=t.amount}return{inc,exp,net:inc-exp}}
function pmStats(list){
  return S.methods.map(m=>{let i=0,o=0;list.forEach(t=>{if(t.method!==m.id)return;if(t.type==='exp')o+=t.amount;else if(t.type==='inc')i+=t.amount});return{m,i,o}})
    .filter(x=>x.m.active||x.i||x.o).sort((a,b)=>(b.o+b.i)-(a.o+a.i));
}
const byDesc=(a,b)=>b.date.localeCompare(a.date)||b.created-a.created;
const byAsc=(a,b)=>a.date.localeCompare(b.date)||a.created-b.created;
function ensureCat(name,kind){let c=S.cats.find(x=>x.kind===kind&&x.name===name);if(!c){c={id:uid(),name,kind,active:true};S.cats.push(c)}return c}

/* --- التحصيلات: شهرية (m) / سنوية (a) / متوقعة (e) --- */
const ITEMS={m:()=>S.monthly,a:()=>S.annual,e:()=>S.expected};
const item=(k,id)=>ITEMS[k]().find(x=>x.id===id);
function getRec(k,id,p){if(k==='m')return (S.mst[p]||{})[id];const it=item(k,id);if(!it)return;return k==='a'?(it.st||{})[p]:it.rec}
function setRec(k,id,p,rec){
  if(k==='m'){S.mst[p]=S.mst[p]||{};if(rec)S.mst[p][id]=rec;else delete S.mst[p][id];return}
  const it=item(k,id);if(!it)return;
  if(k==='a'){it.st=it.st||{};if(rec)it.st[p]=rec;else delete it.st[p]}else{if(rec)it.rec=rec;else delete it.rec}
}
function stOf(rec){if(!rec)return{st:'wait'};if(rec.st==='done'){const t=S.txs.find(x=>x.id===rec.txId);return t?{st:'done',t}:{st:'wait'}}return rec}
function monthlyFor(key){return S.monthly.filter(i=>(!i.start||i.start<=key)&&(i.active!==false||getRec('m',i.id,key)))}
const mDue=(i,key)=>key+'-'+pad(Math.min(+i.day||1,lastDay(key)));
function annLast(a,y){const p=a.amounts||{};if(p[y-1]!=null)return +p[y-1];const s=stOf(getRec('a',a.id,y-1));return s.st==='done'?s.t.amount:null}
function annCur(a,y){const p=a.amounts||{};return p[y]!=null?+p[y]:null}
function annLastInfo(a,y){
  const s=stOf(getRec('a',a.id,y-1));
  if(s.st==='done')return `${fmt(s.t.amount)} (اتحصّل ${fdate(s.t.date)})`;
  const v=(a.amounts||{})[y-1];if(v!=null)return fmt(v)+(s.st==='rej'?' (مرفوض)':'');
  return '';
}

/* ========== التنبيهات ========== */
function alerts(){
  const out=[],td=today(),lead=+S.settings.lead||10;
  S.monthly.filter(i=>i.active!==false).forEach(i=>{
    for(let k=2;k>=0;k--){
      const d=new Date(NY,NOW.getMonth()-k,1),key=ym(d.getFullYear(),d.getMonth()+1);
      if(i.start&&key<i.start)continue;
      if(stOf(getRec('m',i.id,key)).st!=='wait')continue;
      if(td<mDue(i,key))continue;
      out.push({id:`m-${i.id}-${key}`,title:`💼 ${i.name}: لم يتم تحصيله إلى الآن`,body:`${mName(key)} · المتوقع ${fmt(+i.amount||0)}${i.note?' · '+i.note:''}`,go:`gocol('m','${key}')`});
    }
  });
  S.annual.filter(a=>a.active!==false&&a.due).forEach(a=>{
    [NY,NY+1].forEach(y=>{
      const due=`${y}-${a.due}`,left=daysBetween(due,td);
      if(left>lead||(y>NY&&left<0))return;
      if(stOf(getRec('a',a.id,y)).st!=='wait')return;
      const ex=annCur(a,y),li=annLastInfo(a,y);
      const title=left<0?`⚠️ تحصيل ${a.name} متأخر ${-left} يوم`:left===0?`📅 النهارده ميعاد تحصيل ${a.name}`:`⏰ تحصيل ${a.name} ميعاده قرب، باقي ${left} يوم`;
      out.push({id:`a-${a.id}-${y}`,title,body:`الميعاد ${fdate(due)} · المتوقع ${ex!=null?fmt(ex):'—'}${li?' · السنة اللي فاتت: '+li:''}${a.note?' · ملاحظة: '+a.note:''}`,go:`gocol('a',${y})`});
    });
  });
  S.expected.forEach(e=>{
    if(!e.date||stOf(e.rec).st!=='wait')return;
    const left=daysBetween(e.date,td);if(left>lead)return;
    out.push({id:`e-${e.id}`,title:left<0?`⚠️ تحصيل متوقع متأخر: ${e.name}`:`🔮 تحصيل متوقع قرب: ${e.name}`,body:`${fdate(e.date)}${left>=0?` (باقي ${left} يوم)`:''} · ${fmt(+e.amount||0)}${e.note?' · '+e.note:''}`,go:`gocol('e')`});
  });
  const lb=localStorage.getItem(BKEY);
  if(S.txs.length&&(!lb||(Date.now()-new Date(lb))/864e5>30))out.push({id:'backup',title:'💾 وقت النسخة الاحتياطية',body:lb?'آخر نسخة من أكتر من شهر':'لسه معملتش نسخة احتياطية',go:`stab='data';go('settings')`});
  return out;
}

async function pushAlerts(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted'||!navigator.serviceWorker)return;
    const reg=await navigator.serviceWorker.getRegistration();if(!reg)return;
    const sent=JSON.parse(localStorage.getItem(NKEY)||'{}'),td=today();
    const list=alerts().filter(a=>sent[a.id]!==td);if(!list.length)return;
    const o={icon:'icon-192.png',badge:'icon-192.png',lang:'ar',dir:'rtl'};
    if(list.length>3)await reg.showNotification(`${appName()}: عندك ${list.length} تنبيه`,{...o,body:list.slice(0,3).map(a=>a.title).join('\n'),tag:'masrofi-sum'});
    else for(const a of list)await reg.showNotification(a.title,{...o,body:a.body,tag:a.id});
    list.forEach(a=>sent[a.id]=td);localStorage.setItem(NKEY,JSON.stringify(sent));
  }catch(e){}
}

/* ========== القفل: رقم سري + بصمة ========== */
async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('masrofi:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of 'masrofi:'+s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}
}
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function showLock(){
  if(!LK.pin)return;closeSheet();
  $('#lkname').textContent=appName();$('#lkpin').value='';
  $('#lkbio').style.display=LK.bio?'':'none';$('#lkbrand').innerHTML=brand();
  $('#lock').classList.add('on');
}
function unlock(){$('#lock').classList.remove('on');pushAlerts()}
async function tryPin(){const v=$('#lkpin').value;if(!v)return;if(await hash(v)===LK.pin)unlock();else{$('#lkpin').value='';toast('الرقم السري غلط')}}
async function bioEnable(){
  try{
    if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return toast('الجهاز ده مش بيدعم البصمة');
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:appName()},user:{id:rnd(16),name:'masrofi-user',displayName:appName()},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    LK.bio=b64(c.rawId);saveLK();render();toast('اتفعّلت البصمة ✓');
  }catch(e){toast('ما اتفعّلتش البصمة')}
}
async function bioUnlock(silent){
  if(!LK.bio)return;
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(LK.bio)}],userVerification:'required',timeout:60000}});unlock()}
  catch(e){if(silent!==true)toast('البصمة ما اتعرفتش')}
}

function catRows(list,kind){
  const g={};list.filter(t=>t.type===kind).forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amount);
  const tot=Object.values(g).reduce((a,b)=>a+b,0);
  const rows=S.cats.filter(c=>c.kind===kind&&(c.active!==false||g[c.id])).map(c=>({c,v:g[c.id]||0})).sort((a,b)=>b.v-a.v);
  if(!rows.length)return '<p class="empty">لا يوجد بنود</p>';
  return rows.map(({c,v})=>`<div class="row col ${v?'':'zero'}" onclick="openStmt('cat','${c.id}')"><div class="rowin"><span>${esc(c.name)}</span><b>${fmt(v)}${v&&tot?` <small class="muted" style="display:inline">${Math.round(v/tot*100)}%</small>`:''}</b></div>${v?`<div class="bar"><i class="${kind}" style="width:${v/tot*100}%"></i></div>`:''}</div>`).join('');
}
function pmRows(list){

function stBadge(s,due){
  if(s.st==='done')return '<span class="badge done">اتحصّل ✓</span>';
  if(s.st==='rej')return '<span class="badge rej">مرفوض</span>';
  if(!due)return '<span class="badge wait">منتظر</span>';
  const left=daysBetween(due,today());
  if(left<0)return '<span class="badge late">متأخر</span>';
  if(left<=(+S.settings.lead||10))return `<span class="badge soon">${left?'باقي '+left+' يوم':'النهارده'}</span>`;
  return '<span class="badge wait">منتظر</span>';
}

  if(s.st==='rej')info=`<small class="neg">مرفوض${s.reason?': '+esc(s.reason):''}</small>`;
  const acts=s.st==='wait'?`<button class="mini ok" onclick="collect('${k}','${id}',${P})">✓ تم</button><button class="mini no" onclick="rejectIt('${k}','${id}',${P})">✕ مرفوض</button>`:`<button class="mini" onclick="undoIt('${k}','${id}',${P})">↩ تراجع</button>`;
  return `<div class="row nrow"><div class="grow"><b>${esc(name)}</b><small>${sub}</small>${note?`<small>📝 ${esc(note)}</small>`:''}${info}</div><div class="acts">${stBadge(s,due)}${acts}</div></div>`;
}

/* ========== صفحة التحصيلات ========== */
function vCol(){
  return tabsHTML([['m',L('monthly')],['a',L('annual')],['e',L('expected')]],colTab,'colTab')
    +`<button class="btn ghost" style="margin:0 0 10px" onclick="itab=colTab;go('items')">📋 ${esc(L('items'))}</button>`
    +({m:cMonthly,a:cAnnual,e:cExpected})[colTab]();
}
function cMonthly(){
  const key=ym(cur.y,cur.m);let h=monthBar();const items=monthlyFor(key);let te=0,tg=0,tr=0;
  const rows=items.map(i=>{
    const s=stOf(getRec('m',i.id,key));te+=+i.amount||0;
    if(s.st==='done')tg+=s.t.amount;if(s.st==='rej')tr+=+i.amount||0;
    return colRow('m',i.id,key,i.name,`المتوقع ${fmt(+i.amount||0)} · يوم ${+i.day||1}`,i.note,s,mDue(i,key));
  }).join('');
  h+=c3(['المتوقع',fmt(te)],['اتحصّل',fmt(tg),'inc'],['باقي',fmt(Math.max(0,te-tg-tr)),'exp']);
  return h+(items.length?`<div class="list">${rows}</div>`:'<p class="empty">لا يوجد بنود</p>');
}
function cAnnual(){
  const y=cur.y;let h=yearBar(),tl=0,te=0,tg=0;
  const list=S.annual.filter(a=>a.active!==false||getRec('a',a.id,y)).sort((a,b)=>(a.due||'99').localeCompare(b.due||'99'));
  const rows=list.map(a=>{
    const Lv=annLast(a,y),V=annCur(a,y),s=stOf(getRec('a',a.id,y)),pct=annPct(Lv,V);
    tl+=Lv||0;te+=V||0;if(s.st==='done')tg+=s.t.amount;
    return colRow('a',a.id,y,a.name,`${a.due?fdate(y+'-'+a.due)+' · ':''}${y-1}: ${Lv!=null?num(Lv):'—'} ← ${y}: ${V!=null?num(V):'—'}${pct!==null?` (${pct>0?'+':''}${pct}%)`:''}`,a.note,s,a.due?`${y}-${a.due}`:'');
  }).join('');
  h+=c3([`تحصيل ${y-1}`,fmt(tl)],[`متوقع ${y}`,fmt(te)],[`اتحصّل ${y}`,fmt(tg),'inc']);
  return h+(list.length?`<div class="list">${rows}</div>`:'<p class="empty">لا يوجد بنود</p>');
}
function cExpected(){
  let tw=0,tg=0;
  const list=[...S.expected].sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
  const rows=list.map(e=>{const s=stOf(e.rec);if(s.st==='done')tg+=s.t.amount;else if(s.st==='wait')tw+=+e.amount||0;
    return colRow('e',e.id,null,e.name,`${fdate(e.date)} · ${fmt(+e.amount||0)}`,e.note,s,e.date)}).join('');
  const h=`<div class="cards"><div class="card"><small>منتظر</small><b>${fmt(tw)}</b></div><div class="card inc"><small>اتحصّل</small><b>${fmt(tg)}</b></div></div>`;
  return h+(list.length?`<div class="list">${rows}</div>`:'<p class="empty">لا يوجد بنود</p>');
}

/* --- تحصيل / رفض / تراجع --- */
function collect(k,id,p){
  const it=item(k,id);if(!it)return;
  const td=today();let amt,date;
  if(k==='m'){amt=it.amount;date=p===NKM?td:mDue(it,p)}
  else if(k==='a'){amt=annCur(it,p)??annLast(it,p)??'';date=p===NY||!it.due?td:`${p}-${it.due}`}
  else{amt=it.amount;date=td}
  const meths=S.methods.filter(m=>m.active);
  if(!meths.length)return toast('ضيف طريقة دفع الأول');
  sheet(`<h2>✓ ${esc(it.name)}</h2>
  <input id="k-amt" class="amt-in" type="text" inputmode="decimal" value="${esc(amt??'')}" placeholder="0">
  <label>استلمت على<select id="k-m">${opt(meths,(meths.find(m=>m.type==='cash')||meths[0]).id)}</select></label>
  <label>تاريخ التحصيل<input id="k-d" type="date" value="${date}"></label>
  <label>ملاحظة<input id="k-n" type="text"></label>
  <button class="btn" onclick="doCollect('${k}','${id}',${pj(p)})">تم التحصيل</button>`);
}
function doCollect(k,id,p){
  const it=item(k,id),amount=parseNum($('#k-amt').value),date=$('#k-d').value,method=$('#k-m').value;
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!date)return toast('اختار التاريخ');
  if(isClosed(date))return toast(`شهر ${MONTHS[+date.slice(5,7)-1]} مقفول`);
  const cat=ensureCat(it.name,'inc');
  const t={id:uid(),type:'inc',amount,cat:cat.id,method,date,note:$('#k-n').value.trim(),created:Date.now(),src:{k,id,p}};
  S.txs.push(t);setRec(k,id,p,{st:'done',txId:t.id,at:Date.now()});
  save();closeSheet();render();toast('اتسجّل التحصيل ✓');
}
function rejectIt(k,id,p){
  const it=item(k,id);if(!it)return;
  sheet(`<h2>✕ ${esc(it.name)}</h2><label>السبب (اختياري)<input id="k-r" type="text"></label>
  <button class="btn" style="background:var(--exp)" onclick="doReject('${k}','${id}',${pj(p)})">تأكيد الرفض</button>`);
}
function doReject(k,id,p){setRec(k,id,p,{st:'rej',reason:$('#k-r').value.trim(),at:Date.now()});save();closeSheet();render();toast('اتسجّل كمرفوض')}
function undoIt(k,id,p){
  const s=stOf(getRec(k,id,p));
  if(s.st==='done'){
    if(isClosed(s.t.date))return toast('الشهر بتاع التحصيل ده مقفول');
    if(!confirm('هيتلغي التحصيل ويتمسح من الحركات. متأكد؟'))return;
    S.txs=S.txs.filter(t=>t.id!==s.t.id);
  }
  setRec(k,id,p,null);save();render();toast('اتلغى');
}

/* ========== تكويد البنود ========== */
const IT={
  exp:{edit:id=>catForm(id,'exp'),del:ids=>delCats(ids)},
  inc:{edit:id=>catForm(id,'inc'),del:ids=>delCats(ids)},
  m:{edit:id=>monForm(id),del:ids=>{S.monthly=S.monthly.filter(i=>!ids.includes(i.id))}},
  a:{edit:id=>annForm(id),del:ids=>{S.annual=S.annual.filter(i=>!ids.includes(i.id))}},
  e:{edit:id=>expForm(id),del:ids=>{S.expected=S.expected.filter(i=>!ids.includes(i.id))}}
};
function delCats(ids){
  const tx=S.txs.filter(t=>ids.includes(t.cat));
  if(tx.some(t=>isClosed(t.date))){alert('فيه بنود عليها حركات في شهور مقفولة. افتح الشهور دي الأول.');return false}
  if(tx.length&&!confirm(`البنود دي عليها ${tx.length} حركة، وهيتمسحوا معاها. متأكد؟`))return false;
  S.txs=S.txs.filter(t=>!ids.includes(t.cat));S.cats=S.cats.filter(c=>!ids.includes(c.id));
}
function itable(key,cols,rows){
  const body=rows.length?rows.map(r=>`<tr class="${r.active===false?'off':''}"><td><input type="checkbox" class="sel" value="${r.id}"></td>${cols.map(c=>`<td onclick="IT['${key}'].edit('${r.id}')">${c.v(r)}</td>`).join('')}<td><button class="mini" onclick="IT['${key}'].edit('${r.id}')">✏️</button></td></tr>`).join('')
    :`<tr><td colspan="${cols.length+2}" class="empty">لا يوجد بنود</td></tr>`;
  return `<div class="tbl"><table class="it"><thead><tr><th><input type="checkbox" onchange="document.querySelectorAll('#it-${key} .sel').forEach(x=>x.checked=this.checked)"></th>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr></thead><tbody id="it-${key}">${body}</tbody></table></div>`;
}
function delSel(key){
  const ids=[...document.querySelectorAll(`#it-${key} .sel:checked`)].map(x=>x.value);
  if(!ids.length)return toast('علّم على البنود اللي عايز تمسحها');
  if(!confirm(`تمسح ${ids.length} بند؟`))return;
  if(IT[key].del(ids)===false)return;
  save();render();toast('اتمسح ✓');
}
function vItems(){
  const k=itab,act=r=>r.active!==false?'شغال':'<span class="muted">موقوف</span>',nm={l:'البند',v:r=>`<b>${esc(r.name)}</b>`},nt={l:'ملاحظات',v:r=>esc(r.note||'')};
  let h=`<h3>📋 ${esc(L('items'))}</h3>`+tabsHTML([['exp',L('exp')],['inc',L('inc')],['m',L('monthly')],['a',L('annual')],['e',L('expected')]],k,'itab');
  let cols,rows,add;
  if(k==='exp'||k==='inc'){rows=S.cats.filter(c=>c.kind===k);cols=[nm,{l:'الحالة',v:act}];add=`catForm(null,'${k}')`}
  else if(k==='m'){rows=S.monthly;cols=[nm,{l:'المبلغ المتوقع',v:r=>num(+r.amount||0)},{l:'يوم التحصيل',v:r=>+r.day||1},nt,{l:'الحالة',v:act}];add='monForm()'}
  else if(k==='a'){
    const y=cur.y;h+=yearBar();
    rows=[...S.annual].sort((a,b)=>(a.due||'99').localeCompare(b.due||'99'));
    cols=[nm,{l:'ميعاد التحصيل',v:r=>r.due?fdate(y+'-'+r.due):'—'},{l:`تحصيل ${y-1}`,v:r=>{const v=annLast(r,y);return v!=null?num(v):'—'}},
      {l:'% الزيادة',v:r=>{const p=annPct(annLast(r,y),annCur(r,y));return p!==null?(p>0?'+':'')+p+'%':'—'}},{l:`تحصيل ${y}`,v:r=>{const v=annCur(r,y);return v!=null?`<b>${num(v)}</b>`:'—'}},nt,{l:'الحالة',v:act}];
    add='annForm()';
  }
  else{rows=[...S.expected].sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));cols=[nm,{l:'المبلغ',v:r=>num(+r.amount||0)},{l:'التاريخ المتوقع',v:r=>fdate(r.date)},nt];add='expForm()'}
  h+=`<div class="etbar"><button class="mini pri" onclick="${add}">+ إضافة بند</button><button class="mini danger" onclick="delSel('${k}')">🗑 حذف المحدد</button>${k==='a'?'<button class="mini" onclick="applyAllPct()">٪ زيادة على الكل</button>':''}</div>`;
  return h+itable(k,cols,rows);
}
const fin=()=>{save();closeSheet();render();toast('اتحفظ ✓')};
const actChk=v=>`<label class="chk"><input type="checkbox" id="f9" ${v!==false?'checked':''}> شغال</label>`;
function catForm(id,kind){
  const c=id?C(id):{name:'',kind,active:true};
  sheet(`<h2>${id?'تعديل':'إضافة'} بند ${c.kind==='exp'?esc(L('expOne')):esc(L('incOne'))}</h2>
  <label>اسم البند<input id="f1" value="${esc(c.name)}"></label>${actChk(c.active)}
  <button class="btn" onclick="catSave('${id||''}','${c.kind}')">حفظ</button>`);
}
function catSave(id,kind){
  const name=$('#f1').value.trim();if(!name)return toast('اكتب الاسم');
  if(S.cats.some(x=>x.kind===kind&&x.name===name&&x.id!==id))return toast('البند ده موجود قبل كده');
  const c=id?C(id):{id:uid(),kind};c.name=name;c.active=$('#f9').checked;if(!id)S.cats.push(c);fin();
}
function monForm(id){
  const i=id?item('m',id):{name:'',amount:'',day:1,note:'',active:true};
  sheet(`<h2>${id?'تعديل':'إضافة'} — ${esc(L('monthly'))}</h2>
  <label>اسم البند<input id="f1" value="${esc(i.name)}"></label>
  <div class="two"><label>المبلغ المتوقع<input id="f2" inputmode="decimal" value="${i.amount||''}"></label><label>يوم التحصيل<input id="f3" inputmode="numeric" value="${i.day||1}"></label></div>
  <label>ملاحظات<input id="f4" value="${esc(i.note||'')}"></label>${actChk(i.active)}
  <button class="btn" onclick="monSave('${id||''}')">حفظ</button>`);
}
function monSave(id){
  const name=$('#f1').value.trim();if(!name)return toast('اكتب الاسم');
  let i=id?item('m',id):null;if(!i){i={id:uid(),start:NKM};S.monthly.push(i)}
  Object.assign(i,{name,amount:parseNum($('#f2').value)||0,day:Math.min(31,Math.max(1,parseNum($('#f3').value)||1)),note:$('#f4').value.trim(),active:$('#f9').checked});fin();
}
function annForm(id){
  const y=cur.y,a=id?item('a',id):{name:'',due:'',note:'',amounts:{},active:true};
  const Lv=id?annLast(a,y):null,V=id?annCur(a,y):null,pct=annPct(Lv,V);
  sheet(`<h2>${id?'تعديل':'إضافة'} — ${esc(L('annual'))}</h2>
  <label>اسم البند<input id="f1" value="${esc(a.name)}"></label>
  <label>ميعاد التحصيل<input id="f2" type="date" value="${a.due?y+'-'+a.due:''}"></label>
  <div class="two"><label>تحصيل ${y-1}<input id="p-last" inputmode="decimal" value="${Lv??''}" oninput="planCalc('last')"></label><label>نسبة الزيادة %<input id="p-pct" inputmode="decimal" value="${pct??''}" oninput="planCalc('pct')"></label></div>
  <label>تحصيل ${y}<input id="p-cur" inputmode="decimal" value="${V??''}" oninput="planCalc('cur')"></label>
  <label>ملاحظات<input id="f4" value="${esc(a.note||'')}"></label>${actChk(a.active)}
  <button class="btn" onclick="annSave('${id||''}')">حفظ</button>`);
}
function planCalc(src){
  const Lv=parseNum($('#p-last').value),P=parseNum($('#p-pct').value),V=parseNum($('#p-cur').value);
  if(src==='cur')$('#p-pct').value=(Lv>0&&V>0)?r2((V/Lv-1)*100):'';
  else if(Lv>0&&!isNaN(P))$('#p-cur').value=r2(Lv*(1+P/100));
}
function annSave(id){
  const y=cur.y,name=$('#f1').value.trim();if(!name)return toast('اكتب الاسم');
  let a=id?item('a',id):null;if(!a){a={id:uid(),amounts:{},st:{}};S.annual.push(a)}
  const d=$('#f2').value;a.name=name;a.due=d?d.slice(5):'';a.note=$('#f4').value.trim();a.active=$('#f9').checked;a.amounts=a.amounts||{};
  const Lv=parseNum($('#p-last').value),V=parseNum($('#p-cur').value);
  if(!isNaN(Lv))a.amounts[y-1]=Lv;else delete a.amounts[y-1];
  if(!isNaN(V))a.amounts[y]=V;else delete a.amounts[y];
  fin();
}
function expForm(id){
  const e=id?item('e',id):{name:'',amount:'',date:'',note:''};
  sheet(`<h2>${id?'تعديل':'إضافة'} — ${esc(L('expected'))}</h2>
  <label>اسم البند<input id="f1" value="${esc(e.name)}"></label>
  <div class="two"><label>المبلغ<input id="f2" inputmode="decimal" value="${e.amount||''}"></label><label>التاريخ المتوقع<input id="f3" type="date" value="${e.date||''}"></label></div>
  <label>ملاحظات<input id="f4" value="${esc(e.note||'')}"></label>
  <button class="btn" onclick="expSave('${id||''}')">حفظ</button>`);
}
function expSave(id){
  const name=$('#f1').value.trim();if(!name)return toast('اكتب الاسم');
  let e=id?item('e',id):null;if(!e){e={id:uid()};S.expected.push(e)}
  Object.assign(e,{name,amount:parseNum($('#f2').value)||0,date:$('#f3').value,note:$('#f4').value.trim()});fin();
}
function applyAllPct(){
  const y=cur.y;if(!S.annual.length)return toast('لا يوجد بنود');
  const p=parseNum(prompt(`نسبة الزيادة على تحصيل ${y-1} لكل البنود (%)`,'10'));if(isNaN(p))return;
  let n=0;S.annual.forEach(a=>{const Lv=annLast(a,y);if(Lv>0){a.amounts=a.amounts||{};a.amounts[y-1]=Lv;a.amounts[y]=r2(Lv*(1+p/100));n++}});
  if(!n)return toast(`مفيش مبالغ مسجلة لسنة ${y-1}`);
  save();render();toast(`اتحسبت زيادة ${p}% لـ ${n} بند ✓`);
}

/* ========== التقارير ========== */
function vReports(){
  return tabsHTML([['month','الشهر'],['year','السنة'],['txs','الحركات'],['stmt','كشف حساب']],rtab,'rtab')+({month:rMonth,year:rYear,txs:rTxs,stmt:rStmt})[rtab]();
}
function rTxs(){
  return monthBar()+tabsHTML([['all','الكل'],['exp',L('exp')],['inc',L('inc')]],txF,'txF')
  +`<input placeholder="🔍 بحث" value="${esc(txQ)}" oninput="txQ=this.value;$('#txl').innerHTML=txGroups()"><div id="txl">${txGroups()}</div>`;
}
function txGroups(){
  let l=monthTx(cur.y,cur.m).filter(t=>txF==='all'||t.type===txF);
  const q=txQ.trim();if(q)l=l.filter(t=>(t.note||'').includes(q)||(C(t.cat)?.name||'').includes(q)||(M(t.method)?.name||'').includes(q));
  if(!l.length)return '<p class="empty">لا يوجد حركات</p>';
  l.sort(byDesc);const g={};l.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  return Object.keys(g).map(d=>{const x=new Date(d+'T00:00');return `<div class="day">${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()]}</div><div class="list">${g[d].map(txRow).join('')}</div>`}).join('');
}
function breakdown(list,kind){
  const g={};list.filter(t=>t.type===kind).forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amount);
  const tot=Object.values(g).reduce((a,b)=>a+b,0);if(!tot)return '<p class="empty">لا يوجد</p>';
  return '<div class="list">'+Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div class="row col" onclick="openStmt('cat','${id}')"><div class="rowin"><b>${esc(C(id)?.name||'—')}</b><span>${fmt(v)} <small class="muted" style="display:inline">${Math.round(v/tot*100)}%</small></span></div><div class="bar"><i class="${kind}" style="width:${v/tot*100}%"></i></div></div>`).join('')+'</div>';
}
function rMonth(){
  const list=monthTx(cur.y,cur.m),key=ym(cur.y,cur.m),cl=S.closed[key];
  let h=monthBar()+cards(sums(list));
  if(cl)h+=`<div class="alert info">🔒 اتقفل يوم ${new Date(cl.at).toLocaleDateString('ar-EG')}</div>`;
  h+=`<h3>${esc(L('exp'))} حسب البند</h3>`+breakdown(list,'exp')+`<h3>${esc(L('inc'))} حسب البند</h3>`+breakdown(list,'inc');
  h+=`<h3>حسب ${esc(L('pm'))}</h3><div class="list">`+pmRows(list)+'</div>';
  h+=`<button class="btn ghost" onclick="${cl?'openMonth':'closeMonth'}('${key}')">${cl?'🔓 فتح الشهر':'🔒 قفل الشهر'}</button>`;
  return h;
}
function rYear(){
  const y=cur.y,data=MONTHS.map((n,i)=>sums(monthTx(y,i+1)));
  const yl=S.txs.filter(t=>t.date.startsWith(y+'-')),max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  let h=yearBar()+cards(sums(yl));
  h+=`<div class="chart">${data.map((d,i)=>`<div class="cm" onclick="cur.m=${i+1};rtab='month';render()"><div class="bars"><i class="inc" style="height:${d.inc/max*100}%"></i><i class="exp" style="height:${d.exp/max*100}%"></i></div><small>${i+1}</small></div>`).join('')}</div>
  <div class="legend"><span><i class="inc"></i>${esc(L('inc'))}</span><span><i class="exp"></i>${esc(L('exp'))}</span></div>`;
  const rows=data.map((d,i)=>(d.inc||d.exp)?`<div class="row" onclick="cur.m=${i+1};rtab='month';render()"><div class="grow"><b>${MONTHS[i]} ${S.closed[ym(y,i+1)]?'🔒':''}</b><small><span class="pos">+${num(d.inc)}</span> · <span class="neg">-${num(d.exp)}</span></small></div><b class="${d.net<0?'neg':'pos'}">${fmt(d.net)}</b></div>`:'').join('');
  h+='<h3>شهر بشهر</h3>'+(rows?`<div class="list">${rows}</div>`:'<p class="empty">لا يوجد حركات</p>');
  h+=`<h3>${esc(L('exp'))} السنة حسب البند</h3>`+breakdown(yl,'exp');
  return h;
}
function openStmt(kind,id,year){
  stmt.kind=kind;stmt.id=id;
  if(year){stmt.from=year+'-01-01';stmt.to=year+'-12-31'}
  else{stmt.from=ym(cur.y,cur.m)+'-01';stmt.to=ym(cur.y,cur.m)+'-'+pad(new Date(cur.y,cur.m,0).getDate())}
  rtab='stmt';go('reports');
}
function rStmt(){
  const isM=stmt.kind==='method',opts=isM?S.methods:S.cats;
  if(!stmt.id||!(isM?M(stmt.id):C(stmt.id)))stmt.id=opts[0]?.id;
  let h=`<div class="seg">${[['cat','بند'],['method','طريقة دفع']].map(([k,l])=>`<button class="${stmt.kind===k?'on':''}" onclick="stmt.kind='${k}';stmt.id=null;render()">${l}</button>`).join('')}</div>
  <select onchange="stmt.id=this.value;render()">${opts.map(o=>`<option value="${o.id}" ${o.id===stmt.id?'selected':''}>${esc(o.name)}${isM?'':(o.kind==='exp'?' ('+esc(L('expOne'))+')':' ('+esc(L('incOne'))+')')}</option>`).join('')}</select>
  <div class="two"><label>من<input type="date" value="${stmt.from}" onchange="stmt.from=this.value;render()"></label><label>إلى<input type="date" value="${stmt.to}" onchange="stmt.to=this.value;render()"></label></div>`;
  const id=stmt.id;if(!id)return h;
  const inR=t=>t.date>=stmt.from&&t.date<=stmt.to;
  if(isM){
    const rows=S.txs.filter(t=>inR(t)&&t.method===id&&t.type!=='tr').sort(byAsc);let i=0,o=0;
    const body=rows.map(t=>{const isIn=t.type==='inc';if(isIn)i+=t.amount;else o+=t.amount;
      return `<tr onclick="editTx('${t.id}')"><td>${fd(t.date)}</td><td>${esc(C(t.cat)?.name||'')}${t.note?' · '+esc(t.note):''}</td><td class="pos">${isIn?num(t.amount):''}</td><td class="neg">${isIn?'':num(t.amount)}</td></tr>`}).join('');
    h+=`<div class="cards"><div class="card inc"><small>قبضت</small><b>${fmt(i)}</b></div><div class="card exp"><small>صرفت</small><b>${fmt(o)}</b></div></div>`;
    h+=rows.length?`<div class="tbl"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>قبضت</th><th>صرفت</th></tr></thead><tbody>${body}</tbody></table></div>`:'<p class="empty">لا يوجد حركات</p>';
  }else{
    const rows=S.txs.filter(t=>inR(t)&&t.cat===id).sort(byAsc);let cum=0;
    const body=rows.map(t=>{cum+=t.amount;return `<tr onclick="editTx('${t.id}')"><td>${fd(t.date)}</td><td>${esc(M(t.method)?.name||'')}${t.note?' · '+esc(t.note):''}</td><td>${num(t.amount)}</td><td>${num(cum)}</td></tr>`}).join('');
    h+=`<div class="cards"><div class="card ${C(id).kind}"><small>الإجمالي</small><b>${fmt(cum)}</b></div><div class="card"><small>عدد الحركات</small><b>${rows.length}</b></div></div>`;
    h+=rows.length?`<div class="tbl"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th><th>التراكمي</th></tr></thead><tbody>${body}</tbody></table></div>`:'<p class="empty">لا يوجد حركات</p>';
  }
  return h;
}

/* ========== الإعدادات ========== */
function vSettings(){
  return tabsHTML([['gen','عام'],['look','المظهر'],['sec','الأمان'],['data','البيانات']],stab,'stab')+({gen:genTab,look:lookTab,sec:secTab,data:dataTab})[stab]();
}
function genTab(){
  let h=`<h3>اسم التطبيق</h3><div class="inl"><input id="s-name" value="${esc(appName())}"><button class="mini pri" onclick="setName()">حفظ</button></div>`;
  h+=`<button class="btn ghost" onclick="itab='exp';go('items')">📋 ${esc(L('items'))}</button>`;
  h+=`<h3>${esc(L('pm'))}</h3><div class="list">${S.methods.map(m=>`<div class="row ${m.active?'':'off'}" onclick="editMethod('${m.id}')"><span class="dot" style="background:${m.color}"></span><div class="grow"><b>${esc(m.name)}</b><small>${TYPES[m.type]||''}${m.bank?' · '+esc(m.bank):''}</small></div>${m.active?'':'<small>موقوفة</small>'}</div>`).join('')}</div>
  <button class="btn ghost" onclick="editMethod()">+ إضافة طريقة دفع</button>`;
  h+=`<h3>الإشعارات</h3><div class="box"><label>التنبيه قبل الميعاد بـ (يوم)<input type="text" inputmode="numeric" value="${+S.settings.lead||10}" onchange="S.settings.lead=Math.max(1,parseNum(this.value)||10);save();render();toast('اتحفظ ✓')"></label>${notifBtn()}</div>`;
  const keys=new Set(S.txs.map(t=>t.date.slice(0,7)));Object.keys(S.closed).forEach(k=>keys.add(k));keys.add(NKM);
  h+='<h3>قفل الشهور</h3><div class="list">'+[...keys].sort().reverse().map(k=>{const[y,m]=k.split('-').map(Number),s=sums(monthTx(y,m)),cl=S.closed[k];
    return `<div class="row"><div class="grow"><b>${MONTHS[m-1]} ${y} ${cl?'🔒':''}</b><small>${esc(L('inc'))} ${fmt(s.inc)} · ${esc(L('exp'))} ${fmt(s.exp)}</small></div><button class="mini ${cl?'':'pri'}" onclick="${cl?'openMonth':'closeMonth'}('${k}')">${cl?'فتح':'قفل'}</button></div>`}).join('')+'</div>';
  return h;
}
function lookTab(){
  let h=`<h3>الثيم</h3><div class="themes">${Object.entries(THEMES).map(([k,t])=>`<button class="th ${(S.settings.theme||'teal')===k?'on':''}" style="--c:${t.p}" onclick="setTheme('${k}')"><i></i>${t.n}</button>`).join('')}</div>`;
  h+=`<h3>المسميات</h3><div class="list">${Object.keys(LDEF).map(k=>`<div class="row"><div class="grow"><small>${LDEF[k]}</small><input data-lk="${k}" value="${esc(L(k))}"></div></div>`).join('')}</div>
  <div class="two"><button class="btn" onclick="saveLabels()">حفظ المسميات</button><button class="btn ghost" onclick="resetLabels()">رجّع الأصلي</button></div>`;
  return h;
}
function secTab(){
  let h='<h3>الرقم السري</h3><div class="list">';
  h+=LK.pin?`<div class="row" onclick="pinForm()"><div class="grow"><b>🔑 تغيير الرقم السري</b><small>متفعّل ✓</small></div></div><div class="row" onclick="pinOffForm()"><div class="grow"><b class="neg">إلغاء الرقم السري</b></div></div>`
    :`<div class="row" onclick="pinForm()"><div class="grow"><b>🔒 تفعيل الرقم السري</b><small>مش متفعّل</small></div></div>`;
  h+='</div>';
  if(LK.pin){
    h+=`<h3>البصمة / Face ID</h3><div class="list">${LK.bio?`<div class="row"><div class="grow"><b>👆 البصمة متفعّلة ✓</b></div><button class="mini danger" onclick="LK.bio=null;saveLK();render()">إلغاء</button></div>`:`<div class="row" onclick="bioEnable()"><div class="grow"><b>👆 تفعيل الدخول بالبصمة</b></div></div>`}</div>
    <h3>القفل التلقائي</h3><select onchange="LK.after=+this.value;saveLK();toast('اتحفظ ✓')">${[[0,'فوراً'],[1,'بعد دقيقة'],[5,'بعد 5 دقايق'],[15,'بعد ربع ساعة']].map(([v,l])=>`<option value="${v}" ${(LK.after??1)===v?'selected':''}>${l}</option>`).join('')}</select>
    <button class="btn ghost" onclick="showLock()">🔒 اقفل دلوقتي</button>`;
  }
  return h;
}
function dataTab(){
  const lb=localStorage.getItem(BKEY);
  return `<h3>النسخ الاحتياطي <span class="muted" style="font-size:12px">${lb?'آخر نسخة: '+lb:''}</span></h3>
  <button class="btn" onclick="backup()">⬇️ تنزيل نسخة</button>
  ${CAN_SHARE?'<button class="btn ghost" onclick="shareBackup()">📤 مشاركة نسخة</button>':''}
  <button class="btn ghost" onclick="$('#restoreFile').click()">⬆️ استرجاع نسخة</button>
  <h3>منطقة خطر</h3><button class="btn ghost danger" onclick="resetAll()">مسح كل البيانات</button>`;
}
function setName(){S.settings.appName=$('#s-name').value.trim()||'مصروفي';save();applyName();render();toast('اتحفظ ✓')}
function setTheme(k){S.settings.theme=k;save();applyTheme();render()}
function saveLabels(){
  const o={};document.querySelectorAll('[data-lk]').forEach(i=>{const v=i.value.trim();if(v&&v!==LDEF[i.dataset.lk])o[i.dataset.lk]=v});
  S.settings.labels=o;save();render();toast('اتحفظ ✓');
}
function resetLabels(){S.settings.labels={};save();render();toast('رجعت المسميات الأصلية')}

/* ========== الشيت والنماذج ========== */
function sheet(html){$('#sheet .body').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2300)}
function opt(arr,sel){return arr.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}</option>`).join('')}

/* --- حركة --- */
function newTx(){
  const dm=(S.methods.find(m=>m.active&&m.type==='cash')||S.methods.find(m=>m.active)||{}).id;
  if(!dm)return toast('ضيف طريقة دفع الأول');
  const isNow=cur.y===NY&&cur.m===NOW.getMonth()+1;
  F={id:null,type:'exp',amount:'',cat:'',method:dm,to:'',date:isNow?today():ym(cur.y,cur.m)+'-01',note:'',created:0};
  txForm();
}
function editTx(id){const t=S.txs.find(x=>x.id===id);if(!t)return;F={...t,amount:String(t.amount),cat:t.cat||'',to:t.to||'',note:t.note||''};txForm()}
function grab(){
  const v=s=>$(s)?$(s).value:null;
  if(v('#f-amt')!==null)F.amount=v('#f-amt');if(v('#f-d')!==null)F.date=v('#f-d');if(v('#f-n')!==null)F.note=v('#f-n');
  if(v('#f-m')!==null)F.method=v('#f-m');if(v('#f-to')!==null)F.to=v('#f-to');if(v('#f-cat')!==null)F.cat=v('#f-cat');
}
function txForm(){
  const orig=F.id&&S.txs.find(t=>t.id===F.id),locked=orig&&isClosed(orig.date);
  const cats=S.cats.filter(c=>c.kind===F.type&&(c.active!==false||c.id===F.cat));
  const meths=S.methods.filter(m=>m.active||m.id===F.method||m.id===F.to);
  if(F.type!=='tr'&&!cats.some(c=>c.id===F.cat))F.cat=cats[0]?.id||'';
  const types=[['exp',L('expOne')],['inc',L('incOne')]].concat(F.type==='tr'?[['tr','تحويل']]:[]);
  sheet(`<h2>${F.id?'تعديل حركة':'حركة جديدة'}</h2>
  ${locked?'<p class="warn">🔒 الشهر ده مقفول</p>':''}
  <div class="seg">${types.map(([k,l])=>`<button class="${F.type===k?'on '+k:''}" onclick="grab();F.type='${k}';txForm()">${esc(l)}</button>`).join('')}</div>
  <input id="f-amt" class="amt-in" type="text" inputmode="decimal" placeholder="0" value="${esc(F.amount)}">
  ${F.type==='tr'
    ?`<label>من<select id="f-m">${opt(meths,F.method)}</select></label><label>إلى<select id="f-to">${opt(meths,F.to)}</select></label>`
    :`<div class="fl">البند<div class="inl"><select id="f-cat">${opt(cats,F.cat)}</select><button type="button" class="mini" onclick="quickCat()">+ جديد</button></div></div>
      <label>${F.type==='exp'?'دفعت بـ':'استلمت على'}<select id="f-m">${opt(meths,F.method)}</select></label>`}
  <label>التاريخ<input id="f-d" type="date" value="${F.date}"></label>
  <label>ملاحظة<input id="f-n" type="text" value="${esc(F.note)}"></label>
  <button class="btn" onclick="saveTx()" ${locked?'disabled':''}>سجّل</button>
  ${F.id&&!locked?'<button class="btn ghost danger" onclick="delTx()">حذف الحركة</button>':''}`);
  if(!F.id)setTimeout(()=>$('#f-amt')&&$('#f-amt').focus(),260);
}
function quickCat(){
  grab();const n=(prompt('اسم البند الجديد')||'').trim();if(!n)return;
  const c=ensureCat(n,F.type);c.active=true;save();F.cat=c.id;txForm();toast('اتضاف البند ✓');
}
function saveTx(){
  grab();const amount=parseNum(F.amount);
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!F.date)return toast('اختار التاريخ');
  if(isClosed(F.date))return toast(`شهر ${MONTHS[+F.date.slice(5,7)-1]} مقفول`);
  if(!F.method)return toast('اختار طريقة الدفع');
  if(F.type==='tr'){if(!F.to||F.to===F.method)return toast('اختار طريقتين مختلفتين')}
  else if(!F.cat)return toast('اختار البند');
  const t={id:F.id||uid(),type:F.type,amount,method:F.method,date:F.date,note:(F.note||'').trim(),created:F.created||Date.now()};
  if(F.src)t.src=F.src;
  if(F.type==='tr')t.to=F.to;else t.cat=F.cat;
  const i=S.txs.findIndex(x=>x.id===t.id);if(i>=0)S.txs[i]=t;else S.txs.push(t);
  save();closeSheet();render();toast('اتسجّلت ✓');
}
function delTx(){if(!confirm('تمسح الحركة دي؟'))return;S.txs=S.txs.filter(t=>t.id!==F.id);save();closeSheet();render();toast('اتمسحت')}

/* --- طريقة دفع --- */
function editMethod(id){
  const m=id?M(id):{name:'',type:'cash',bank:'',color:COLORS[1],active:true};
  const used=id&&S.txs.some(t=>t.method===id||t.to===id);
  sheet(`<h2>${id?'تعديل':'إضافة'} طريقة دفع</h2>
  <label>الاسم<input id="m-name" value="${esc(m.name)}"></label>
  <label>النوع<select id="m-type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${m.type===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>البنك / الجهة<input id="m-bank" value="${esc(m.bank)}"></label>
  <div class="fl">اللون</div>
  <div class="colors">${COLORS.map(c=>`<button type="button" class="sw ${c===m.color?'on':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('')}</div>
  <input type="hidden" id="m-color" value="${m.color}">
  ${id?`<label class="chk"><input type="checkbox" id="m-act" ${m.active?'checked':''}> شغالة</label>`:''}
  <button class="btn" onclick="saveMethod('${id||''}')">حفظ</button>
  ${id&&!used?`<button class="btn ghost danger" onclick="delMethod('${id}')">حذف</button>`:''}`);
}
function pickColor(el,c){document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#m-color').value=c}
function saveMethod(id){
  const name=$('#m-name').value.trim();if(!name)return toast('اكتب الاسم');
  const m=id?M(id):{id:uid(),active:true};
  Object.assign(m,{name,type:$('#m-type').value,bank:$('#m-bank').value.trim(),color:$('#m-color').value});
  if($('#m-act'))m.active=$('#m-act').checked;if(!id)S.methods.push(m);
  fin();
}
function delMethod(id){if(!confirm('تمسح طريقة الدفع دي؟'))return;S.methods=S.methods.filter(m=>m.id!==id);save();closeSheet();render()}

/* ========== قفل الشهر ========== */
function closeMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`قفل ${MONTHS[m-1]} ${y}؟`))return;
  const s=sums(monthTx(y,m));
  S.closed[k]={at:new Date().toISOString(),inc:s.inc,exp:s.exp};
  save();render();toast('اتقفل الشهر 🔒');
}
function openMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`فتح ${MONTHS[m-1]} ${y}؟`))return;
  delete S.closed[k];save();render();toast('اتفتح الشهر');
}

/* ========== النسخ الاحتياطي ========== */
const backupJSON=()=>JSON.stringify({app:'masrofi',appVersion:APP_VERSION,exported:new Date().toISOString(),data:S});
const backupName=()=>`masrofi-backup-${today()}.json`;
function markBackup(){localStorage.setItem(BKEY,today());render()}
function backup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
  a.download=backupName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);markBackup();toast('اتنزلت النسخة ✓');
}
async function shareBackup(){
  try{await navigator.share({files:[new File([backupJSON()],backupName(),{type:'application/json'})],title:appName()});markBackup()}catch(e){}
}
function restore(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    let d=JSON.parse(r.result);if(d.data)d=d.data;
    if(!Array.isArray(d.methods)||!Array.isArray(d.txs))throw 0;
    if(!confirm(`النسخة فيها ${d.txs.length} حركة.\nهتستبدل البيانات الحالية. نكمل؟`))return;
    S=normalize(d);save();applyTheme();applyName();go('home');toast('اتسترجعت البيانات ✓');
  }catch(e){alert('الملف ده مش نسخة احتياطية صالحة')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('هتمسح كل الحركات والإعدادات من الجهاز ده. متأكد؟'))return;
  if(!confirm('آخر تأكيد: المسح مش هيترجع.'))return;
  S=normalize(defaults());save();applyTheme();applyName();go('home');toast('اتمسح كل شيء');
}

/* ========== تشغيل ========== */
$('#hd').textContent=NOW.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
applyTheme();applyName();save();render();
if(LK.pin){showLock();if(LK.bio)setTimeout(()=>bioUnlock(true),400)}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>setTimeout(pushAlerts,1500)).catch(()=>{}));
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(LK.pin&&hiddenAt&&(Date.now()-hiddenAt)/60000>=(LK.after??1))showLock();
  updateBell();pushAlerts();
});
</script>
</body>
</html>
