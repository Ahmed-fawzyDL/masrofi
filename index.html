<title>Fawzy Folio</title>
<style>
:root{--p:#0f766e;--bg:#f4f6f8;--card:#fff;--soft:#eef1f4;--soft2:#f8fafc;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--inc:#16a34a;--exp:#dc2626;--tr:#2563eb}
body.dark{--bg:#0b1220;--card:#162032;--soft:#22304a;--soft2:#1a2538;--tx:#e5e7eb;--mu:#9ca3af;--bd:#2b3a52;--inc:#22c55e;--exp:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
header{background:var(--p);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px}

header h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header span{font-size:12px;opacity:.85}
header .hr{display:flex;align-items:center;gap:8px;flex-shrink:0}
#bell{position:relative;background:#ffffff26;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px}
#bell b{position:absolute;top:-4px;left:-4px;background:#dc2626;color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
#bell b:empty{display:none}
main{max-width:560px;margin:auto;padding:10px 10px calc(86px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;align-items:center;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mu);font:inherit;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;white-space:nowrap}
nav button span{font-size:18px}nav button.on{color:var(--p);font-weight:700}
nav .fab{flex:0 0 48px;height:48px;border-radius:50%;background:var(--p);color:#fff;font-size:26px;margin:-24px 3px 0;box-shadow:0 4px 12px #0004;justify-content:center;line-height:1}
input[type=file]{display:none!important}
h3{font-size:14px;margin:14px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--mu);font-weight:400}
.mbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:5px;margin-bottom:8px;gap:6px}
.mbar button{width:36px;height:34px;flex:0 0 36px;border:0;background:var(--soft);border-radius:9px;font-size:19px;color:var(--tx)}
.mbar b{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center}
.lock{font-size:11px;background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:10px;font-weight:600}.lock.op{background:#dcfce7;color:#166534}
.hero{background:var(--p);background-image:linear-gradient(135deg,#ffffff14,#0000002e);color:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
.hero-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;line-height:1.9;padding:2px 2px 0}
.hero-t .hm{font-weight:700;background:#ffffff2e;padding:0 10px;border-radius:12px}
.hero-t em{font-style:normal;font-size:11px;font-weight:700;padding:0 9px;border-radius:12px;margin-inline-start:auto}
.hero-t em.op{background:#dcfce7;color:#166534}.hero-t em.cl{background:#fef3c7;color:#92400e}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hbtns button{background:#ffffff1f;border:1px solid #ffffff38;border-radius:12px;color:#fff;font:inherit;padding:8px 10px;text-align:right;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.hbtns small{font-size:11px;opacity:.9}.hbtns b{font-size:19px}.hbtns i{font-style:normal;font-size:11px;opacity:.8;align-self:flex-end}
.hnet{margin-top:8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#0000001f;border-radius:10px;padding:7px 10px}.hnet b{font-size:16px}
.hneg{background:#fee2e2;color:#b91c1c;padding:1px 10px;border-radius:10px}
.trio{display:flex;justify-content:space-between;margin-top:6px;gap:6px}.trio span{font-size:11px;color:var(--mu);display:flex;flex-direction:column;min-width:0}.trio b{font-size:15px}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tile{background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0}
.tile.wide{grid-column:1/-1}
.tile small{display:block;color:var(--mu);font-size:11px;margin:2px 0;white-space:normal}
.tile b{font-size:15px;display:block}
.prog{height:5px;background:var(--soft);border-radius:3px;margin-top:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--inc)}
.svgc{width:100%;height:auto;display:block}.svgc text{font-family:inherit}
.donut{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.dleg{flex:1;min-width:150px;font-size:12px}.dleg div{display:flex;align-items:center;gap:6px;margin:4px 0}
.dleg i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}.dleg span{flex:1}
.pos{color:var(--inc)!important}.neg{color:var(--exp)!important}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--soft);cursor:pointer}.row:last-child{border-bottom:0}
a.row{color:inherit;text-decoration:none}
.row.off,tr.off{opacity:.5}
.rowin{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.grow{flex:1;min-width:0}
.nrow b,.nrow small{white-space:normal!important}
.dot{width:11px;height:11px;border-radius:50%;flex:0 0 11px;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:0 0 32px;font-weight:700}
.amt{text-align:left;font-weight:700;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end}.amt.inc{color:var(--inc)}
.amt small{text-align:left;font-weight:400;font-size:11px}
.empty{text-align:center;color:var(--mu);padding:20px 8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:6px 12px;font:inherit;font-size:13px;color:var(--tx)}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.sseg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:2px}
.sseg button{border:0;background:none;padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;color:var(--mu)}
.sseg button.on{background:var(--card);color:var(--tx);font-weight:700;box-shadow:0 1px 2px #0002}
.seg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;color:var(--tx)}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px #0002}
.seg button.on.exp{color:var(--exp)}.seg button.on.inc{color:var(--inc)}
label,.fl{display:block;margin:8px 0;font-size:12px;color:var(--mu)}
input:not([type=checkbox]),select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;font:inherit;font-size:16px;background:var(--card);color:var(--tx)}
input:disabled,select:disabled{opacity:.5}
.inl{display:flex;gap:8px;align-items:stretch;margin-top:4px}.inl select,.inl input{margin-top:0!important;flex:1;min-width:0}.inl .mini{white-space:nowrap;font-weight:700}
label.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}label.chk input{width:19px;height:19px}
.amt-in{font-size:28px!important;text-align:center;font-weight:700;margin-top:8px!important}
.two{display:flex;gap:8px}.two>label,.two>.btn{flex:1;min-width:0}
.btn{display:block;width:100%;padding:10px;border:0;border-radius:10px;background:var(--p);color:#fff;font:inherit;font-size:14px;font-weight:700;margin-top:8px}
.btn.ghost{background:var(--card);color:var(--p);border:1px solid var(--bd)}.btn.danger{color:var(--exp)}.btn:disabled{opacity:.4}
.mini{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;color:var(--tx);white-space:nowrap}
.mini.pri{background:var(--p);color:#fff;border-color:var(--p)}
.mini.danger{color:var(--exp)}
.badge{font-size:11px;padding:1px 8px;border-radius:20px;white-space:nowrap;display:inline-block;font-weight:600}
.badge.done{background:#dcfce7;color:#166534}.badge.wait{background:#fef9c3;color:#854d0e}.badge.late{background:#fee2e2;color:#991b1b}
.badge.rej{background:#e5e7eb;color:#374151}.badge.soon{background:#dbeafe;color:#1e40af}
.warn{background:#fef3c7;color:#78350f;padding:8px 10px;border-radius:10px;font-size:13px;margin:6px 0}
.tbl{overflow-x:auto;background:var(--card);border-radius:12px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px 7px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;vertical-align:middle}th{background:var(--soft2);color:var(--mu);font-weight:600}
.it td{cursor:pointer}.it input[type=checkbox]{width:17px;height:17px;margin:0}
.pt input{min-width:130px;margin:0;padding:7px;font-size:14px}
.etbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.box{background:var(--card);border-radius:12px;padding:4px 12px 12px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{border:2px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 4px;font:inherit;font-size:11px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:5px}
.th i{width:24px;height:24px;border-radius:50%;background:var(--c)}.th.on{border-color:var(--p);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rbtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 4px;font:inherit;font-size:12px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.rbtn span{font-size:24px}
.phead{display:flex;align-items:center;gap:8px;margin:2px 0 8px;flex-wrap:wrap}.phead h3,.phead h2{margin:0;flex:1;font-size:15px}
.pcard{margin-bottom:8px;cursor:pointer;background:var(--card);border-radius:12px;padding:10px 12px}
.pcard small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
details.gen{background:var(--soft2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0}
details.gen summary{cursor:pointer;font-weight:700;font-size:13px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.fth,.fadd{width:70px;height:80px;border:1px solid var(--bd);border-radius:10px;background:var(--soft2);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;font-size:22px;padding:0;color:var(--tx);font-family:inherit}
.fth img{width:100%;height:58px;object-fit:cover;background:var(--soft)}
.fth small,.fadd small{font-size:10px;color:var(--mu);max-width:66px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fadd{border-style:dashed;color:var(--p)}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd)}.sw.on{box-shadow:0 0 0 2px var(--tx)}
.brand{text-align:center;color:var(--mu);font-size:11px;margin-top:22px;line-height:1.7;display:flex;flex-direction:column;align-items:center}
.brand b{color:var(--tx);font-size:12px}.brand a{color:var(--p);text-decoration:none}
/* --- قايمة التحصيلات --- */
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--soft)}
.ck:last-child{border-bottom:0}
.ck input[type=checkbox]{width:24px;height:24px;flex:0 0 24px;accent-color:#16a34a;margin:0}
.cki{width:24px;height:24px;flex:0 0 24px;border-radius:6px;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
.ck .grow{cursor:pointer}.ck .grow b{display:inline}.ck .grow small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.ck.done .grow>b{color:var(--inc)}
/* --- الكروت والجداول --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:0 0 8px}
.kpi{border-radius:12px;padding:9px 10px;background:#f1f5f9;border-top:4px solid #94a3b8;min-width:0}
.kpi small{display:block;font-size:11px;color:#6b7280}.kpi b{font-size:15px;color:#1f2937;word-break:break-word}
.kpi.inc{background:#f0fdf4;border-color:#16a34a}.kpi.inc b{color:#15803d}
.kpi.exp{background:#fef2f2;border-color:#dc2626}.kpi.exp b{color:#b91c1c}
.kpi.net{background:#eff6ff;border-color:#2563eb}.kpi.net b{color:#1d4ed8}
.kpi.warn{background:#fffbeb;border-color:#d97706}.kpi.warn b{color:#b45309}
.ptbl{overflow-x:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:8px}
.ptbl th{background:var(--p);color:#fff;font-weight:700}
.ptbl tbody tr:nth-child(even) td{background:var(--soft2)}
.ptbl tfoot td{background:var(--soft);font-weight:800}
.ptbl td.wrap{white-space:normal;min-width:110px}
.ptbl tr.clk{cursor:pointer}.ptbl tr.clk:active td{background:var(--soft)}
.ptbl tr.hl td{background:#fff7ed!important}
.ptbl .inc{color:var(--inc)}.ptbl .exp{color:var(--exp)}
.pnote{padding:14px;text-align:center;color:var(--mu)}
.pb{display:flex;align-items:center;gap:6px;min-width:100px}.pbar{flex:1;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.inc,.tag.ok{background:#dcfce7;color:#166534!important}.tag.exp,.tag.late{background:#fee2e2;color:#991b1b!important}
.tag.wait{background:#fef9c3;color:#854d0e}.tag.rej{background:#e5e7eb;color:#374151}.tag.ctr{background:#dbeafe;color:#1e40af}
/* --- شيت التقرير --- */
#rv{position:fixed;inset:0;z-index:40;background:#0f172ad9;display:none;flex-direction:column}
#rv.on{display:flex}
.rvbar{display:flex;gap:6px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
.rvbar b{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rvbody{flex:1;overflow:auto;padding:12px 8px calc(env(safe-area-inset-bottom) + 16px)}
.paper{--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--soft:#eef2f7;--soft2:#f8fafc;--inc:#15803d;--exp:#b91c1c;background:#fff;color:#1f2937;max-width:820px;margin:auto;border-radius:14px;overflow:hidden;box-shadow:0 8px 28px #0004;font-size:13px;padding-bottom:2px}
.ph{background:var(--p);background-image:linear-gradient(135deg,#ffffff1f,#00000040);color:#fff;padding:16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ph-app{font-size:12px;opacity:.85}.ph-t{font-size:19px;font-weight:800;margin:2px 0}.ph-s{font-size:12px;opacity:.92}
.ph-d{font-size:11px;text-align:left;opacity:.9;white-space:nowrap}.ph-d b{font-size:13px}
.paper>.kpis,.paper>.sec,.paper>.ptbl,.paper>.pchart,.paper>.pnote{margin-left:14px;margin-right:14px}
.paper>.kpis{margin-top:14px}
.sec{margin-top:18px;margin-bottom:8px;font-weight:800;font-size:14px;padding-right:10px;border-right:4px solid var(--p)}
.pchart{margin-top:6px}
.pf{margin-top:18px;padding:10px 14px;background:#f8fafc;border-top:1px solid #e5e7eb;text-align:center;font-size:11px;color:#6b7280;line-height:1.8}
#printArea{display:none}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
#lock.on{display:flex}
.lk{width:100%;max-width:340px;text-align:center}.lkic{font-size:44px}.lk h2{margin:6px 0 14px}
.lk input{text-align:center;font-size:22px;letter-spacing:6px}
.lkf{background:none;border:0;color:var(--mu);margin-top:14px;font:inherit;font-size:12px;text-decoration:underline}
#viewer{position:fixed;inset:0;z-index:46;background:#000e;display:none;flex-direction:column}
#viewer.on{display:flex}
.vtop{display:flex;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;color:#fff}
.vtop b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbody{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:8px}
.vbody img{max-width:100%;max-height:100%;object-fit:contain}.vic{font-size:80px}
.vbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(env(safe-area-inset-bottom) + 12px)}
#sheet{position:fixed;inset:0;z-index:42;visibility:hidden}#sheet.open{visibility:visible}
#sheet .bk{position:absolute;inset:0;background:#0007;opacity:0;transition:opacity .2s}#sheet.open .bk{opacity:1}
#sheet .body{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .25s}
#sheet.open .body{transform:none}#sheet h2{margin:2px 0 8px;font-size:16px}
#toast{position:fixed;bottom:96px;left:50%;transform:translate(-50%,20px);background:#111827;color:#fff;padding:9px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-size:13px;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media print{
  body.printing>*:not(#printArea){display:none!important}
  body.printing #printArea{display:block}
  body.printing{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing .paper{box-shadow:none;border-radius:0;max-width:none}
  body.printing .ptbl{overflow:visible}body.printing th,body.printing td{white-space:normal}
}
</style>
</head>
<body>
<header><h1 id="appn">Fawzy Folio</h1><div class="hr"><span id="hd"></span><button id="bell" onclick="openNotifs()" aria-label="التنبيهات">🔔<b></b></button></div></header>
<main id="view"></main>
<nav></nav>
<div id="rv"><div class="rvbar"><button class="mini" onclick="closeRV()">✕</button><button class="mini" id="rvback" onclick="rvBack()">→ رجوع</button><b id="rvt"></b><button class="mini" onclick="printReport()">🖨️ PDF</button><button class="mini" onclick="shareReport()">📤</button><button class="mini" id="rvcsv" onclick="exportCSV()">📊</button></div><div id="rvbody"><div id="rvdoc" class="paper"></div></div></div>
<div id="sheet"><div class="bk" onclick="closeSheet()"></div><div class="body"></div></div>
<div id="viewer"></div>
<div id="lock"><div class="lk"><div class="lkic">🔒</div><h2 id="lkname"></h2>
<input id="lkpin" type="password" inputmode="numeric" autocomplete="off" placeholder="الرقم السري" onkeydown="if(event.key==='Enter')tryPin()">
<button class="btn" onclick="tryPin()">دخول</button>
<button class="btn ghost" id="lkbio" onclick="bioUnlock()">👆 الدخول بالبصمة</button>
<button class="lkf" onclick="forgotPin()">نسيت الرقم السري؟</button>
<div id="lkbrand"></div></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<input type="file" id="restoreFile" accept=".json,application/json" onchange="restore(this)">

<script>
/* ========== الإصدار والمطور ========== */

function migrate(d){
  const now=new Date(),nk=ym(now.getFullYear(),now.getMonth()+1);
  if((d.version||1)<3){
    d.annual=d.annual||[];
    (d.cats||[]).filter(c=>c.kind==='inc'&&c.freq==='yearly').forEach(c=>{
      const used=(d.txs||[]).some(t=>t.cat===c.id),plan=c.plan||{};
      if(used||Object.keys(plan).length||c.name!=='أرباح سنوية')d.annual.push({id:uid(),name:c.name,due:pad(c.dueMonth||1)+'-01',note:'',active:c.active!==false,amounts:{...plan},st:{}});
      if(!used)d.cats=d.cats.filter(x=>x!==c);
    });
  }
  if((d.version||1)<4){
    d.recur=d.recur||[];
    (d.monthly||[]).forEach(i=>{
      const sk=i.start||nk;
      const r={id:i.id,name:i.name,kind:'fixed',amount:+i.amount||0,every:1,start:sk+'-'+pad(Math.min(+i.day||1,28)),pct:0,note:i.note||'',active:i.active!==false,amt:{},st:{}};
      Object.entries(d.mst||{}).forEach(([key,recs])=>{const rec=(recs||{})[i.id];if(!rec)return;const k=mdiff(sk,key);if(k>=0)r.st[k]=rec});
      d.recur.push(r);
    });
    (d.annual||[]).forEach(a=>{
      const am=a.amounts||{},years=Object.keys(am).concat(Object.keys(a.st||{})).map(Number).filter(Boolean);
      const y0=years.length?Math.min(...years):now.getFullYear();
      const r={id:a.id,name:a.name,kind:'contract',amount:+am[y0]||0,every:12,start:`${y0}-${a.due||'01-01'}`,pct:0,note:a.note||'',active:a.active!==false,amt:{},st:{}};
      Object.entries(am).forEach(([y,v])=>{r.amt[+y-y0]=+v});
      Object.entries(a.st||{}).forEach(([y,rec])=>{r.st[+y-y0]=rec});
      Object.keys(am).map(Number).forEach(y=>{if(y<now.getFullYear()&&!r.st[y-y0])r.st[y-y0]={st:'old'}});
      const ys=Object.keys(am).map(Number).sort();
      if(ys.length>=2){const v0=+am[ys[ys.length-2]],v1=+am[ys[ys.length-1]];if(v0>0)r.pct=r2((v1/v0-1)*100)}
      d.recur.push(r);
    });
    delete d.monthly;delete d.mst;delete d.annual;delete d.expected;
  }
  d.version=4;return d;
}
function normalize(d){
  d.methods=d.methods||[];d.cats=d.cats||[];d.closed=d.closed||{};
  d.txs=(d.txs||[]).map(t=>({...t,amount:+t.amount||0}));
  migrate(d);
  d.recur=(d.recur||[]).map(r=>({amt:{},st:{},every:1,pct:0,...r}));
  d.docs=(d.docs||[]).map(x=>({files:[],...x}));d.plans=(d.plans||[]).map(p=>({files:[],items:[],...p}));d.fmeta=d.fmeta||{};
  d.settings=Object.assign({lead:10,appName:DEF_NAME,theme:'teal',labels:{},home:{}},d.settings||{});
  if(!d.settings.appName||d.settings.appName==='مصروفي')d.settings.appName=DEF_NAME;
  return d;
}

function occK(r,key){if(!r.start)return -1;const d=mdiff(r.start.slice(0,7),key);if(d<0||d%(+r.every||1))return -1;return d/(+r.every||1)}
const occDate=(r,k)=>addMonths(r.start,k*(+r.every||1));
const occRec=(r,k)=>(r.st||{})[k];
function occActual(r,k){const s=stOf(occRec(r,k));return s.st==='done'?s.t.amount:null}
function occAmt(r,k){
  if(r.amt&&r.amt[k]!=null)return +r.amt[k];
  if(r.kind!=='contract'||!+r.pct||k===0)return +r.amount||0;
  const prev=occActual(r,k-1);return Math.round((prev!=null?prev:occAmt(r,k-1))*(1+r.pct/100));
}
function dueList(key,kind){
  return S.recur.filter(r=>!kind||(kind==='contract'?r.kind==='contract':r.kind!=='contract')).map(r=>{const k=occK(r,key);if(k<0)return null;if(r.active===false&&!occRec(r,k))return null;const date=occDate(r,k);return{r,k,date,amt:occAmt(r,k),s:stOf(occRec(r,k))}})
    .filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
}

const FDB={
  db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('masrofi-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files',mode);const q=fn(t.objectStore('files'));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error)})},
  put(o){return this.run('readwrite',s=>s.put(o))},
  get(id){return this.run('readonly',s=>s.get(id))},
  del(id){return this.run('readwrite',s=>s.delete(id))},
  keys(){return this.run('readonly',s=>s.getAllKeys())}
};

async function fileURL(id){if(URLS[id])return URLS[id];const r=await FDB.get(id);if(!r)return null;return URLS[id]=URL.createObjectURL(r.blob)}

async function compressImg(f){
  try{
    const url=URL.createObjectURL(f);const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
    const sc=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));return b&&b.size<f.size?b:f;
  }catch(e){return f}
}
async function addFiles(list){
  const ids=[];
  for(const f of list){
    let blob=f,name=f.name||'file',type=f.type||'';
    if(type.startsWith('image/')&&type!=='image/gif'){const c=await compressImg(f);if(c!==f){blob=c;type='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg'}}
    const id=uid();await FDB.put({id,blob,name,type});S.fmeta[id]={name,type,size:blob.size,at:Date.now()};ids.push(id);
  }
  save();return ids;
}

async function gcFiles(){

    const ref=new Set();
    S.txs.forEach(t=>(t.files||[]).forEach(i=>ref.add(i)));S.docs.forEach(d=>d.files.forEach(i=>ref.add(i)));S.plans.forEach(p=>(p.files||[]).forEach(i=>ref.add(i)));

    Object.keys(S.fmeta).forEach(id=>{if(!ref.has(id))delete S.fmeta[id]});save();
  }catch(e){}

function niceMax(m){const p=Math.pow(10,Math.floor(Math.log10(m)));return Math.ceil(m/p*2)/2*p}
function svgChart(labels,series,type,o={}){
  const W=640,H=280,pl=52,pr=12,pt=30,pb=38,n=labels.length,id=o.id||'c';
  const max=Math.max(1,...series.flatMap(s=>s.values)),top=niceMax(max),cw=(W-pl-pr)/n,ih=H-pt-pb,base=H-pb;
  const y=v=>pt+ih*(1-v/top),xc=i=>pl+cw*(n-1-i)+cw/2,showV=n*series.length<=14;
  let defs='',g='';
  series.forEach((s,si)=>defs+=`<linearGradient id="${id}g${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="1"/><stop offset="1" stop-color="${s.color}" stop-opacity=".6"/></linearGradient>`);
  if(o.hi!=null&&o.hi>=0)g+=`<rect x="${xc(o.hi)-cw/2+3}" y="${pt-22}" width="${cw-6}" height="${ih+22}" rx="10" fill="#94a3b8" fill-opacity=".13"/>`;
  for(let i=0;i<=4;i++){const v=top*i/4,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#94a3b8" stroke-opacity="${i?.25:.55}" ${i?'stroke-dasharray="4 5"':''}/><text x="${pl-8}" y="${yy+4}" font-size="12" text-anchor="end" fill="#94a3b8">${short(v)}</text>`}
  const gap=Math.min(6,cw*.06),bw=Math.min(34,(cw*.76-gap*(series.length-1))/series.length),tw=bw*series.length+gap*(series.length-1);
  series.forEach((s,si)=>s.values.forEach((v,i)=>{
    const bx=xc(i)-tw/2+si*(bw+gap),hh=v?Math.max(3,base-y(v)):0;
    if(hh)g+=`<rect x="${bx}" y="${base-hh}" width="${bw}" height="${hh}" rx="${Math.min(7,bw/2)}" fill="url(#${id}g${si})"/>`;
    if(showV&&v)g+=`<text x="${bx+bw/2}" y="${base-hh-6}" font-size="${series.length>1?11:12}" font-weight="700" text-anchor="middle" fill="${s.color}">${short(v)}</text>`;
  }));
  labels.forEach((l,i)=>g+=`<text x="${xc(i)}" y="${H-12}" font-size="12" text-anchor="middle" fill="${i===o.hi?'currentColor':'#94a3b8'}" font-weight="${i===o.hi?700:400}">${esc(l)}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" class="svgc"><defs>${defs}</defs>${g}</svg>`;
}

function donut(items){

function alerts(){
  const out=[],td=today(),lead=+S.settings.lead||10;
  S.recur.filter(r=>r.active!==false&&r.start).forEach(r=>{
    for(let k=0;k<1000;k++){
      const d=occDate(r,k),left=daysBetween(d,td);
      if(left>lead)break;
      if(left<-62)continue;
      if(stOf(occRec(r,k)).st!=='wait')continue;
      const amt=occAmt(r,k);
      if(r.kind==='contract'){
        const last=lastDone(r);
        const title=left<0?`⚠️ تحصيل ${r.name} متأخر ${-left} يوم`:left===0?`📅 النهارده ميعاد تحصيل ${r.name}`:`⏰ تحصيل ${r.name} ميعاده قرب، باقي ${left} يوم`;
        out.push({id:`c-${r.id}-${k}`,title,body:`الميعاد ${fdate(d)} · المبلغ ${fmt(amt)}${r.pct?` (زيادة ${r.pct}%)`:''}${last?` · المرة اللي فاتت ${fmt(last.amount)} في ${fdate(last.date)}`:''}${r.note?' · '+r.note:''}`,go:`cur.y=${+d.slice(0,4)};go('annual')`});
      }else if(left<=0){
        out.push({id:`f-${r.id}-${k}`,title:`💼 ${r.name}: لم يتم تحصيله إلى الآن`,body:`${mName(d.slice(0,7))} · المتوقع ${fmt(amt)}${r.note?' · '+r.note:''}`,go:`gocol('${d.slice(0,7)}')`});
      }
    }
  });
  S.plans.forEach(p=>{
    const un=p.items.filter(it=>!itTx(it)&&it.due).sort((a,b)=>a.due.localeCompare(b.due));if(!un.length)return;
    const late=un.filter(it=>it.due<td),nx=un[0],left=daysBetween(nx.due,td),go=`instPlan='${p.id}';go('plan')`;
    if(late.length)out.push({id:`i-${p.id}-late-${late.length}`,title:`⚠️ ${p.name}: ${late.length} قسط متأخر`,body:`أقدم قسط ${fdate(late[0].due)} · ${fmt(+late[0].amount||0)}`,go});
    else if(left<=lead)out.push({id:`i-${p.id}-${nx.id}`,title:left?`💳 قسط ${p.name} باقي عليه ${left} يوم`:`💳 النهارده ميعاد قسط ${p.name}`,body:`${fdate(nx.due)} · ${fmt(+nx.amount||0)}`,go});
  });
  const lb=localStorage.getItem(BKEY);
  if(S.txs.length&&(!lb||(Date.now()-new Date(lb))/864e5>30))out.push({id:'backup',title:'💾 وقت النسخة الاحتياطية',body:lb?'آخر نسخة من أكتر من شهر':'لسه معملتش نسخة احتياطية',go:`stab='data';go('settings')`});
  return out;
}

async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('masrofi:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of 'masrofi:'+s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}
}

    const dl=dueList(NKM,'fixed');let te=0,tg=0;dl.forEach(o=>{te+=o.amt;if(o.s.st==='done')tg+=o.s.t.amount});
    tiles+=`<div class="tile" onclick="gocol('${NKM}')"><small>${esc(L('fixed'))} · ${mn}</small><b>${num(tg)} / ${num(te)}</b><div class="prog"><i style="width:${te?Math.min(100,tg/te*100):0}%"></i></div><small>${dl.filter(o=>o.s.st==='wait').length} بند لسه</small></div>`;
  }
  if(hs('contracts')){
    let nx=null;S.recur.filter(r=>r.kind==='contract'&&r.active!==false).forEach(r=>{const k=nextOcc(r),d=occDate(r,k);if(!nx||d<nx.d)nx={r,d,a:occAmt(r,k)}});
    tiles+=`<div class="tile" onclick="cur.y=NY;go('annual')"><small>${esc(L('contracts'))} · الجاي</small>${nx?`<b>${fmt(nx.a)}</b><small>${esc(nx.r.name)} · ${fdate(nx.d)}</small>`:'<b>—</b>'}</div>`;
  }
  if(hs('inst')){
    const nx=nextInst();
    tiles+=`<div class="tile" onclick="go('inst')"><small>${esc(L('inst'))} · القسط الجاي</small>${nx?`<b>${fmt(+nx.it.amount||0)}</b><small>${esc(nx.p.name)} · ${fdate(nx.it.due)}</small>`:'<b>—</b>'}</div>`;
  }
  if(hs('alerts')){const al=alerts().length;tiles+=`<div class="tile" onclick="openNotifs()"><small>🔔 التنبيهات</small><b class="${al?'neg':'pos'}">${al||'✓'}</b></div>`}
  if(tiles)h+=`<div class="dash">${tiles}</div>`;
  if(hs('recent'))h+='<h3>آخر العمليات</h3>'+opsTable(keyTx(NKM).sort(byDesc).slice(0,8));
  return h;
}

/* ========== التحصيلات ========== */
function ckRow(o){
  const done=o.s.st==='done',old=o.s.st==='old',late=!done&&!old&&o.date<today();
  const sub=done?`اتحصّل ${dmy(o.s.t.date)} · ${esc(M(o.s.t.method)?.name||'')}`:old?'مسجّل سابقاً':`ميعاده ${fdate(o.date)}${o.r.every>1&&o.r.kind!=='contract'?' · '+everyTxt(o.r.every):''}`;
  return `<div class="ck ${done?'done':''}"><input type="checkbox" ${done||old?'checked':''} ${old?'disabled':''} onchange="recToggle('${o.r.id}',${o.k},this)">
    <div class="grow" onclick="occSheet('${o.r.id}',${o.k})"><b>${esc(o.r.name)}</b><small>${sub}${o.r.note?' · '+esc(o.r.note):''}</small></div>
    <div class="amt ${done?'inc':''}">${num(done?o.s.t.amount:o.amt)}<small class="${late?'neg':'muted'}">${done?'✓ اتحصّل':late?'متأخر':old?'':'منتظر'}</small></div></div>`;
}
function vCol(){
  const key=ym(cur.y,cur.m),dl=dueList(key,'fixed'),linked=new Set(dl.filter(o=>o.s.st==='done').map(o=>o.s.t.id));
  const others=keyTx(key).filter(t=>t.type==='inc'&&!linked.has(t.id)).sort(byDesc);
  let exp=0,rem=0;dl.forEach(o=>{exp+=o.amt;if(o.s.st==='wait')rem+=o.amt});
  let h=`<div class="phead"><h3>💰 ${esc(L('inc'))}</h3><button class="mini" onclick="cur.y=${cur.y};go('annual')">📆 السنوية</button><button class="mini" onclick="itab='fixed';go('items')">⚙️ ${esc(L('fixed'))}</button></div>`
    +monthBar()+kpis([['اتحصّل الشهر ده',fmt(sums(keyTx(key)).inc),'inc'],['متوقع من البنود الثابتة',fmt(exp),'net'],['باقي',fmt(rem),'exp']])
    +`<div class="etbar"><button class="mini pri" onclick="newTx('inc')">+ تحصيل جديد</button><button class="mini" onclick="openFlow('inc',cur.y,cur.m)">🧾 كشف حساب</button><button class="mini" onclick="RF.ccat='ALL_INC';rtab='cmp';go('reports')">📈 مقارنة</button></div>`;
  const rows=dl.map(ckRow).concat(others.map(t=>`<div class="ck done"><span class="cki">✓</span><div class="grow" onclick="editTx('${t.id}')"><b>${esc(C(t.cat)?.name||'—')}</b>${isAnnualTx(t)?' <span class="tag ctr">سنوي</span>':''}<small>${dmy(t.date)} · ${esc(M(t.method)?.name||'')}${t.note?' · '+esc(t.note):''}</small></div><div class="amt inc">${num(t.amount)}<small class="muted">${(t.files||[]).length?'📎 ':''}✓ اتحصّل</small></div></div>`));
  return h+(rows.length?`<div class="list">${rows.join('')}</div>`:'<p class="empty">لا يوجد تحصيلات الشهر ده</p>');
}
function vAnnual(){
  const y=cur.y,occ=[];
  S.recur.filter(r=>r.kind==='contract'&&r.start).forEach(r=>{
    for(let k=0;k<300;k++){const d=occDate(r,k),yy=+d.slice(0,4);if(yy>y)break;if(yy<y)continue;const s=stOf(occRec(r,k));if(r.active===false&&s.st==='wait')continue;occ.push({r,k,date:d,amt:occAmt(r,k),s})}
  });
  occ.sort((a,b)=>a.date.localeCompare(b.date));
  let exp=0,got=0,rem=0;occ.forEach(o=>{exp+=o.amt;if(o.s.st==='done')got+=o.s.t.amount;else if(o.s.st==='wait')rem+=o.amt});
  let h=`<div class="phead"><button class="mini" onclick="go('col')">→</button><h3>📆 ${esc(L('contracts'))}</h3><button class="mini" onclick="rtab='contracts';go('reports');openRV()">📄 تقرير</button><button class="mini pri" onclick="recForm(null,'contract')">+ إضافة</button></div>`
    +yearBar()+kpis([['المتوقع',fmt(exp),'net'],['اتحصّل',fmt(got),'inc'],['باقي',fmt(rem),'exp']]);
  if(!occ.length)return h+'<p class="empty">لا يوجد تحصيلات سنوية في السنة دي</p>';
  return h+`<div class="list">${occ.map(o=>{
    const done=o.s.st==='done',old=o.s.st==='old',late=!done&&!old&&o.date<today();
    return `<div class="ck ${done?'done':''}"><input type="checkbox" ${done||old?'checked':''} ${old?'disabled':''} onchange="recToggle('${o.r.id}',${o.k},this)">
      <div class="grow" onclick="occSheet('${o.r.id}',${o.k})"><b>${esc(o.r.name)}</b><small>${MONTHS[+o.date.slice(5,7)-1]} · ${dmy(o.date)} · ${everyTxt(o.r.every)}${o.r.pct?' · زيادة '+o.r.pct+'%':''}${done?' · اتحصّل '+dmy(o.s.t.date):''}</small>${o.r.note?`<small>📝 ${esc(o.r.note)}</small>`:''}</div>
      <div class="amt ${done?'inc':''}">${num(done?o.s.t.amount:o.amt)}<small class="${late?'neg':'muted'}">${done?'✓ اتحصّل':late?'متأخر':old?'سابق':'منتظر'}</small><button class="mini" style="margin-top:4px" onclick="contractSheet('${o.r.id}')">⚙️</button></div></div>`}).join('')}</div>`;
}
function contractSheet(id){
  const r=R(id),nk=nextOcc(r);let rows=[];
  for(let k=0;k<=nk+1;k++){const s=stOf(occRec(r,k)),d=occDate(r,k);rows.push(`<tr class="${s.st==='done'?'clk':''}" ${s.st==='done'?`onclick="editTx('${s.t.id}')"`:''}><td>${k+1}</td><td>${dmy(d)}</td><td>${num(occAmt(r,k))}</td><td>${s.st==='done'?`<b class="inc">${num(s.t.amount)}</b>`:'—'}</td><td>${stTag(s,d)}</td></tr>`)}

  ${tbl(['#','الميعاد','المتوقع','اتحصّل','الحالة'],rows)}
  <div class="two"><button class="btn" onclick="occSheet('${id}',${nk})">✓ تحصيل المرة الجاية</button><button class="btn ghost" onclick="occSetAmt('${id}',${nk})">✏️ مبلغ المرة الجاية</button></div>`);
}
function occSheet(id,k){
  const r=R(id),s=stOf(occRec(r,k));if(s.st==='done')return editTx(s.t.id);if(s.st==='old')return;
  const date=occDate(r,k),prev=k>0?occActual(r,k-1):null,meths=S.methods.filter(m=>m.active);
  sheet(`<h2>${esc(r.name)}</h2><p class="muted">ميعاده ${fdate(date)} · ${everyTxt(r.every)}${r.kind==='contract'&&r.pct?` · زيادة ${r.pct}%`:''}${prev!=null?` · المرة اللي فاتت ${fmt(prev)}`:''}</p>
  <label>المبلغ اللي اتحصّل<input id="k-amt" class="amt-in" type="text" inputmode="decimal" value="${occAmt(r,k)||''}" placeholder="0"></label>
  <label>استلمت على<select id="k-m">${opt(meths,defMethod())}</select></label>
  <div class="two"><label>تاريخ التحصيل<input id="k-d" type="date" value="${defCollectDate(date)}"></label><label>ملاحظة<input id="k-n" type="text"></label></div>
  <button class="btn" onclick="occCollect('${id}',${k})">✓ تم التحصيل</button>
  <div class="two"><button class="btn ghost" onclick="occSetAmt('${id}',${k})">✏️ المبلغ المتوقع</button><button class="btn ghost" onclick="recForm('${id}')">⚙️ البند</button></div>`);
}
function occCollect(id,k,quick){
  const r=R(id);let amount,method,date,note='';
  if(quick){
    amount=occAmt(r,k);
    if(!(amount>0)){const v=parseNum(prompt('المبلغ اللي اتحصّل',''));if(!(v>0))return false;amount=v}
    method=defMethod();date=defCollectDate(occDate(r,k));
  }else{
    amount=parseNum($('#k-amt').value);method=$('#k-m').value;date=$('#k-d').value;note=$('#k-n').value.trim();
    if(!(amount>0)){toast('اكتب مبلغ صحيح');return false}
  }
  if(!method){toast('ضيف طريقة دفع الأول');return false}
  if(!date){toast('اختار التاريخ');return false}
  if(isClosed(date)){toast(`شهر ${mName(date.slice(0,7))} مقفول`);return false}
  const cat=ensureCat(r.name,'inc');
  const t={id:uid(),type:'inc',amount,cat:cat.id,method,date,note,files:[],created:Date.now(),src:{k:'r',id,p:k}};
  S.txs.push(t);r.st=r.st||{};r.st[k]={st:'done',txId:t.id,at:Date.now()};
  save();closeSheet();render();toast('اتسجّل التحصيل ✓');return true;
}
function recToggle(id,k,el){
  const r=R(id),s=stOf(occRec(r,k));
  if(s.st==='done'){
    el.checked=true;
    if(isClosed(s.t.date))return toast('الشهر مقفول');
    if(!confirm('تلغي التحصيل ده؟ هيتمسح من التحصيلات'))return;
    S.txs=S.txs.filter(t=>t.id!==s.t.id);delete r.st[k];save();render();toast('اتلغى');return;
  }
  if(occCollect(id,k,true)!==true)el.checked=false;
}
function occSetAmt(id,k){
  const r=R(id),v=parseNum(prompt('المبلغ المتوقع للمرة دي',occAmt(r,k)));if(isNaN(v))return;
  r.amt=r.amt||{};r.amt[k]=v;save();closeSheet();render();toast('اتحفظ ✓');
}

  const locked=id&&Object.keys(r.st||{}).length>0,isC=r.kind==='contract';

  <div class="two"><label><span id="r-amtl">${isC?'المبلغ':'القيمة المتوقعة'}</span><input id="r-amt" type="text" inputmode="decimal" value="${r.amount||''}"></label>
  <label>التكرار<select id="r-every" ${locked?'disabled':''}>${EVERY.map(([v,l])=>`<option value="${v}" ${+r.every===v?'selected':''}>${l}</option>`).join('')}${EVERY.some(x=>x[0]===+r.every)?'':`<option value="${r.every}" selected>كل ${r.every} شهر</option>`}</select></label></div>
  <label><span id="r-startl">${isC?'ميعاد الدفع':'تاريخ أول تحصيل'}</span><input id="r-start" type="date" value="${r.start||today()}" ${locked?'disabled':''}></label>
  <div id="r-pctb" style="${isC?'':'display:none'}"><label>نسبة الزيادة كل مرة %<input id="r-pct" type="text" inputmode="decimal" value="${r.pct||''}"></label></div>
  <label>ملاحظات<input id="r-note" value="${esc(r.note||'')}"></label>
  <label class="chk"><input type="checkbox" id="r-act" ${r.active!==false?'checked':''}> مفعّل</label>
  ${locked?'<p class="muted" style="font-size:12px">التكرار والتاريخ مقفولين لأن البند عليه تحصيلات.</p>':''}
  <button class="btn" onclick="recSave('${id||''}')">حفظ</button>`);
}
function recKind(btn,k){
  const c=k==='contract';
  $('#r-kind').value=k;btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));
  $('#r-pctb').style.display=c?'':'none';
  $('#r-amtl').textContent=c?'المبلغ':'القيمة المتوقعة';
  $('#r-namel').textContent=c?'العميل / الخدمة':'اسم البند';
  $('#r-startl').textContent=c?'ميعاد الدفع':'تاريخ أول تحصيل';
  $('#r-name').placeholder=c?'مثلاً: فلان - تجديد VPN':'مثلاً: الراتب';
  if(!$('#r-every').disabled)$('#r-every').value=c?'12':'1';
}
function recSave(id){
  const name=$('#r-name').value.trim();if(!name)return toast('اكتب الاسم');
  const start=$('#r-start').value;if(!start)return toast('اختار التاريخ');
  let r=id?R(id):null;if(!r){r={id:uid(),amt:{},st:{}};S.recur.push(r)}
  const kind=$('#r-kind').value;
  Object.assign(r,{name,kind,amount:parseNum($('#r-amt').value)||0,note:$('#r-note').value.trim(),active:$('#r-act').checked,pct:kind==='contract'?(parseNum($('#r-pct').value)||0):0});
  if(!$('#r-every').disabled){r.every=+$('#r-every').value||1;r.start=start}
  fin();
}

/* ========== الأقساط ========== */
function vInst(){
  let h=`<div class="phead"><h3>🏦 ${esc(L('inst'))}</h3><button class="mini" onclick="rtab='inst';RF.plan='';go('reports');openRV()">📄 تقرير</button><button class="mini pri" onclick="planNew()">+ جديد</button></div>`;

    const st=planStats(p);
    const badge=st.late?`<span class="badge late">${st.late} متأخر</span>`:st.next?'<span class="badge wait">منتظر</span>':'<span class="badge done">خلصت ✓</span>';
    return `<div class="pcard" onclick="instPlan='${p.id}';go('plan')"><div class="rowin"><b>${esc(p.name)}</b>${badge}</div>

    ${st.next?`<small>القسط الجاي: ${fdate(st.next.due)} · ${fmt(+st.next.amount||0)}</small>`:''}</div>`;
  }).join('');
}
function vPlan(){
  const p=plan(instPlan);if(!p){view='inst';return vInst()}
  const st=planStats(p);
  let h=`<div class="phead"><button class="mini" onclick="go('inst')">→</button><h3>${esc(p.name)}</h3><button class="mini" onclick="RF.plan='${p.id}';rtab='inst';go('reports');openRV()">📄</button><button class="mini" onclick="planEdit('${p.id}')">✏️ تعديل</button></div>`;
  h+=kpis([['الإجمالي',fmt(st.total),'net'],['المدفوع',fmt(st.paid),'inc'],['الباقي',fmt(st.total-st.paid),'exp']]);
  if(p.note)h+=`<p class="muted">📝 ${esc(p.note)}</p>`;
  if(p.files.length)h+=`<div class="files">${p.files.map(id=>fileThumb(id,'view')).join('')}</div>`;
  const items=[...p.items].sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  h+=tbl(['#','الميعاد','المبلغ','الحالة',''],items.map((it,i)=>{
    const t=itTx(it);
    return `<tr><td>${i+1}</td><td>${dmy(it.due)}</td><td><b>${num(+it.amount||0)}</b></td><td>${t?`<span class="tag ok">مدفوع ${fd(t.date)}</span>${(t.files||[]).length?' 📎':''}`:stTag({st:'wait'},it.due)}</td>
    <td>${t?`<button class="mini" onclick="editTx('${t.id}')">🧾</button> <button class="mini" onclick="unpay('${p.id}','${it.id}')">↩</button>`:`<button class="mini pri" onclick="payStart('${p.id}','${it.id}')">✓ دفع</button>`}</td></tr>`}));
  return h;
}

function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function parseSchedule(text){
  const t=text.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
  const out=[];
  t.split(/\n+/).forEach(line=>{
    let due=null,l=line,m=l.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
    if(m){due=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;l=l.replace(m[0],' ')}
    else if((m=l.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;due=`${y}-${pad(+m[2])}-${pad(+m[1])}`;l=l.replace(m[0],' ')}
    if(!due)return;
    const[,Mo,D]=due.split('-').map(Number);if(Mo<1||Mo>12||D<1||D>31)return;
    const nums=(l.match(/\d[\d,]*(\.\d+)?/g)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>x>=10);
    if(!nums.length)return;
    out.push({id:uid(),due,amount:String(Math.max(...nums))});
  });
  return out;
}
function ocrStart(){
  grabPF();
  pickFiles('img',async ids=>{
    if(!ids.length)return;
    PF.files=PF.files.concat(ids);planForm();
    const st=()=>$('#ocrst');
    try{
      st()&&(st().innerHTML='<p class="warn">⏳ جاري تجهيز القراءة...</p>');
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const w=await Tesseract.createWorker('ara+eng',1,{logger:m=>{if(m.status==='recognizing text'&&st())st().innerHTML=`<p class="warn">⏳ جاري قراءة الصورة ${Math.round(m.progress*100)}%</p>`}});
      let rows=[];for(const id of ids){const r=await FDB.get(id);const{data}=await w.recognize(r.blob);rows=rows.concat(parseSchedule(data.text))}
      await w.terminate();
      grabPF();PF.items=PF.items.concat(rows);planForm();
      toast(rows.length?`اتقرا ${rows.length} قسط ✓ راجعهم قبل الحفظ`:'ما قدرتش أقرا أقساط من الصورة');
    }catch(e){if(st())st().innerHTML='';toast('القراءة ما نفعتش، اتأكد من النت')}
  });
}

function bStmt(){
  const[from,to]=periodRange();
  const rows=S.txs.filter(t=>t.type!=='tr'&&t.date>=from&&t.date<=to&&(RF.type==='all'||t.type===RF.type)&&(!RF.cat||t.cat===RF.cat)&&(!RF.method||t.method===RF.method)).sort(byAsc);
  const s=sums(rows),wf=rows.filter(t=>(t.files||[]).length).length;

function bCmp(){
  let ks=[];
  if(RF.crange.startsWith('y:')){const y=+RF.crange.slice(2);for(let i=1;i<=12;i++)ks.push(ym(y,i))}
  else{const n=+RF.crange;for(let i=n-1;i>=0;i--){const d=new Date(NY,NM-1-i,1);ks.push(ym(d.getFullYear(),d.getMonth()+1))}}
  const cc=RF.ccat,kind=cc==='ALL_INC'?'inc':cc==='ALL_EXP'?'exp':(C(cc)?.kind||'exp');
  const name=cc==='ALL_EXP'?'كل '+L('exp'):cc==='ALL_INC'?'كل '+L('inc'):(C(cc)?.name||'—');
  const match=t=>cc==='ALL_EXP'?t.type==='exp':cc==='ALL_INC'?t.type==='inc':t.cat===cc;
  const vals=ks.map(k=>keyTx(k).filter(match).reduce((a,t)=>a+t.amount,0));
  const tot=vals.reduce((a,b)=>a+b,0),avg=tot/ks.length,mxv=Math.max(...vals);
  const mx=vals.indexOf(mxv),nz=vals.filter(v=>v>0),mn=nz.length?vals.indexOf(Math.min(...nz)):-1;
  const color=kind==='exp'?'#dc2626':'#16a34a',isAll=cc.startsWith('ALL_');
  let ups=0;
  const rows=ks.map((k,i)=>{
    const v=vals[i],pv=i?vals[i-1]:null,d=pv==null?null:v-pv,pc=pv?d/pv*100:null;
    let st='—';
    if(d!=null&&d!==0){const up=d>0;if(up)ups++;const bad=kind==='exp'?up:!up;st=`<span class="${bad?'exp':'inc'}"><b>${up?'🔺 زيادة':'🔻 نقص'}</b></span>`}
    const dc=d==null?'—':`<span class="${(kind==='exp'?d>0:d<0)?'exp':'inc'}">${d>0?'+':''}${num(d)}</span>`;
    const [f,t]=mRange(k);
    return `<tr class="clk ${i===mx&&v>0?'hl':''}" onclick="${dS(f,t,isAll?'':cc,kind)}"><td><b>${mName(k)}</b></td><td><b>${num(v)}</b></td><td>${dc}</td><td>${pc==null?'—':(pc>0?'+':'')+Math.round(pc)+'%'}</td><td>${st}</td><td>${pbar(mxv?v/mxv*100:0,color)}</td></tr>`;
  });
  let b=kpis([['الإجمالي',fmt(tot),kind],['المتوسط الشهري',fmt(avg),'net'],['أعلى شهر',vals[mx]?`${MONTHS[+ks[mx].slice(5)-1]} · ${num(vals[mx])}`:'—','warn'],['أقل شهر',mn>=0?`${MONTHS[+ks[mn].slice(5)-1]} · ${num(vals[mn])}`:'—'],['شهور زادت',ups]]);
  b+=sec('الرسم البياني')+`<div class="pchart">${svgChart(ks.map(k=>ks.length<=6?MONTHS[+k.slice(5)-1]:mShort(k)),[{name,color,values:vals}],'bars',{id:'rc',hi:mx})}</div>`;
  b+=sec('مقارنة شهر بشهر')+tbl(['الشهر','المبلغ','الفرق عن اللي قبله','التغيير','الحالة',''],rows,`<tr><td>الإجمالي</td><td>${num(tot)}</td><td colspan="4">المتوسط: ${num(avg)}</td></tr>`);
  return{title:'مقارنة: '+name,sub:`${mName(ks[0])} - ${mName(ks[ks.length-1])}`,body:b,
    csv:{head:['الشهر','المبلغ','الفرق','التغيير %'],rows:ks.map((k,i)=>{const pv=i?vals[i-1]:null;return[mName(k),vals[i],pv==null?'':vals[i]-pv,pv?Math.round((vals[i]-pv)/pv*100):'']})}};
}

}
function secTab(){
  let h='<h3>الرقم السري</h3><div class="list">';
  h+=LK.pin?`<div class="row" onclick="pinForm()"><div class="grow"><b>🔑 تغيير الرقم السري</b></div>${actBadge(true)}</div><div class="row" onclick="pinOffForm()"><div class="grow"><b class="neg">إلغاء الرقم السري</b></div></div>`
    :`<div class="row" onclick="pinForm()"><div class="grow"><b>🔒 تفعيل الرقم السري</b></div>${actBadge(false)}</div>`;
  h+='</div>';
  if(LK.pin){
    h+=`<h3>البصمة / Face ID</h3><div class="list">${LK.bio?`<div class="row"><div class="grow"><b>👆 البصمة</b></div>${actBadge(true)}<button class="mini danger" onclick="LK.bio=null;saveLK();render()">إلغاء</button></div>`:`<div class="row" onclick="bioEnable()"><div class="grow"><b>👆 تفعيل الدخول بالبصمة</b></div>${actBadge(false)}</div>`}</div>
    <h3>القفل التلقائي</h3><select onchange="LK.after=+this.value;saveLK();toast('اتحفظ ✓')">${[[0,'فوراً'],[1,'بعد دقيقة'],[5,'بعد 5 دقايق'],[15,'بعد ربع ساعة']].map(([v,l])=>`<option value="${v}" ${(LK.after??1)===v?'selected':''}>${l}</option>`).join('')}</select>
    <div class="etbar" style="margin-top:8px"><button class="mini" onclick="showLock()">🔒 اقفل دلوقتي</button></div>`;
  }
  return h;
}
function dataTab(){
  const lb=localStorage.getItem(BKEY);
  return `<h3>النسخ الاحتياطي <span class="muted" style="font-size:11px">${lb?'آخر نسخة: '+lb:''}</span></h3>
  <button class="btn" onclick="backup()">⬇️ تنزيل نسخة (مع المرفقات)</button>
  ${CAN_SHARE?'<button class="btn ghost" onclick="shareBackup()">📤 مشاركة نسخة</button>':''}
  <button class="btn ghost" onclick="$('#restoreFile').click()">⬆️ استرجاع نسخة</button>
  <h3>منطقة خطر</h3><button class="btn ghost danger" onclick="resetAll()">مسح كل البيانات</button>`;
}
function setName(){S.settings.appName=$('#s-name').value.trim()||DEF_NAME;save();applyName();render();toast('اتحفظ ✓')}
function setTheme(k){S.settings.theme=k;save();applyTheme();render()}
function setHome(k,v){S.settings.home=S.settings.home||{};S.settings.home[k]=v;save()}
function saveLabels(){
  const o={};document.querySelectorAll('[data-lk]').forEach(i=>{const v=i.value.trim();if(v&&v!==LDEF[i.dataset.lk])o[i.dataset.lk]=v});
  S.settings.labels=o;save();render();toast('اتحفظ ✓');
}
function resetLabels(){S.settings.labels={};save();render();toast('رجعت المسميات الأصلية')}

/* ========== الشيت والنماذج ========== */
function sheet(html){$('#sheet .body').innerHTML=html;$('#sheet').classList.add('open');hydrate()}
function closeSheet(){$('#sheet').classList.remove('open')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2300)}
function opt(arr,sel){return arr.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}</option>`).join('')}

/* --- عملية (مصروف / تحصيل) --- */
function newTx(type){
  const dm=defMethod();if(!dm)return toast('ضيف طريقة دفع الأول');
  F={id:null,type:type||'exp',amount:'',catName:'',method:dm,to:'',date:today(),note:'',files:[],created:0};
  txForm();
}
function editTx(id){const t=S.txs.find(x=>x.id===id);if(!t)return;F={...t,amount:String(t.amount),catName:C(t.cat)?.name||'',to:t.to||'',note:t.note||'',files:[...(t.files||[])]};txForm()}
function grab(){
  const v=s=>$(s)?$(s).value:null;
  if(v('#f-amt')!==null)F.amount=v('#f-amt');if(v('#f-d')!==null)F.date=v('#f-d');if(v('#f-n')!==null)F.note=v('#f-n');
  if(v('#f-m')!==null)F.method=v('#f-m');if(v('#f-to')!==null)F.to=v('#f-to');if(v('#f-cat')!==null)F.catName=v('#f-cat');
}
function txForm(){
  const orig=F.id&&S.txs.find(t=>t.id===F.id),locked=orig&&isClosed(orig.date);
  const cats=S.cats.filter(c=>c.kind===F.type&&c.active!==false);
  const meths=S.methods.filter(m=>m.active||m.id===F.method||m.id===F.to);
  const types=[['exp',L('expOne')],['inc',L('incOne')]].concat(F.type==='tr'?[['tr','تحويل']]:[]);
  sheet(`<h2>${F.id?'تفاصيل العملية':(F.type==='inc'?'تحصيل جديد':'مصروف جديد')}</h2>
  ${locked?'<p class="warn">🔒 الشهر ده مقفول</p>':''}
  ${orig&&isAnnualTx(orig)?'<p class="warn">📆 ده تحصيل سنوي، ولو مسحته هيرجع "منتظر" في جدول التحصيلات السنوية</p>':''}
  <div class="seg">${types.map(([k,l])=>`<button class="${F.type===k?'on '+k:''}" onclick="grab();F.type='${k}';txForm()">${esc(l)}</button>`).join('')}</div>
  <input id="f-amt" class="amt-in" type="text" inputmode="decimal" placeholder="0" value="${esc(F.amount)}">
  ${F.type==='tr'
    ?`<label>من<select id="f-m">${opt(meths,F.method)}</select></label><label>إلى<select id="f-to">${opt(meths,F.to)}</select></label>`
    :`<label>البند<input id="f-cat" list="catdl" autocomplete="off" value="${esc(F.catName||'')}" placeholder="${F.type==='exp'?'اكتب أو اختار، مثلاً: طازة':'اكتب أو اختار، مثلاً: مشروع كذا'}"></label>
      <datalist id="catdl">${cats.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
      <label>${F.type==='exp'?'دفعت بـ':'استلمت على'}<select id="f-m">${opt(meths,F.method)}</select></label>`}
  <div class="two"><label>التاريخ<input id="f-d" type="date" value="${F.date}"></label><label>ملاحظة<input id="f-n" type="text" value="${esc(F.note)}"></label></div>
  <div class="fl">المرفقات</div>${filesBox(F.files,'tx')}
  <button class="btn" onclick="saveTx()" ${locked?'disabled':''}>سجّل</button>
  ${F.id&&!locked?'<button class="btn ghost danger" onclick="delTx()">حذف العملية</button>':''}`);
}
function saveTx(){
  grab();const amount=parseNum(F.amount);
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!F.date)return toast('اختار التاريخ');
  if(isClosed(F.date))return toast(`شهر ${mName(F.date.slice(0,7))} مقفول`);
  if(!F.method)return toast('اختار طريقة الدفع');
  const t={id:F.id||uid(),type:F.type,amount,method:F.method,date:F.date,note:(F.note||'').trim(),files:F.files||[],created:F.created||Date.now()};
  if(F.type==='tr'){if(!F.to||F.to===F.method)return toast('اختار طريقتين مختلفتين');t.to=F.to}
  else{const n=(F.catName||'').trim();if(!n)return toast('اكتب اسم البند');const c=ensureCat(n,F.type);c.active=true;t.cat=c.id}
  if(F.src)t.src=F.src;
  const i=S.txs.findIndex(x=>x.id===t.id);if(i>=0)S.txs[i]=t;else S.txs.push(t);
  save();closeSheet();render();refreshRV();toast('اتسجّلت ✓');
}
function delTx(){
  if(!confirm('تمسح العملية دي؟'))return;
  S.txs=S.txs.filter(t=>t.id!==F.id);
  S.plans.forEach(p=>p.items.forEach(it=>{if(it.txId===F.id)it.txId=null}));
  save();closeSheet();render();refreshRV();toast('اتمسحت');
}

/* --- طريقة دفع --- */
function editMethod(id){
  const m=id?M(id):{name:'',type:'cash',bank:'',color:COLORS[1],active:true};
  const used=id&&S.txs.some(t=>t.method===id||t.to===id);
  sheet(`<h2>${id?'تعديل':'إضافة'} طريقة دفع</h2>
  <label>الاسم<input id="m-name" value="${esc(m.name)}"></label>
  <label>النوع<select id="m-type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${m.type===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>البنك / الجهة<input id="m-bank" value="${esc(m.bank)}"></label>
  <div class="fl">اللون</div>
  <div class="colors">${COLORS.map(c=>`<button type="button" class="sw ${c===m.color?'on':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('')}</div>
  <input type="hidden" id="m-color" value="${m.color}">
  ${id?`<label class="chk"><input type="checkbox" id="m-act" ${m.active?'checked':''}> مفعّلة</label>`:''}
  <button class="btn" onclick="saveMethod('${id||''}')">حفظ</button>
  ${id&&!used?`<button class="btn ghost danger" onclick="delMethod('${id}')">حذف</button>`:''}`);
}
function pickColor(el,c){document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#m-color').value=c}
function saveMethod(id){
  const name=$('#m-name').value.trim();if(!name)return toast('اكتب الاسم');
  const m=id?M(id):{id:uid(),active:true};
  Object.assign(m,{name,type:$('#m-type').value,bank:$('#m-bank').value.trim(),color:$('#m-color').value});
  if($('#m-act'))m.active=$('#m-act').checked;if(!id)S.methods.push(m);
  fin();
}
function delMethod(id){if(!confirm('تمسح طريقة الدفع دي؟'))return;S.methods=S.methods.filter(m=>m.id!==id);save();closeSheet();render()}

/* ========== قفل الشهر ========== */
function closeMonth(k){
  if(!confirm(`قفل ${mName(k)}؟`))return;
  const s=sums(keyTx(k));
  S.closed[k]={at:new Date().toISOString(),inc:s.inc,exp:s.exp};
  save();render();toast('اتقفل الشهر 🔒');
}
function openMonth(k){
  if(!confirm(`فتح ${mName(k)}؟`))return;
  delete S.closed[k];save();render();toast('اتفتح الشهر');
}

/* ========== النسخ الاحتياطي ========== */
const blob2b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function backupBlob(){
  toast('⏳ جاري تجهيز النسخة...');
  const files=[];
  for(const id of Object.keys(S.fmeta||{})){try{const r=await FDB.get(id);if(r)files.push({id,name:r.name,type:r.type,data:await blob2b64(r.blob)})}catch(e){}}
  return new Blob([JSON.stringify({app:'masrofi',appVersion:APP_VERSION,exported:new Date().toISOString(),data:S,files})],{type:'application/json'});
}
const backupName=()=>`fawzy-folio-backup-${today()}.json`;
function markBackup(){localStorage.setItem(BKEY,today());render()}
async function backup(){dlBlob(await backupBlob(),backupName());markBackup();toast('اتنزلت النسخة ✓')}
async function shareBackup(){
  try{const b=await backupBlob();await navigator.share({files:[new File([b],backupName(),{type:'application/json'})],title:appName()});markBackup()}catch(e){}
}
function restore(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{
    const root=JSON.parse(r.result),d=root.data||root,files=root.files||[];
    if(!Array.isArray(d.methods)||!Array.isArray(d.txs))throw 0;
    if(!confirm(`النسخة فيها ${d.txs.length} عملية و ${files.length} مرفق.\nهتستبدل البيانات الحالية. نكمل؟`))return;
    toast('⏳ جاري الاسترجاع...');
    for(const x of files){try{const b=await (await fetch(x.data)).blob();await FDB.put({id:x.id,blob:b,name:x.name,type:x.type})}catch(e){}}
    S=normalize(d);save();applyTheme();applyName();go('home');toast('اتسترجعت البيانات ✓');
  }catch(e){alert('الملف ده مش نسخة احتياطية صالحة')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('هتمسح كل العمليات والمرفقات والإعدادات من الجهاز ده. متأكد؟'))return;
  if(!confirm('آخر تأكيد: المسح مش هيترجع.'))return;
  S=normalize(defaults());save();gcFiles();applyTheme();applyName();go('home');toast('اتمسح كل شيء');
}

/* ========== تشغيل ========== */
$('#hd').textContent=NOW.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
applyTheme();applyName();save();render();gcFiles();
if(LK.pin){showLock();if(LK.bio)setTimeout(()=>bioUnlock(true),400)}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>setTimeout(pushAlerts,1500)).catch(()=>{}));
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(LK.pin&&hiddenAt&&(Date.now()-hiddenAt)/60000>=(LK.after??1))showLock();
  updateBell();pushAlerts();
});
</script>
