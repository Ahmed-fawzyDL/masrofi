<script>

const DEF_NAME='Fawzy Folio';

/* ========== ثوابت وأدوات ========== */
const KEY='masrofi-data-v1',BKEY='masrofi-lastbackup',NKEY='masrofi-notified',LKEY='masrofi-lock';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

const COLORS=['#16a34a','#0f766e','#0891b2','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#475569'];
const THEMES={teal:{n:'أخضر',p:'#0f766e'},blue:{n:'أزرق',p:'#1d4ed8'},purple:{n:'بنفسجي',p:'#6d28d9'},rose:{n:'وردي',p:'#be185d'},orange:{n:'برتقالي',p:'#c2410c'},slate:{n:'رمادي',p:'#334155'},dark:{n:'داكن',p:'#14b8a6',dark:true}};
const LDEF={home:'الرئيسية',col:'التحصيلات',exps:'المصروفات',reports:'التقارير',more:'المزيد',settings:'الإعدادات',exp:'المصروفات',inc:'التحصيلات',expOne:'مصروف',incOne:'تحصيل',net:'الناتج',cur:'الشهر الحالي',prev:'الشهر الماضي',monthly:'التحصيلات الشهرية',annual:'التحصيلات السنوية',expected:'التحصيلات المتوقعة',inst:'الأقساط',docs:'المرفقات',items:'تكويد البنود',pm:'طرق الدفع'};

const pad=n=>String(n).padStart(2,'0');
const ym=(y,m)=>y+'-'+pad(m);

const r2=n=>Math.round(n*100)/100;

const fd=d=>d.slice(8)+'/'+d.slice(5,7);

const fdate=d=>d?`${+d.slice(8)} ${MONTHS[+d.slice(5,7)-1]} ${d.slice(0,4)}`:'—';
const lastDay=key=>{const[y,m]=key.split('-').map(Number);return new Date(y,m,0).getDate()};

const daysBetween=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const addMonths=(d,k)=>{const[y,m,day]=d.split('-').map(Number);const t=new Date(y,m-1+k,1);const ld=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return ym(t.getFullYear(),t.getMonth()+1)+'-'+pad(Math.min(day,ld))};

  d.docs=(d.docs||[]).map(x=>({files:[],...x}));d.plans=(d.plans||[]).map(p=>({files:[],items:[],...p}));d.fmeta=d.fmeta||{};
  d.settings=Object.assign({lead:10,appName:DEF_NAME,theme:'teal',labels:{},home:{}},d.settings||{});
  if(!d.settings.appName||d.settings.appName==='مصروفي')d.settings.appName=DEF_NAME;
  if((d.version||1)<3){
    d.cats.filter(c=>c.kind==='inc'&&c.freq==='yearly').forEach(c=>{
      const used=d.txs.some(t=>t.cat===c.id),plan=c.plan||{};

async function compressImg(f){
  try{
    const url=URL.createObjectURL(f);const img=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url});
    const sc=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));return b&&b.size<f.size?b:f;
  }catch(e){return f}
}

function alerts(){
  const out=[],td=today(),lead=+S.settings.lead||10;
  S.monthly.filter(i=>i.active!==false).forEach(i=>{
    for(let k=2;k>=0;k--){
      const d=new Date(NY,NM-1-k,1),key=ym(d.getFullYear(),d.getMonth()+1);
      if(i.start&&key<i.start)continue;
      if(stOf(getRec('m',i.id,key)).st!=='wait')continue;
      if(td<mDue(i,key))continue;
      out.push({id:`m-${i.id}-${key}`,title:`💼 ${i.name}: لم يتم تحصيله إلى الآن`,body:`${mName(key)} · المتوقع ${fmt(+i.amount||0)}${i.note?' · '+i.note:''}`,go:`gocol('m','${key}')`});
    }
  });
  S.annual.filter(a=>a.active!==false&&a.due).forEach(a=>{
    [NY,NY+1].forEach(y=>{
      const due=`${y}-${a.due}`,left=daysBetween(due,td);
      if(left>lead||(y>NY&&left<0))return;
      if(stOf(getRec('a',a.id,y)).st!=='wait')return;
      const ex=annCur(a,y),li=annLastInfo(a,y);
      const title=left<0?`⚠️ تحصيل ${a.name} متأخر ${-left} يوم`:left===0?`📅 النهارده ميعاد تحصيل ${a.name}`:`⏰ تحصيل ${a.name} ميعاده قرب، باقي ${left} يوم`;
      out.push({id:`a-${a.id}-${y}`,title,body:`الميعاد ${fdate(due)} · المتوقع ${ex!=null?fmt(ex):'—'}${li?' · السنة اللي فاتت: '+li:''}${a.note?' · ملاحظة: '+a.note:''}`,go:`gocol('a',${y})`});
    });
  });
  S.expected.forEach(e=>{
    if(!e.date||stOf(e.rec).st!=='wait')return;
    const left=daysBetween(e.date,td);if(left>lead)return;
    out.push({id:`e-${e.id}`,title:left<0?`⚠️ تحصيل متوقع متأخر: ${e.name}`:`🔮 تحصيل متوقع قرب: ${e.name}`,body:`${fdate(e.date)}${left>=0?` (باقي ${left} يوم)`:''} · ${fmt(+e.amount||0)}${e.note?' · '+e.note:''}`,go:`gocol('e')`});
  });
  S.plans.forEach(p=>{
    const un=p.items.filter(it=>!itTx(it)&&it.due).sort((a,b)=>a.due.localeCompare(b.due));if(!un.length)return;
    const late=un.filter(it=>it.due<td),nx=un[0],left=daysBetween(nx.due,td),go=`instPlan='${p.id}';go('plan')`;
    if(late.length)out.push({id:`i-${p.id}-late-${late.length}`,title:`⚠️ ${p.name}: ${late.length} قسط متأخر`,body:`أقدم قسط ${fdate(late[0].due)} · ${fmt(+late[0].amount||0)}`,go});
    else if(left<=lead)out.push({id:`i-${p.id}-${nx.id}`,title:left?`💳 قسط ${p.name} باقي عليه ${left} يوم`:`💳 النهارده ميعاد قسط ${p.name}`,body:`${fdate(nx.due)} · ${fmt(+nx.amount||0)}`,go});
  });
  const lb=localStorage.getItem(BKEY);
  if(S.txs.length&&(!lb||(Date.now()-new Date(lb))/864e5>30))out.push({id:'backup',title:'💾 وقت النسخة الاحتياطية',body:lb?'آخر نسخة من أكتر من شهر':'لسه معملتش نسخة احتياطية',go:`stab='data';go('settings')`});
  return out;
}

/* ========== القفل: رقم سري + بصمة ========== */
async function hash(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('masrofi:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=0;for(const c of 'masrofi:'+s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}
}
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function showLock(){
  if(!LK.pin)return;closeSheet();closeViewer();
  $('#lkname').textContent=appName();$('#lkpin').value='';
  $('#lkbio').style.display=LK.bio?'':'none';$('#lkbrand').innerHTML=brand();
  $('#lock').classList.add('on');
}
function unlock(){$('#lock').classList.remove('on');pushAlerts()}
async function tryPin(){const v=$('#lkpin').value;if(!v)return;if(await hash(v)===LK.pin)unlock();else{$('#lkpin').value='';toast('الرقم السري غلط')}}
async function bioEnable(){
  try{
    if(!window.PublicKeyCredential||!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return toast('الجهاز ده مش بيدعم البصمة');
    const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:appName()},user:{id:rnd(16),name:'masrofi-user',displayName:appName()},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    LK.bio=b64(c.rawId);saveLK();render();toast('اتفعّلت البصمة ✓');
  }catch(e){toast('ما اتفعّلتش البصمة')}
}
async function bioUnlock(silent){
  if(!LK.bio)return;
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(LK.bio)}],userVerification:'required',timeout:60000}});unlock()}
  catch(e){if(silent!==true)toast('البصمة ما اتعرفتش')}
}
function forgotPin(){
  if(!confirm('هيتمسح كل البيانات من الجهاز ده ويتشال الرقم السري.\nلو عندك نسخة احتياطية تقدر ترجعها بعدين. متأكد؟'))return;
  if(!confirm('آخر تأكيد: المسح مش هيترجع.'))return;
  localStorage.removeItem(KEY);localStorage.removeItem(LKEY);try{indexedDB.deleteDatabase('masrofi-files')}catch(e){}location.reload();
}

const NAVOF={home:'home',col:'col',exps:'exps',inst:'inst',plan:'inst',reports:'reports'};
function navHTML(){
  const on=NAVOF[view]||'more';
  const b=(v,ic,l,click)=>`<button class="${on===v?'on':''}" onclick="${click||`go('${v}')`}"><span>${ic}</span>${esc(l)}</button>`;
  return b('home','🏠',L('home'))+b('col','💰',L('col'))+b('exps','💸',L('exps'))
    +`<button class="fab" onclick="newTx(view==='col'?'inc':'exp')" aria-label="+">+</button>`
    +b('inst','🏦',L('inst'))+b('reports','📊',L('reports'),"rtab='';go('reports')")+b('more','☰',L('more'));
}
function render(){
  $('nav').innerHTML=navHTML();
  $('#view').innerHTML=({home:vHome,col:vCol,exps:vExps,items:vItems,reports:vReports,settings:vSettings,more:vMore,inst:vInst,plan:vPlan,docs:vDocs,pmv:vPmv,months:vMonths})[view]()+brand();
  updateBell();hydrate();
}
function go(v){view=v;render();scrollTo(0,0)}
function gocol(t,p){colTab=t;if(t==='m'&&p){const[y,m]=p.split('-').map(Number);cur.y=y;cur.m=m}if(t==='a'&&p)cur.y=p;go('col')}
function shiftM(d){cur.m+=d;if(cur.m<1){cur.m=12;cur.y--}if(cur.m>12){cur.m=1;cur.y++}render()}
function monthBar(){const k=ym(cur.y,cur.m);return `<div class="mbar"><button onclick="shiftM(-1)">›</button><b>${MONTHS[cur.m-1]} ${cur.y} ${S.closed[k]?'<span class="lock">🔒 مقفول</span>':''}</b><button onclick="shiftM(1)">‹</button></div>`}
function yearBar(){return `<div class="mbar"><button onclick="cur.y--;render()">›</button><b>${cur.y}</b><button onclick="cur.y++;render()">‹</button></div>`}
const tabsHTML=(arr,curv,setter)=>`<div class="tabs">${arr.map(([k,l])=>`<button class="${curv===k?'on':''}" onclick="${setter}='${k}';render()">${esc(l)}</button>`).join('')}</div>`;
const c3=(...a)=>`<div class="cards c3">${a.map(([l,v,c])=>`<div class="card ${c||''}"><small>${esc(l)}</small><b>${v}</b></div>`).join('')}</div>`;
function txRow(t){
  const m=M(t.method);let title,sub,sign='';
  if(t.type==='tr'){title='تحويل';sub=`من ${esc(m?.name)} إلى ${esc(M(t.to)?.name)}`}
  else{title=esc(C(t.cat)?.name||'—');sub=esc(m?.name||'');sign=t.type==='exp'?'-':'+'}
  const ic=t.type==='exp'?'↑':t.type==='inc'?'↓':'⇄';
  return `<div class="row" onclick="editTx('${t.id}')"><span class="ic ${t.type}">${ic}</span><div class="grow"><b>${title}${(t.files||[]).length?' 📎':''}</b><small>${sub}${t.note?' · '+esc(t.note):''}</small></div><div class="amt ${t.type}">${sign}${fmt(t.amount)}<small>${fd(t.date)}${isClosed(t.date)?' 🔒':''}</small></div></div>`;
}
const txList=l=>l.length?`<div class="list">${l.map(txRow).join('')}</div>`:'<p class="empty">لا يوجد عمليات</p>';
function txGroupsOf(l){
  if(!l.length)return '<p class="empty">لا يوجد عمليات</p>';
  l=[...l].sort(byDesc);const g={};l.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  return Object.keys(g).map(d=>{const x=new Date(d+'T00:00');return `<div class="day">${DAYS[x.getDay()]} ${x.getDate()} ${MONTHS[x.getMonth()]}</div><div class="list">${g[d].map(txRow).join('')}</div>`}).join('');
}
function breakdown(list,kind){
  const g={};list.filter(t=>t.type===kind).forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amount);
  const tot=Object.values(g).reduce((a,b)=>a+b,0);if(!tot)return '<p class="empty">لا يوجد</p>';
  return '<div class="list">'+Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<div class="row col" onclick="openStmt('cat','${id}')"><div class="rowin"><b>${esc(C(id)?.name||'—')}</b><span>${fmt(v)} <small class="muted" style="display:inline">${Math.round(v/tot*100)}%</small></span></div><div class="bar"><i class="${kind}" style="width:${v/tot*100}%"></i></div></div>`).join('')+'</div>';
}
function pmRows(list){
  const rows=pmStats(list);
  if(!rows.length)return '<p class="empty">لا يوجد</p>';
  return rows.map(({m,i,o})=>`<div class="row" onclick="openStmt('method','${m.id}')"><span class="dot" style="background:${m.color}"></span><div class="grow"><b>${esc(m.name)}</b>${m.bank?`<small>${esc(m.bank)}</small>`:''}</div><div class="amt"><span class="neg">صرفت ${num(o)}</span><small class="pos">قبضت ${num(i)}</small></div></div>`).join('');
}
function stBadge(s,due){
  if(s.st==='done')return '<span class="badge done">اتحصّل ✓</span>';
  if(s.st==='rej')return '<span class="badge rej">مرفوض</span>';
  if(!due)return '<span class="badge wait">منتظر</span>';
  const left=daysBetween(due,today());
  if(left<0)return '<span class="badge late">متأخر</span>';
  if(left<=(+S.settings.lead||10))return `<span class="badge soon">${left?'باقي '+left+' يوم':'النهارده'}</span>`;
  return '<span class="badge wait">منتظر</span>';
}
function colRow(k,id,p,name,sub,note,s,due){
  const P=pj(p);let info='';
  if(s.st==='done')info=`<small class="pos">اتحصّل ${fmt(s.t.amount)} · ${fdate(s.t.date)} · ${esc(M(s.t.method)?.name||'')}</small>`;
  if(s.st==='rej')info=`<small class="neg">مرفوض${s.reason?': '+esc(s.reason):''}</small>`;
  const acts=s.st==='wait'?`<button class="mini ok" onclick="collect('${k}','${id}',${P})">✓ تم</button><button class="mini no" onclick="rejectIt('${k}','${id}',${P})">✕</button>`:`<button class="mini" onclick="undoIt('${k}','${id}',${P})">↩</button>`;
  return `<div class="row nrow"><div class="grow"><b>${esc(name)}</b><small>${sub}</small>${note?`<small>📝 ${esc(note)}</small>`:''}${info}</div><div class="acts">${stBadge(s,due)}${acts}</div></div>`;
}

function openFlow(kind,y,m){y=y||NY;m=m||NM;const k=ym(y,m);stmt={type:kind,cat:'',method:'',from:k+'-01',to:k+'-'+pad(lastDay(k))};rtab='stmt';go('reports')}
function vHome(){
  const mn=MONTHS[NM-1],s=sums(monthTx(NY,NM)),y=NY;
  let h='',tiles='';
  if(hs('cur'))h+=`<div class="hero"><div class="hero-t">${esc(L('cur'))}<span>${mn}</span></div>
    <div class="hbtns"><button onclick="openFlow('inc')"><small>${esc(L('inc'))}</small><b>${num(s.inc)}</b><i>التفاصيل ‹</i></button><button onclick="openFlow('exp')"><small>${esc(L('exp'))}</small><b>${num(s.exp)}</b><i>التفاصيل ‹</i></button></div>
    <div class="hnet"><span>${esc(L('net'))}</span><b>${num(s.net)} ج.م</b></div></div>`;
  if(hs('prev')){
    const pd=new Date(NY,NM-2,1),py=pd.getFullYear(),pm=pd.getMonth()+1,pk=ym(py,pm),pcl=S.closed[pk];
    const ps=pcl?{inc:+pcl.inc||0,exp:+pcl.exp||0}:sums(monthTx(py,pm)),pn=ps.inc-ps.exp;
    tiles+=`<div class="tile wide" onclick="cur.y=${py};cur.m=${pm};rtab='month';go('reports')"><small>${esc(L('prev'))} · ${mName(pk)} ${pcl?'🔒':''}</small>
      <div class="trio"><span>${esc(L('inc'))}<b class="pos">${num(ps.inc)}</b></span><span>${esc(L('exp'))}<b class="neg">${num(ps.exp)}</b></span><span>${esc(L('net'))}<b class="${pn<0?'neg':'pos'}">${num(pn)}</b></span></div></div>`;
  }
  if(hs('monthly')){
    let te=0,tg=0;monthlyFor(NKM).forEach(i=>{te+=+i.amount||0;const st=stOf(getRec('m',i.id,NKM));if(st.st==='done')tg+=st.t.amount});
    tiles+=`<div class="tile" onclick="cur.y=NY;cur.m=NM;gocol('m','${NKM}')"><small>${esc(L('monthly'))}</small><b>${num(tg)} / ${num(te)}</b><div class="prog"><i style="width:${te?Math.min(100,tg/te*100):0}%"></i></div></div>`;
  }
  if(hs('annual')){
    let ae=0,ag=0,nx=null;
    S.annual.forEach(a=>{ae+=annCur(a,y)||0;const st=stOf(getRec('a',a.id,y));if(st.st==='done')ag+=st.t.amount;else if(st.st==='wait'&&a.due&&a.active!==false){const d=`${y}-${a.due}`;if(!nx||d<nx.d)nx={a,d}}});
    tiles+=`<div class="tile" onclick="gocol('a',${y})"><small>${esc(L('annual'))} ${y}</small><b>${num(ag)} / ${num(ae)}</b><div class="prog"><i style="width:${ae?Math.min(100,ag/ae*100):0}%"></i></div>${nx?`<small>${esc(nx.a.name)} · ${fdate(nx.d)}</small>`:''}</div>`;
  }
  if(hs('expected')){
    let ew=0,en=0;S.expected.forEach(e=>{if(stOf(e.rec).st==='wait'){ew+=+e.amount||0;en++}});
    tiles+=`<div class="tile" onclick="gocol('e')"><small>${esc(L('expected'))}</small><b>${fmt(ew)}</b><small>${en} بند منتظر</small></div>`;
  }
  if(hs('inst')){
    const nx=nextInst();
    tiles+=`<div class="tile" onclick="go('inst')"><small>${esc(L('inst'))}</small>${nx?`<b>${fmt(+nx.it.amount||0)}</b><small>${esc(nx.p.name)} · ${fdate(nx.it.due)}</small>`:'<b>—</b>'}</div>`;
  }
  if(hs('alerts')){const al=alerts().length;tiles+=`<div class="tile" onclick="openNotifs()"><small>🔔 التنبيهات</small><b class="${al?'neg':'pos'}">${al||'✓'}</b></div>`}
  if(tiles)h+=`<div class="dash">${tiles}</div>`;
  if(hs('recent'))h+='<h3>آخر العمليات</h3>'+txList(monthTx(NY,NM).sort(byDesc).slice(0,8));
  return h;
}

function vCol(){
  let h=`<h3>💰 ${esc(L('inc'))}</h3>`+tabsHTML([['all','كل التحصيلات'],['m','الشهرية'],['a','السنوية'],['e','المتوقعة']],colTab,'colTab');
  if(colTab!=='all')h+=`<div class="etbar"><button class="mini" onclick="itab=colTab;go('items')">📋 ${esc(L('items'))}</button></div>`;
  return h+({all:cAll,m:cMonthly,a:cAnnual,e:cExpected})[colTab]();
}
function cAll(){
  const list=monthTx(cur.y,cur.m).filter(t=>t.type==='inc'),tot=list.reduce((a,t)=>a+t.amount,0);
  return monthBar()+`<div class="cards"><div class="card inc"><small>إجمالي ${esc(L('inc'))}</small><b>${fmt(tot)}</b></div><div class="card"><small>عدد العمليات</small><b>${list.length}</b></div></div>`
    +`<div class="etbar"><button class="mini pri" onclick="newTx('inc')">+ ${esc(L('incOne'))}</button><button class="mini" onclick="openFlow('inc',cur.y,cur.m)">🧾 كشف حساب</button></div>`
    +'<h3>حسب البند</h3>'+breakdown(list,'inc')+'<h3>العمليات</h3>'+txGroupsOf(list);
}
function cMonthly(){
  const key=ym(cur.y,cur.m);let h=monthBar();const items=monthlyFor(key);let te=0,tg=0,tr=0;
  const rows=items.map(i=>{
    const s=stOf(getRec('m',i.id,key));te+=+i.amount||0;
    if(s.st==='done')tg+=s.t.amount;if(s.st==='rej')tr+=+i.amount||0;
    return colRow('m',i.id,key,i.name,`المتوقع ${fmt(+i.amount||0)} · يوم ${+i.day||1}`,i.note,s,mDue(i,key));
  }).join('');
  h+=c3(['المتوقع',fmt(te)],['اتحصّل',fmt(tg),'inc'],['باقي',fmt(Math.max(0,te-tg-tr)),'exp']);
  return h+(items.length?`<div class="list">${rows}</div>`:'<p class="empty">لا يوجد بنود</p>');
}
function cAnnual(){
  const y=cur.y;let h=yearBar(),tl=0,te=0,tg=0;
  const list=S.annual.filter(a=>a.active!==false||getRec('a',a.id,y)).sort((a,b)=>(a.due||'99').localeCompare(b.due||'99'));
  const rows=list.map(a=>{
    const Lv=annLast(a,y),V=annCur(a,y),s=stOf(getRec('a',a.id,y)),pct=annPct(Lv,V);
    tl+=Lv||0;te+=V||0;if(s.st==='done')tg+=s.t.amount;
    return colRow('a',a.id,y,a.name,`${a.due?fdate(y+'-'+a.due)+' · ':''}${y-1}: ${Lv!=null?num(Lv):'—'} ← ${y}: ${V!=null?num(V):'—'}${pct!==null?` (${pct>0?'+':''}${pct}%)`:''}`,a.note,s,a.due?`${y}-${a.due}`:'');
  }).join('');
  h+=c3([`تحصيل ${y-1}`,fmt(tl)],[`متوقع ${y}`,fmt(te)],[`اتحصّل ${y}`,fmt(tg),'inc']);
  return h+(list.length?`<div class="list">${rows}</div>`:'<p class="empty">لا يوجد بنود</p>');
}
function cExpected(){
  let tw=0,tg=0;
  const list=[...S.expected].sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
  const rows=list.map(e=>{const s=stOf(e.rec);if(s.st==='done')tg+=s.t.amount;else if(s.st==='wait')tw+=+e.amount||0;
    return colRow('e',e.id,null,e.name,`${fdate(e.date)} · ${fmt(+e.amount||0)}`,e.note,s,e.date)}).join('');
  return `<div class="cards"><div class="card"><small>منتظر</small><b>${fmt(tw)}</b></div><div class="card inc"><small>اتحصّل</small><b>${fmt(tg)}</b></div></div>`+(list.length?`<div class="list">${rows}</div>`:'<p class="empty">لا يوجد بنود</p>');
}
function collect(k,id,p){
  const it=item(k,id);if(!it)return;
  const td=today();let amt,date;
  if(k==='m'){amt=it.amount;date=p===NKM?td:mDue(it,p)}
  else if(k==='a'){amt=annCur(it,p)??annLast(it,p)??'';date=p===NY||!it.due?td:`${p}-${it.due}`}
  else{amt=it.amount;date=td}
  const meths=S.methods.filter(m=>m.active);
  if(!meths.length)return toast('ضيف طريقة دفع الأول');
  sheet(`<h2>✓ ${esc(it.name)}</h2>
  <input id="k-amt" class="amt-in" type="text" inputmode="decimal" value="${esc(amt??'')}" placeholder="0">
  <label>استلمت على<select id="k-m">${opt(meths,defMethod())}</select></label>
  <label>تاريخ التحصيل<input id="k-d" type="date" value="${date}"></label>
  <label>ملاحظة<input id="k-n" type="text"></label>
  <button class="btn" onclick="doCollect('${k}','${id}',${pj(p)})">تم التحصيل</button>`);
}
function doCollect(k,id,p){
  const it=item(k,id),amount=parseNum($('#k-amt').value),date=$('#k-d').value,method=$('#k-m').value;
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!date)return toast('اختار التاريخ');
  if(isClosed(date))return toast(`شهر ${MONTHS[+date.slice(5,7)-1]} مقفول`);
  const cat=ensureCat(it.name,'inc');

function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function parseSchedule(text){
  const t=text.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
  const out=[];
  t.split(/\n+/).forEach(line=>{
    let due=null,l=line,m=l.match(/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/);
    if(m){due=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;l=l.replace(m[0],' ')}
    else if((m=l.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;due=`${y}-${pad(+m[2])}-${pad(+m[1])}`;l=l.replace(m[0],' ')}
    if(!due)return;
    const[,Mo,D]=due.split('-').map(Number);if(Mo<1||Mo>12||D<1||D>31)return;
    const nums=(l.match(/\d[\d,]*(\.\d+)?/g)||[]).map(x=>parseFloat(x.replace(/,/g,''))).filter(x=>x>=10);
    if(!nums.length)return;
    out.push({id:uid(),due,amount:String(Math.max(...nums))});
  });
  return out;
}
function ocrStart(){
  grabPF();
  pickFiles('img',async ids=>{
    if(!ids.length)return;
    PF.files=PF.files.concat(ids);planForm();
    const st=()=>$('#ocrst');
    try{
      st()&&(st().innerHTML='<p class="warn">⏳ جاري تجهيز القراءة...</p>');
      await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const w=await Tesseract.createWorker('ara+eng',1,{logger:m=>{if(m.status==='recognizing text'&&st())st().innerHTML=`<p class="warn">⏳ جاري قراءة الصورة ${Math.round(m.progress*100)}%</p>`}});
      let rows=[];for(const id of ids){const r=await FDB.get(id);const{data}=await w.recognize(r.blob);rows=rows.concat(parseSchedule(data.text))}
      await w.terminate();
      grabPF();PF.items=PF.items.concat(rows);planForm();
      toast(rows.length?`اتقرا ${rows.length} قسط ✓ راجعهم قبل الحفظ`:'ما قدرتش أقرا أقساط من الصورة');
    }catch(e){if(st())st().innerHTML='';toast('القراءة ما نفعتش، اتأكد من النت')}
  });
}

const REPORTS=[['stmt','🧾','كشف حساب تفصيلي'],['month','📅','تقرير الشهر'],['year','📆','تقرير السنة'],['cols','💰','تقرير التحصيلات'],['inst','🏦','تقرير الأقساط'],['pmr','💳','طرق الدفع']];

  const r=REPORTS.find(x=>x[0]===rtab)||REPORTS[0];

}
function openStmt(kind,id,year){
  stmt={type:'all',cat:'',method:'',from:'',to:''};
  if(kind==='cat'){stmt.cat=id;stmt.type=C(id)?.kind||'all'}else stmt.method=id;
  if(year){stmt.from=year+'-01-01';stmt.to=year+'-12-31'}
  else{const k=ym(cur.y,cur.m);stmt.from=k+'-01';stmt.to=k+'-'+pad(lastDay(k))}
  rtab='stmt';go('reports');
}
function setPeriod(p){
  if(p==='m'){stmt.from=NKM+'-01';stmt.to=NKM+'-'+pad(lastDay(NKM))}
  else if(p==='pm'){const x=new Date(NY,NM-2,1),k=ym(x.getFullYear(),x.getMonth()+1);stmt.from=k+'-01';stmt.to=k+'-'+pad(lastDay(k))}
  else if(p==='y'){stmt.from=NY+'-01-01';stmt.to=NY+'-12-31'}
  else{stmt.from='2000-01-01';stmt.to='2100-12-31'}
  render();
}
function rStmt(){
  const cats=S.cats.filter(c=>stmt.type==='all'||c.kind===stmt.type);
  if(stmt.cat&&!cats.some(c=>c.id===stmt.cat))stmt.cat='';
  let h=`<div class="seg">${[['all','الكل'],['exp',L('exp')],['inc',L('inc')]].map(([k,l])=>`<button class="${stmt.type===k?'on '+k:''}" onclick="stmt.type='${k}';render()">${esc(l)}</button>`).join('')}</div>
  <div class="two"><label>البند<select onchange="stmt.cat=this.value;render()"><option value="">كل البنود</option>${cats.map(c=>`<option value="${c.id}" ${c.id===stmt.cat?'selected':''}>${esc(c.name)}${stmt.type==='all'?(c.kind==='exp'?' ('+esc(L('expOne'))+')':' ('+esc(L('incOne'))+')'):''}</option>`).join('')}</select></label>
  <label>طريقة الدفع<select onchange="stmt.method=this.value;render()"><option value="">الكل</option>${opt(S.methods,stmt.method)}</select></label></div>
  <div class="two"><label>من<input type="date" value="${stmt.from}" onchange="stmt.from=this.value;render()"></label><label>إلى<input type="date" value="${stmt.to}" onchange="stmt.to=this.value;render()"></label></div>
  <div class="tabs">${[['m','الشهر ده'],['pm','الشهر اللي فات'],['y','السنة دي'],['all','كل الفترات']].map(([k,l])=>`<button onclick="setPeriod('${k}')">${l}</button>`).join('')}</div>`;
  const rows=S.txs.filter(t=>t.type!=='tr'&&t.date>=stmt.from&&t.date<=stmt.to&&(stmt.type==='all'||t.type===stmt.type)&&(!stmt.cat||t.cat===stmt.cat)&&(!stmt.method||t.method===stmt.method)).sort(byAsc);
  STMT_ROWS=rows;const s=sums(rows);
  const desc=[`الفترة: ${dmy(stmt.from)} إلى ${dmy(stmt.to)}`,stmt.type!=='all'?`النوع: ${stmt.type==='exp'?L('exp'):L('inc')}`:'النوع: الكل',stmt.cat?`البند: ${C(stmt.cat)?.name||''}`:'كل البنود',stmt.method?`طريقة الدفع: ${M(stmt.method)?.name||''}`:''].filter(Boolean).join(' · ');
  h+=`<div id="rep"><p class="rsum">${esc(desc)}</p>`+c3([L('inc'),fmt(s.inc),'inc'],[L('exp'),fmt(s.exp),'exp'],[L('net'),fmt(s.net)])
    +`<p class="rsum">عدد العمليات: ${rows.length} · بمرفقات: ${rows.filter(t=>(t.files||[]).length).length}</p>`;
  h+=rows.length?`<div class="tbl"><table><thead><tr><th>#</th><th>التاريخ</th><th>النوع</th><th>البند</th><th>طريقة الدفع</th><th>المبلغ</th><th>ملاحظات</th><th>مرفق</th></tr></thead><tbody>${rows.map((t,i)=>`<tr onclick="editTx('${t.id}')"><td>${i+1}</td><td>${dmy(t.date)}</td><td><span class="badge ${t.type==='exp'?'late':'done'}">${esc(t.type==='exp'?L('expOne'):L('incOne'))}</span></td><td>${esc(C(t.cat)?.name||'—')}</td><td>${esc(M(t.method)?.name||'—')}</td><td class="${t.type==='exp'?'neg':'pos'}"><b>${num(t.amount)}</b></td><td>${esc(t.note||'')}</td><td>${(t.files||[]).length?'📎 '+t.files.length:'—'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="5"><b>الإجمالي</b></td><td colspan="3"><b class="pos">+${num(s.inc)}</b> &nbsp; <b class="neg">-${num(s.exp)}</b> &nbsp; = <b>${num(s.net)}</b></td></tr></tfoot></table></div>`:'<p class="empty">لا يوجد عمليات</p>';
  return h+'</div>';
}
function rMonth(){
  const list=monthTx(cur.y,cur.m),key=ym(cur.y,cur.m),cl=S.closed[key],s=sums(list);

function rPm(){const list=monthTx(cur.y,cur.m);return monthBar()+`<div class="list">${pmRows(list)}</div>`}
function rYear(){
  const y=cur.y,data=MONTHS.map((n,i)=>sums(monthTx(y,i+1)));
  const yl=S.txs.filter(t=>t.date.startsWith(y+'-')),max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp))),s=sums(yl);

  <div class="legend"><span><i class="inc"></i>${esc(L('inc'))}</span><span><i class="exp"></i>${esc(L('exp'))}</span></div>`;
  const rows=data.map((d,i)=>(d.inc||d.exp)?`<tr onclick="cur.m=${i+1};rtab='month';render()"><td>${MONTHS[i]} ${S.closed[ym(y,i+1)]?'🔒':''}</td><td class="pos">${num(d.inc)}</td><td class="neg">${num(d.exp)}</td><td class="${d.net<0?'neg':'pos'}"><b>${num(d.net)}</b></td></tr>`:'').join('');

function rCols(){
  const key=ym(cur.y,cur.m);let me=0,mg=0,mr=0;
  monthlyFor(key).forEach(i=>{me+=+i.amount||0;const s=stOf(getRec('m',i.id,key));if(s.st==='done')mg+=s.t.amount;if(s.st==='rej')mr+=+i.amount||0});
  let ae=0,ag=0;S.annual.forEach(a=>{ae+=annCur(a,cur.y)||0;const s=stOf(getRec('a',a.id,cur.y));if(s.st==='done')ag+=s.t.amount});
  let ew=0,eg=0;S.expected.forEach(e=>{const s=stOf(e.rec);if(s.st==='done')eg+=s.t.amount;else if(s.st==='wait')ew+=+e.amount||0});
  return monthBar()+`<h3>${esc(L('monthly'))} · ${MONTHS[cur.m-1]}</h3>`+c3(['المتوقع',fmt(me)],['اتحصّل',fmt(mg),'inc'],['مرفوض',fmt(mr),'exp'])
    +`<h3>${esc(L('annual'))} · ${cur.y}</h3>`+c3(['المتوقع',fmt(ae)],['اتحصّل',fmt(ag),'inc'],['باقي',fmt(Math.max(0,ae-ag)),'exp'])
    +`<h3>${esc(L('expected'))}</h3><div class="cards"><div class="card"><small>منتظر</small><b>${fmt(ew)}</b></div><div class="card inc"><small>اتحصّل</small><b>${fmt(eg)}</b></div></div>`;

function rInst(){
  if(!S.plans.length)return '<p class="empty">لا يوجد أقساط</p>';

  h+='</div>';
  if(LK.pin){
    h+=`<h3>البصمة / Face ID</h3><div class="list">${LK.bio?`<div class="row"><div class="grow"><b>👆 البصمة</b></div>${actBadge(true)}<button class="mini danger" onclick="LK.bio=null;saveLK();render()">إلغاء</button></div>`:`<div class="row" onclick="bioEnable()"><div class="grow"><b>👆 تفعيل الدخول بالبصمة</b></div>${actBadge(false)}</div>`}</div>
    <h3>القفل التلقائي</h3><select onchange="LK.after=+this.value;saveLK();toast('اتحفظ ✓')">${[[0,'فوراً'],[1,'بعد دقيقة'],[5,'بعد 5 دقايق'],[15,'بعد ربع ساعة']].map(([v,l])=>`<option value="${v}" ${(LK.after??1)===v?'selected':''}>${l}</option>`).join('')}</select>
    <div class="etbar" style="margin-top:8px"><button class="mini" onclick="showLock()">🔒 اقفل دلوقتي</button></div>`;
  }
  return h;
}
function dataTab(){
  const lb=localStorage.getItem(BKEY);
  return `<h3>النسخ الاحتياطي <span class="muted" style="font-size:11px">${lb?'آخر نسخة: '+lb:''}</span></h3>
  <button class="btn" onclick="backup()">⬇️ تنزيل نسخة (مع المرفقات)</button>
  ${CAN_SHARE?'<button class="btn ghost" onclick="shareBackup()">📤 مشاركة نسخة</button>':''}
  <button class="btn ghost" onclick="$('#restoreFile').click()">⬆️ استرجاع نسخة</button>
  <h3>منطقة خطر</h3><button class="btn ghost danger" onclick="resetAll()">مسح كل البيانات</button>`;
}
function setName(){S.settings.appName=$('#s-name').value.trim()||DEF_NAME;save();applyName();render();toast('اتحفظ ✓')}
function setTheme(k){S.settings.theme=k;save();applyTheme();render()}
function setHome(k,v){S.settings.home=S.settings.home||{};S.settings.home[k]=v;save()}
function saveLabels(){
  const o={};document.querySelectorAll('[data-lk]').forEach(i=>{const v=i.value.trim();if(v&&v!==LDEF[i.dataset.lk])o[i.dataset.lk]=v});
  S.settings.labels=o;save();render();toast('اتحفظ ✓');
}
function resetLabels(){S.settings.labels={};save();render();toast('رجعت المسميات الأصلية')}

/* ========== الشيت والنماذج ========== */
function sheet(html){$('#sheet .body').innerHTML=html;$('#sheet').classList.add('open');hydrate()}
function closeSheet(){$('#sheet').classList.remove('open')}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2300)}
function opt(arr,sel){return arr.map(o=>`<option value="${o.id}" ${o.id===sel?'selected':''}>${esc(o.name)}</option>`).join('')}

/* --- عملية --- */
function newTx(type){
  const dm=defMethod();if(!dm)return toast('ضيف طريقة دفع الأول');
  F={id:null,type:type||'exp',amount:'',cat:'',method:dm,to:'',date:today(),note:'',files:[],created:0};
  txForm();
}
function editTx(id){const t=S.txs.find(x=>x.id===id);if(!t)return;F={...t,amount:String(t.amount),cat:t.cat||'',to:t.to||'',note:t.note||'',files:[...(t.files||[])]};txForm()}
function grab(){
  const v=s=>$(s)?$(s).value:null;
  if(v('#f-amt')!==null)F.amount=v('#f-amt');if(v('#f-d')!==null)F.date=v('#f-d');if(v('#f-n')!==null)F.note=v('#f-n');
  if(v('#f-m')!==null)F.method=v('#f-m');if(v('#f-to')!==null)F.to=v('#f-to');if(v('#f-cat')!==null)F.cat=v('#f-cat');
}
function txForm(){
  const orig=F.id&&S.txs.find(t=>t.id===F.id),locked=orig&&isClosed(orig.date);
  const cats=S.cats.filter(c=>c.kind===F.type&&(c.active!==false||c.id===F.cat));
  const meths=S.methods.filter(m=>m.active||m.id===F.method||m.id===F.to);
  if(F.type!=='tr'&&!cats.some(c=>c.id===F.cat))F.cat=cats[0]?.id||'';
  const types=[['exp',L('expOne')],['inc',L('incOne')]].concat(F.type==='tr'?[['tr','تحويل']]:[]);
  sheet(`<h2>${F.id?'تعديل عملية':'عملية جديدة'}</h2>
  ${locked?'<p class="warn">🔒 الشهر ده مقفول</p>':''}
  <div class="seg">${types.map(([k,l])=>`<button class="${F.type===k?'on '+k:''}" onclick="grab();F.type='${k}';txForm()">${esc(l)}</button>`).join('')}</div>
  <input id="f-amt" class="amt-in" type="text" inputmode="decimal" placeholder="0" value="${esc(F.amount)}">
  ${F.type==='tr'
    ?`<label>من<select id="f-m">${opt(meths,F.method)}</select></label><label>إلى<select id="f-to">${opt(meths,F.to)}</select></label>`
    :`<div class="fl">البند<div class="inl"><select id="f-cat">${opt(cats,F.cat)}</select><button type="button" class="mini" onclick="quickCat()">+ جديد</button></div></div>
      <label>${F.type==='exp'?'دفعت بـ':'استلمت على'}<select id="f-m">${opt(meths,F.method)}</select></label>`}
  <div class="two"><label>التاريخ<input id="f-d" type="date" value="${F.date}"></label><label>ملاحظة<input id="f-n" type="text" value="${esc(F.note)}"></label></div>
  <div class="fl">المرفقات</div>${filesBox(F.files,'tx')}
  <button class="btn" onclick="saveTx()" ${locked?'disabled':''}>سجّل</button>
  ${F.id&&!locked?'<button class="btn ghost danger" onclick="delTx()">حذف العملية</button>':''}`);
}
function quickCat(){
  grab();const n=(prompt('اسم البند الجديد')||'').trim();if(!n)return;
  const c=ensureCat(n,F.type);c.active=true;save();F.cat=c.id;txForm();toast('اتضاف البند ✓');
}
function saveTx(){
  grab();const amount=parseNum(F.amount);
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!F.date)return toast('اختار التاريخ');
  if(isClosed(F.date))return toast(`شهر ${MONTHS[+F.date.slice(5,7)-1]} مقفول`);
  if(!F.method)return toast('اختار طريقة الدفع');
  if(F.type==='tr'){if(!F.to||F.to===F.method)return toast('اختار طريقتين مختلفتين')}
  else if(!F.cat)return toast('اختار البند');
  const t={id:F.id||uid(),type:F.type,amount,method:F.method,date:F.date,note:(F.note||'').trim(),files:F.files||[],created:F.created||Date.now()};
  if(F.src)t.src=F.src;
  if(F.type==='tr')t.to=F.to;else t.cat=F.cat;
  const i=S.txs.findIndex(x=>x.id===t.id);if(i>=0)S.txs[i]=t;else S.txs.push(t);
  save();closeSheet();render();toast('اتسجّلت ✓');
}
function delTx(){
  if(!confirm('تمسح العملية دي؟'))return;
  S.txs=S.txs.filter(t=>t.id!==F.id);
  S.plans.forEach(p=>p.items.forEach(it=>{if(it.txId===F.id)it.txId=null}));
  save();closeSheet();render();toast('اتمسحت');
}

/* --- طريقة دفع --- */
function editMethod(id){
  const m=id?M(id):{name:'',type:'cash',bank:'',color:COLORS[1],active:true};
  const used=id&&S.txs.some(t=>t.method===id||t.to===id);
  sheet(`<h2>${id?'تعديل':'إضافة'} طريقة دفع</h2>
  <label>الاسم<input id="m-name" value="${esc(m.name)}"></label>
  <label>النوع<select id="m-type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${m.type===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>البنك / الجهة<input id="m-bank" value="${esc(m.bank)}"></label>
  <div class="fl">اللون</div>
  <div class="colors">${COLORS.map(c=>`<button type="button" class="sw ${c===m.color?'on':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('')}</div>
  <input type="hidden" id="m-color" value="${m.color}">
  ${id?`<label class="chk"><input type="checkbox" id="m-act" ${m.active?'checked':''}> مفعّلة</label>`:''}
  <button class="btn" onclick="saveMethod('${id||''}')">حفظ</button>
  ${id&&!used?`<button class="btn ghost danger" onclick="delMethod('${id}')">حذف</button>`:''}`);
}
function pickColor(el,c){document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#m-color').value=c}
function saveMethod(id){
  const name=$('#m-name').value.trim();if(!name)return toast('اكتب الاسم');
  const m=id?M(id):{id:uid(),active:true};
  Object.assign(m,{name,type:$('#m-type').value,bank:$('#m-bank').value.trim(),color:$('#m-color').value});
  if($('#m-act'))m.active=$('#m-act').checked;if(!id)S.methods.push(m);
  fin();
}
function delMethod(id){if(!confirm('تمسح طريقة الدفع دي؟'))return;S.methods=S.methods.filter(m=>m.id!==id);save();closeSheet();render()}

/* ========== قفل الشهر ========== */
function closeMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`قفل ${MONTHS[m-1]} ${y}؟`))return;
  const s=sums(monthTx(y,m));
  S.closed[k]={at:new Date().toISOString(),inc:s.inc,exp:s.exp};
  save();render();toast('اتقفل الشهر 🔒');
}
function openMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`فتح ${MONTHS[m-1]} ${y}؟`))return;
  delete S.closed[k];save();render();toast('اتفتح الشهر');
}

/* ========== النسخ الاحتياطي ========== */
const blob2b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function backupBlob(){
  toast('⏳ جاري تجهيز النسخة...');
  const files=[];
  for(const id of Object.keys(S.fmeta||{})){try{const r=await FDB.get(id);if(r)files.push({id,name:r.name,type:r.type,data:await blob2b64(r.blob)})}catch(e){}}
  return new Blob([JSON.stringify({app:'masrofi',appVersion:APP_VERSION,exported:new Date().toISOString(),data:S,files})],{type:'application/json'});
}
const backupName=()=>`fawzy-folio-backup-${today()}.json`;
function markBackup(){localStorage.setItem(BKEY,today());render()}
async function backup(){dlBlob(await backupBlob(),backupName());markBackup();toast('اتنزلت النسخة ✓')}
async function shareBackup(){
  try{const b=await backupBlob();await navigator.share({files:[new File([b],backupName(),{type:'application/json'})],title:appName()});markBackup()}catch(e){}
}
function restore(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=async()=>{try{
    const root=JSON.parse(r.result),d=root.data||root,files=root.files||[];
    if(!Array.isArray(d.methods)||!Array.isArray(d.txs))throw 0;
    if(!confirm(`النسخة فيها ${d.txs.length} عملية و ${files.length} مرفق.\nهتستبدل البيانات الحالية. نكمل؟`))return;
    toast('⏳ جاري الاسترجاع...');
    for(const x of files){try{const b=await (await fetch(x.data)).blob();await FDB.put({id:x.id,blob:b,name:x.name,type:x.type})}catch(e){}}
    S=normalize(d);save();applyTheme();applyName();go('home');toast('اتسترجعت البيانات ✓');
  }catch(e){alert('الملف ده مش نسخة احتياطية صالحة')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('هتمسح كل العمليات والمرفقات والإعدادات من الجهاز ده. متأكد؟'))return;
  if(!confirm('آخر تأكيد: المسح مش هيترجع.'))return;
  S=normalize(defaults());save();gcFiles();applyTheme();applyName();go('home');toast('اتمسح كل شيء');
}

/* ========== تشغيل ========== */
$('#hd').textContent=NOW.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
applyTheme();applyName();save();render();gcFiles();
if(LK.pin){showLock();if(LK.bio)setTimeout(()=>bioUnlock(true),400)}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>setTimeout(pushAlerts,1500)).catch(()=>{}));
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}
  if(LK.pin&&hiddenAt&&(Date.now()-hiddenAt)/60000>=(LK.after??1))showLock();
  updateBell();pushAlerts();
});
</script>
