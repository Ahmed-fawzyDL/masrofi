<style>

td:nth-child(2){white-space:normal;min-width:110px}

<body>
<header><h1>مصروفي</h1><div class="hr"><span id="hd"></span><button id="bell" onclick="openNotifs()" aria-label="التنبيهات">🔔<b></b></button></div></header>
<main id="view"></main>

  <button data-v="home" onclick="go('home')"><span>🏠</span>الرئيسية</button>
  <button data-v="col" onclick="go('col')"><span>📥</span>التحصيلات</button>
  <button class="fab" onclick="newTx()" aria-label="حركة جديدة">+</button>
  <button data-v="reports" onclick="go('reports')"><span>📊</span>التقارير</button>

<script>
/* ========== الإصدار والمطور ========== */
const APP_VERSION='1.2.0';
const APP_BUILD='11/10/2026 - 12:00 م';
const DEV={name:'Eng.Ahmed Fawzy',company:'DETech Solutions',phones:['01285258400','01060008747']};

/* ========== ثوابت وأدوات ========== */
const KEY='masrofi-data-v1', BKEY='masrofi-lastbackup', NKEY='masrofi-notified';
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const TYPES={cash:'كاش',instapay:'إنستاباي',card:'فيزا / كارت',bank:'حساب بنكي',wallet:'محفظة موبايل'};
const COLORS=['#16a34a','#0f766e','#0891b2','#2563eb','#7c3aed','#db2777','#dc2626','#ea580c','#ca8a04','#475569'];
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ym=(y,m)=>y+'-'+pad(m);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const r2=n=>Math.round(n*100)/100;
const num=n=>r2(n).toLocaleString('en-US');
const fmt=n=>num(n)+' ج.م';
const fd=d=>d.slice(8)+'/'+d.slice(5,7);
const fdate=d=>d?`${+d.slice(8)} ${MONTHS[+d.slice(5,7)-1]} ${d.slice(0,4)}`:'—';
const lastDay=key=>{const[y,m]=key.split('-').map(Number);return new Date(y,m,0).getDate()};
const mName=key=>{const[y,m]=key.split('-').map(Number);return MONTHS[m-1]+' '+y};
const daysBetween=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pj=p=>p==null?'null':typeof p==='string'?`'${p}'`:p;
function parseNum(s){s=String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(/[,٬\s]/g,'');return parseFloat(s)}

/* ========== البيانات ========== */
function defaults(){
  const m=(name,type,color)=>({id:uid(),name,type,bank:'',color,active:true});
  const c=(name,kind)=>({id:uid(),name,kind,active:true});
  return {version:3,
    methods:[m('كاش','cash','#16a34a'),m('إنستاباي','instapay','#7c3aed'),m('فيزا / كارت','card','#2563eb'),m('حساب بنكي','bank','#0891b2'),m('محفظة موبايل','wallet','#dc2626')],
    cats:[...['أكل وشرب','مواصلات وبنزين','فواتير ومرافق','إيجار','صحة وعلاج','تعليم','ملابس','بيت ومستلزمات','ترفيه وخروجات','هدايا ومناسبات','أخرى'].map(n=>c(n,'exp')),
      c('الراتب','inc'),c('شغل إضافي','inc'),c('تحصيلات أخرى','inc')],
    txs:[],closed:{},monthly:[],mst:{},annual:[],expected:[],settings:{lead:10}};
}
function normalize(d){
  d.methods=d.methods||[];d.cats=d.cats||[];d.closed=d.closed||{};
  d.txs=(d.txs||[]).map(t=>({...t,amount:+t.amount||0}));
  d.monthly=d.monthly||[];d.mst=d.mst||{};d.annual=d.annual||[];d.expected=d.expected||[];
  d.settings=Object.assign({lead:10},d.settings||{});
  if((d.version||1)<3){
    d.cats.filter(c=>c.kind==='inc'&&c.freq==='yearly').forEach(c=>{
      const used=d.txs.some(t=>t.cat===c.id),plan=c.plan||{};
      if(used||Object.keys(plan).length||c.name!=='أرباح سنوية')
        d.annual.push({id:uid(),name:c.name,due:pad(c.dueMonth||1)+'-01',note:'',active:c.active!==false,amounts:{...plan},st:{}});
      if(used)c.freq='variable';else d.cats=d.cats.filter(x=>x!==c);
    });
    d.version=3;
  }
  return d;
}
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}S=S&&S.methods?normalize(S):defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('مشكلة في الحفظ: المساحة ممكن تكون خلصت')}}
const M=id=>S.methods.find(x=>x.id===id);
const C=id=>S.cats.find(x=>x.id===id);
const isClosed=date=>!!S.closed[date.slice(0,7)];
const monthTx=(y,m)=>S.txs.filter(t=>t.date.startsWith(ym(y,m)+'-'));
function sums(l){let inc=0,exp=0;for(const t of l){if(t.type==='inc')inc+=t.amount;else if(t.type==='exp')exp+=t.amount}return{inc,exp,net:inc-exp}}
function pmStats(list){
  return S.methods.map(m=>{let i=0,o=0;list.forEach(t=>{if(t.method!==m.id)return;if(t.type==='exp')o+=t.amount;else if(t.type==='inc')i+=t.amount});return{m,i,o}})
    .filter(x=>x.m.active||x.i||x.o).sort((a,b)=>(b.o+b.i)-(a.o+a.i));
}
const byDesc=(a,b)=>b.date.localeCompare(a.date)||b.created-a.created;
const byAsc=(a,b)=>a.date.localeCompare(b.date)||a.created-b.created;
function ensureCat(name,kind){let c=S.cats.find(x=>x.kind===kind&&x.name===name);if(!c){c={id:uid(),name,kind,active:true};S.cats.push(c)}return c}

/* --- التحصيلات: شهرية (m) / سنوية (a) / متوقعة (e) --- */
const ITEMS={m:()=>S.monthly,a:()=>S.annual,e:()=>S.expected};
const item=(k,id)=>ITEMS[k]().find(x=>x.id===id);
function getRec(k,id,p){if(k==='m')return (S.mst[p]||{})[id];const it=item(k,id);if(!it)return;return k==='a'?(it.st||{})[p]:it.rec}
function setRec(k,id,p,rec){
  if(k==='m'){S.mst[p]=S.mst[p]||{};if(rec)S.mst[p][id]=rec;else delete S.mst[p][id];return}
  const it=item(k,id);if(!it)return;
  if(k==='a'){it.st=it.st||{};if(rec)it.st[p]=rec;else delete it.st[p]}else{if(rec)it.rec=rec;else delete it.rec}
}
function stOf(rec){if(!rec)return{st:'wait'};if(rec.st==='done'){const t=S.txs.find(x=>x.id===rec.txId);return t?{st:'done',t}:{st:'wait'}}return rec}
function monthlyFor(key){return S.monthly.filter(i=>(!i.start||i.start<=key)&&(i.active!==false||getRec('m',i.id,key)))}
const mDue=(i,key)=>key+'-'+pad(Math.min(+i.day||1,lastDay(key)));
function annLast(a,y){const p=a.amounts||{};if(p[y-1]!=null)return +p[y-1];const s=stOf(getRec('a',a.id,y-1));return s.st==='done'?s.t.amount:null}
function annCur(a,y){const p=a.amounts||{};return p[y]!=null?+p[y]:null}
function annLastInfo(a,y){
  const s=stOf(getRec('a',a.id,y-1));
  if(s.st==='done')return `${fmt(s.t.amount)} (اتحصّل ${fdate(s.t.date)})`;
  const v=(a.amounts||{})[y-1];if(v!=null)return fmt(v)+(s.st==='rej'?' (مرفوض)':'');
  return '';
}

/* ========== الحالة ========== */
load();
const NOW=new Date(),NY=NOW.getFullYear(),NKM=ym(NY,NOW.getMonth()+1);
let cur={y:NY,m:NOW.getMonth()+1};
let view='home',rtab='month',ctab='exp',colTab='m',txF='all',txQ='',F=null;
let acc={exp:false,inc:false,mon:false,pm:false,mdef:false};
let stmt={kind:'cat',id:null,from:ym(cur.y,cur.m)+'-01',to:today()};
const ET={};
let CAN_SHARE=false;try{CAN_SHARE=!!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.json',{type:'application/json'})]}))}catch(e){}

/* ========== التنبيهات ========== */
function alerts(){
  const out=[],td=today(),lead=+S.settings.lead||10;
  S.monthly.filter(i=>i.active!==false).forEach(i=>{
    for(let k=2;k>=0;k--){
      const d=new Date(NY,NOW.getMonth()-k,1),key=ym(d.getFullYear(),d.getMonth()+1);
      if(i.start&&key<i.start)continue;
      if(stOf(getRec('m',i.id,key)).st!=='wait')continue;
      if(td<mDue(i,key))continue;
      out.push({id:`m-${i.id}-${key}`,title:`💼 ${i.name}: لم يتم تحصيله إلى الآن`,body:`${mName(key)} · المتوقع ${fmt(+i.amount||0)}${i.note?' · '+i.note:''}`,go:`gocol('m','${key}')`});
    }
  });
  S.annual.filter(a=>a.active!==false&&a.due).forEach(a=>{
    [NY,NY+1].forEach(y=>{
      const due=`${y}-${a.due}`,left=daysBetween(due,td);
      if(left>lead||(y>NY&&left<0))return;
      if(stOf(getRec('a',a.id,y)).st!=='wait')return;
      const ex=annCur(a,y),li=annLastInfo(a,y);
      const title=left<0?`⚠️ تحصيل ${a.name} متأخر ${-left} يوم`:left===0?`📅 النهارده ميعاد تحصيل ${a.name}`:`⏰ تحصيل ${a.name} ميعاده قرب، باقي ${left} يوم`;
      out.push({id:`a-${a.id}-${y}`,title,body:`الميعاد ${fdate(due)} · المتوقع ${ex!=null?fmt(ex):'—'}${li?' · السنة اللي فاتت: '+li:''}${a.note?' · ملاحظة: '+a.note:''}`,go:`gocol('a',${y})`});
    });
  });
  S.expected.forEach(e=>{
    if(!e.date||stOf(e.rec).st!=='wait')return;
    const left=daysBetween(e.date,td);if(left>lead)return;
    out.push({id:`e-${e.id}`,title:left<0?`⚠️ تحصيل متوقع متأخر: ${e.name}`:`🔮 تحصيل متوقع قرب: ${e.name}`,body:`${fdate(e.date)}${left>=0?` (باقي ${left} يوم)`:''} · ${fmt(+e.amount||0)}${e.note?' · '+e.note:''}`,go:`gocol('e')`});
  });
  const lb=localStorage.getItem(BKEY);
  if(S.txs.length&&(!lb||(Date.now()-new Date(lb))/864e5>30))out.push({id:'backup',title:'💾 وقت النسخة الاحتياطية',body:lb?'آخر نسخة احتياطية من أكتر من شهر':'لسه معملتش نسخة احتياطية',go:`go('settings')`});
  return out;
}
function updateBell(){const n=alerts().length;$('#bell b').textContent=n?n:''}
function openNotifs(){

  sheet(`<h2>🔔 التنبيهات</h2>${al.length?`<div class="list">${al.map(a=>`<div class="row nrow" onclick="closeSheet();${a.go}"><div class="grow"><b>${esc(a.title)}</b><small>${esc(a.body)}</small></div></div>`).join('')}</div>`:'<p class="empty">مفيش تنبيهات دلوقتي 👌</p>'}${notifBtn()}`);
}
function notifBtn(){
  if(!('Notification' in window))return '<small class="muted">الجهاز أو المتصفح ده مش بيدعم إشعارات الموبايل، والتنبيهات هتظهر جوه التطبيق بس.</small>';
  if(Notification.permission==='granted')return '<p class="muted">✅ إشعارات الموبايل شغالة</p>';
  if(Notification.permission==='denied')return '<small class="muted">الإشعارات مقفولة للموقع ده من إعدادات المتصفح. افتحها من إعدادات الموقع في Chrome.</small>';
  return '<button class="btn ghost" onclick="enableNotif()">🔔 تفعيل إشعارات الموبايل</button>';
}
async function enableNotif(){
  try{const p=await Notification.requestPermission();if(p==='granted'){toast('اتفعلت الإشعارات ✓');localStorage.removeItem(NKEY);pushAlerts()}else toast('الإشعارات اترفضت')}catch(e){toast('مش قادر أفعّل الإشعارات')}
  render();if($('#sheet').classList.contains('open'))openNotifs();
}
async function pushAlerts(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted'||!navigator.serviceWorker)return;
    const reg=await navigator.serviceWorker.getRegistration();if(!reg)return;
    const sent=JSON.parse(localStorage.getItem(NKEY)||'{}'),td=today();
    const list=alerts().filter(a=>sent[a.id]!==td);if(!list.length)return;
    const o={icon:'icon-192.png',badge:'icon-192.png',lang:'ar',dir:'rtl'};
    if(list.length>3)await reg.showNotification(`مصروفي: عندك ${list.length} تنبيه`,{...o,body:list.slice(0,3).map(a=>a.title).join('\n'),tag:'masrofi-sum'});
    else for(const a of list)await reg.showNotification(a.title,{...o,body:a.body,tag:a.id});
    list.forEach(a=>sent[a.id]=td);localStorage.setItem(NKEY,JSON.stringify(sent));
  }catch(e){}
}

/* ========== العرض ========== */
function render(){

  updateBell();
}
function go(v){view=v;render();scrollTo(0,0)}
function gocol(t,p){colTab=t;if(t==='m'&&p){const[y,m]=p.split('-').map(Number);cur.y=y;cur.m=m}if(t==='a'&&p)cur.y=p;go('col')}
function shiftM(d){cur.m+=d;if(cur.m<1){cur.m=12;cur.y--}if(cur.m>12){cur.m=1;cur.y++}render()}
function monthBar(){const k=ym(cur.y,cur.m);return `<div class="mbar"><button onclick="shiftM(-1)">›</button><b>${MONTHS[cur.m-1]} ${cur.y} ${S.closed[k]?'<span class="lock">🔒 مقفول</span>':''}</b><button onclick="shiftM(1)">‹</button></div>`}
function yearBar(){return `<div class="mbar"><button onclick="cur.y--;render()">›</button><b>${cur.y}</b><button onclick="cur.y++;render()">‹</button></div>`}
function cards(s){return `<div class="cards"><div class="card inc"><small>تحصيلات</small><b>${fmt(s.inc)}</b></div><div class="card exp"><small>مصروفات</small><b>${fmt(s.exp)}</b></div></div><div class="card net"><small>الصافي</small><b class="${s.net<0?'neg':'pos'}">${fmt(s.net)}</b></div>`}
function txRow(t){
  const m=M(t.method);let title,sub,sign='';
  if(t.type==='tr'){title='تحويل';sub=`من ${esc(m?.name)} إلى ${esc(M(t.to)?.name)}`}
  else{title=esc(C(t.cat)?.name||'—');sub=esc(m?.name||'');sign=t.type==='exp'?'-':'+'}
  const ic=t.type==='exp'?'↑':t.type==='inc'?'↓':'⇄';
  return `<div class="row" onclick="editTx('${t.id}')"><span class="ic ${t.type}">${ic}</span><div class="grow"><b>${title}</b><small>${sub}${t.note?' · '+esc(t.note):''}</small></div><div class="amt ${t.type}">${sign}${fmt(t.amount)}<small>${fd(t.date)}${isClosed(t.date)?' 🔒':''}</small></div></div>`;

const txList=l=>l.length?`<div class="list">${l.map(txRow).join('')}</div>`:'<p class="empty">مفيش حركات لسه. دوس + عشان تسجّل أول حركة</p>';
function accSection(k,title,right,body){
  return `<details class="acc" ${acc[k]?'open':''} ontoggle="acc['${k}']=this.open"><summary><span>${title}</span>${right||''}</summary><div class="accb">${body}</div></details>`;
}
function catRows(list,kind){
  const g={};list.filter(t=>t.type===kind).forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amount);
  const tot=Object.values(g).reduce((a,b)=>a+b,0);
  const rows=S.cats.filter(c=>c.kind===kind&&(c.active||g[c.id])).map(c=>({c,v:g[c.id]||0})).sort((a,b)=>b.v-a.v);
  if(!rows.length)return '<p class="empty">مفيش بنود</p>';
  return rows.map(({c,v})=>`<div class="row col ${v?'':'zero'}" onclick="openStmt('cat','${c.id}')"><div class="rowin"><span>${esc(c.name)}</span><b>${fmt(v)}${v&&tot?` <small class="muted" style="display:inline">${Math.round(v/tot*100)}%</small>`:''}</b></div>${v?`<div class="bar"><i class="${kind}" style="width:${v/tot*100}%"></i></div>`:''}</div>`).join('');
}
function pmRows(list){
  const rows=pmStats(list);
  if(!rows.length)return '<p class="empty">مفيش طرق دفع</p>';
  return rows.map(({m,i,o})=>`<div class="row ${i||o?'':'zero'}" onclick="openStmt('method','${m.id}')"><span class="dot" style="background:${m.color}"></span><div class="grow"><b>${esc(m.name)}</b>${m.bank?`<small>${esc(m.bank)}</small>`:''}</div><div class="amt"><span class="neg">صرفت ${num(o)}</span><small class="pos">قبضت ${num(i)}</small></div></div>`).join('');
}
function stBadge(s,due){
  if(s.st==='done')return '<span class="badge done">اتحصّل ✓</span>';
  if(s.st==='rej')return '<span class="badge rej">مرفوض</span>';
  if(!due)return '<span class="badge wait">منتظر</span>';
  const left=daysBetween(due,today());
  if(left<0)return '<span class="badge late">متأخر</span>';
  if(left<=(+S.settings.lead||10))return `<span class="badge soon">${left?'باقي '+left+' يوم':'النهارده'}</span>`;
  return '<span class="badge wait">منتظر</span>';
}
function stCell(k,id,p,s,due){
  const P=pj(p);
  const info=s.st==='done'?`<small>${fmt(s.t.amount)} · ${fdate(s.t.date)}</small>`:(s.st==='rej'&&s.reason?`<small>${esc(s.reason)}</small>`:'');
  const acts=s.st==='wait'?`<button class="mini ok" onclick="collect('${k}','${id}',${P})">✓</button> <button class="mini no" onclick="rejectIt('${k}','${id}',${P})">✕</button>`:`<button class="mini" onclick="undoIt('${k}','${id}',${P})">↩</button>`;
  return `<div class="st">${stBadge(s,due)} ${acts}${info}</div>`;
}

/* ========== جدول قابل للتعديل (إضافة / تعديل / تحديد الكل / حذف) ========== */
function etable(key,rows,defs){
  const T=ET[key];T.defs=defs||{};
  const head=T.cols.map(c=>`<th>${c.l}</th>`);if(T.extra)head.splice(1,0,'<th>الحالة</th>');
  return `<div class="tbl et" id="et-${key}"><table><thead><tr><th><input type="checkbox" title="تحديد الكل" onchange="selAll('${key}',this.checked)"></th>${head.join('')}</tr></thead><tbody>${rows.map(r=>etRow(key,r)).join('')}</tbody></table></div>
  <div class="etbar"><button class="mini" onclick="etAdd('${key}')">+ صف جديد</button><button class="mini pri" onclick="etSave('${key}')">💾 حفظ</button><button class="mini danger" onclick="etDel('${key}')">🗑 حذف المحدد</button></div>`;
}
function etRow(key,r){
  const T=ET[key],isNew=String(r.id).startsWith('new_');
  const cells=T.cols.map(c=>{
    const v=r[c.f];
    if(c.t==='chk')return `<td style="text-align:center"><input type="checkbox" data-f="${c.f}" ${v?'checked':''} onchange="etDirty(this)"></td>`;
    const typ=c.t==='date'?'type="date"':c.t==='text'?'type="text"':'type="text" inputmode="decimal"';
    return `<td><input ${typ} style="min-width:${c.w||70}px" data-f="${c.f}" value="${esc(v??'')}" placeholder="${esc(c.ph||'')}" oninput="etInput('${key}',this)"></td>`;
  });
  if(T.extra)cells.splice(1,0,`<td>${isNew?'':T.extra(r)}</td>`);
  return `<tr data-id="${r.id}" class="${isNew?'dirty':''}"><td><input type="checkbox" class="sel"></td>${cells.join('')}</tr>`;
}
function etDirty(el){el.closest('tr').classList.add('dirty')}
function etInput(key,el){etDirty(el);const T=ET[key];if(T.calc)T.calc(el.closest('tr'),el.dataset.f)}
function etAdd(key){
  const tb=$(`#et-${key} tbody`);tb.insertAdjacentHTML('beforeend',etRow(key,{id:'new_'+uid(),...ET[key].defs}));
  const inp=tb.lastElementChild.querySelector('input[data-f]');if(inp)inp.focus();
}
function selAll(key,v){document.querySelectorAll(`#et-${key} .sel`).forEach(x=>x.checked=v)}
function etRead(key,skip){
  return [...document.querySelectorAll(`#et-${key} tbody tr`)].filter(tr=>!(skip||[]).includes(tr.dataset.id)).map(tr=>{
    const r={id:tr.dataset.id};tr.querySelectorAll('[data-f]').forEach(i=>r[i.dataset.f]=i.type==='checkbox'?i.checked:i.value);return r;
  });
}
function etSave(key,silent){
  if(!$(`#et-${key}`))return;
  if(silent&&!document.querySelector(`#et-${key} tr.dirty`))return;
  ET[key].save(etRead(key));save();render();if(!silent)toast('اتحفظ ✓');
}
function etDel(key){
  const trs=[...document.querySelectorAll(`#et-${key} tbody tr`)].filter(tr=>tr.querySelector('.sel').checked);
  if(!trs.length)return toast('علّم على الصفوف اللي عايز تمسحها');
  if(!confirm(`تمسح ${trs.length} صف؟`))return;
  const ids=trs.map(tr=>tr.dataset.id),saved=ids.filter(id=>!id.startsWith('new_'));
  const rest=etRead(key,ids);
  if(saved.length&&ET[key].del(saved)===false)return;
  ET[key].save(rest);save();render();toast('اتمسح ✓');
}

/* ========== صفحة التحصيلات ========== */
function vCol(){
  const tabs=[['m','📅 شهرية'],['a','📆 سنوية'],['e','🔮 متوقعة']];
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="${colTab===k?'on':''}" onclick="colTab='${k}';render()">${l}</button>`).join('')}</div>`+({m:cMonthly,a:cAnnual,e:cExpected})[colTab]();
}
function cMonthly(){
  const key=ym(cur.y,cur.m);let h=monthBar();
  const items=monthlyFor(key);let te=0,tg=0,tr=0;
  const rows=items.map(i=>{
    const s=stOf(getRec('m',i.id,key));te+=+i.amount||0;
    if(s.st==='done')tg+=s.t.amount;if(s.st==='rej')tr+=+i.amount||0;
    const P=pj(key);
    let info='';
    if(s.st==='done')info=`<small class="pos">اتحصّل ${fmt(s.t.amount)} يوم ${fdate(s.t.date)} · ${esc(M(s.t.method)?.name||'')}</small>`;
    if(s.st==='rej')info=`<small class="neg">مرفوض${s.reason?': '+esc(s.reason):''}</small>`;
    const acts=s.st==='wait'?`<button class="mini ok" onclick="collect('m','${i.id}',${P})">✓ تم</button><button class="mini no" onclick="rejectIt('m','${i.id}',${P})">✕ مرفوض</button>`:`<button class="mini" onclick="undoIt('m','${i.id}',${P})">↩ تراجع</button>`;
    return `<div class="row"><div class="grow"><b>${esc(i.name)}</b><small>المتوقع ${fmt(+i.amount||0)} · يوم ${+i.day||1}</small>${i.note?`<small>📝 ${esc(i.note)}</small>`:''}${info}</div><div class="acts">${stBadge(s,mDue(i,key))}${acts}</div></div>`;
  }).join('');
  h+=`<div class="cards c3"><div class="card"><small>المتوقع</small><b>${fmt(te)}</b></div><div class="card inc"><small>اتحصّل</small><b>${fmt(tg)}</b></div><div class="card exp"><small>باقي</small><b>${fmt(Math.max(0,te-tg-tr))}</b></div></div>`;
  h+=items.length?`<div class="list">${rows}</div>`:'<p class="empty">مفيش بنود تحصيل شهري لسه.<br>ضيفها كلها مرة واحدة من الجدول اللي تحت 👇</p>';
  ET.m={cols:[{f:'name',t:'text',l:'البند',w:130,ph:'مثلاً: المرتب'},{f:'amount',t:'num',l:'المبلغ المتوقع',w:100},{f:'day',t:'num',l:'يوم التحصيل',w:70,ph:'1'},{f:'note',t:'text',l:'ملاحظات',w:150},{f:'active',t:'chk',l:'شغال'}],
    save:rows=>rows.forEach(r=>{
      const name=(r.name||'').trim();if(!name)return;
      let i=S.monthly.find(x=>x.id===r.id);if(!i){i={id:uid(),start:key};S.monthly.push(i)}
      Object.assign(i,{name,amount:parseNum(r.amount)||0,day:Math.min(31,Math.max(1,parseNum(r.day)||1)),note:(r.note||'').trim(),active:!!r.active});
    }),
    del:ids=>{S.monthly=S.monthly.filter(i=>!ids.includes(i.id))}};
  const open=acc.mdef||!S.monthly.length;
  h+=`<details class="acc" ${open?'open':''} ontoggle="acc.mdef=this.open"><summary><span>✏️ إدارة بنود التحصيل الشهري</span></summary><div class="accb" style="padding:10px">${etable('m',S.monthly.map(i=>({...i})),{active:true})}<small class="muted">اكتب كل البنود مرة واحدة (المرتب، الإيجار، ...) بالمبلغ المتوقع ويوم التحصيل، ودوس 💾 حفظ. البنود هتظهر كل شهر، ولما تتحصل دوس ✓ تم، ولو متحصلتش دوس ✕ مرفوض واكتب السبب.</small></div></details>`;
  return h;
}
function cAnnual(){
  const y=cur.y;let h=yearBar();let tl=0,te=0,tg=0;
  S.annual.forEach(a=>{tl+=annLast(a,y)||0;te+=annCur(a,y)||0;const s=stOf(getRec('a',a.id,y));if(s.st==='done')tg+=s.t.amount});
  h+=`<div class="cards c3"><div class="card"><small>تحصيل ${y-1}</small><b>${fmt(tl)}</b></div><div class="card"><small>متوقع ${y}</small><b>${fmt(te)}</b></div><div class="card inc"><small>اتحصّل ${y}</small><b>${fmt(tg)}</b></div></div>`;
  ET.a={cols:[{f:'name',t:'text',l:'البند',w:140,ph:'مثلاً: عقد صيانة ...'},{f:'due',t:'date',l:'ميعاد التحصيل',w:140},{f:'last',t:'num',l:`تحصيل ${y-1}`,w:95},{f:'pct',t:'num',l:'% الزيادة',w:70},{f:'cur',t:'num',l:`تحصيل ${y}`,w:95},{f:'note',t:'text',l:'ملاحظات',w:180,ph:'مثلاً: اتفقنا على زيادة 15% السنة الجاية'}],
    calc:(tr,f)=>{
      const g=n=>tr.querySelector(`[data-f="${n}"]`);
      const L=parseNum(g('last').value),P=parseNum(g('pct').value),V=parseNum(g('cur').value);
      if(f==='cur')g('pct').value=(L>0&&V>0)?r2((V/L-1)*100):'';
      else if((f==='pct'||f==='last')&&L>0&&!isNaN(P))g('cur').value=r2(L*(1+P/100));
    },
    save:rows=>rows.forEach(r=>{
      const name=(r.name||'').trim();if(!name)return;
      let a=S.annual.find(x=>x.id===r.id);if(!a){a={id:uid(),amounts:{},st:{},active:true};S.annual.push(a)}
      a.name=name;a.due=r.due?r.due.slice(5):'';a.note=(r.note||'').trim();a.amounts=a.amounts||{};
      const L=parseNum(r.last),V=parseNum(r.cur);
      if(!isNaN(L))a.amounts[y-1]=L;else delete a.amounts[y-1];
      if(!isNaN(V))a.amounts[y]=V;else delete a.amounts[y];
    }),
    del:ids=>{S.annual=S.annual.filter(a=>!ids.includes(a.id))},
    extra:r=>{const a=S.annual.find(x=>x.id===r.id);if(!a)return '';return stCell('a',a.id,y,stOf(getRec('a',a.id,y)),a.due?`${y}-${a.due}`:'')}};
  const rows=[...S.annual].sort((a,b)=>(a.due||'99').localeCompare(b.due||'99')).map(a=>{
    const L=annLast(a,y),V=annCur(a,y);
    return {id:a.id,name:a.name,due:a.due?`${y}-${a.due}`:'',last:L??'',pct:(L>0&&V>0)?r2((V/L-1)*100):'',cur:V??'',note:a.note||''};
  });
  h+=`<button class="btn ghost" style="margin:0 0 10px" onclick="applyAllPct()">٪ زيادة نسبة واحدة على كل البنود</button>`;

/* --- تحصيل / رفض / تراجع --- */
function collect(k,id,p){
  if(k!=='m')etSave(k,true);
  const it=item(k,id);if(!it)return;
  const td=today();let amt,date;
  if(k==='m'){amt=it.amount;date=p===NKM?td:mDue(it,p)}
  else if(k==='a'){amt=annCur(it,p)??annLast(it,p)??'';date=p===NY||!it.due?td:`${p}-${it.due}`}
  else{amt=it.amount;date=td}
  const meths=S.methods.filter(m=>m.active);
  if(!meths.length)return toast('ضيف طريقة دفع الأول من الإعدادات');
  sheet(`<h2>✓ تحصيل: ${esc(it.name)}</h2>
  <input id="k-amt" class="amt-in" type="text" inputmode="decimal" value="${esc(amt??'')}" placeholder="0">
  <label>استلمت على<select id="k-m">${opt(meths,(meths.find(m=>m.type==='cash')||meths[0]).id)}</select></label>
  <label>تاريخ التحصيل<input id="k-d" type="date" value="${date}"></label>
  <label>ملاحظة<input id="k-n" type="text" placeholder="اختياري"></label>
  <button class="btn" onclick="doCollect('${k}','${id}',${pj(p)})">تم التحصيل</button>`);
}
function doCollect(k,id,p){
  const it=item(k,id),amount=parseNum($('#k-amt').value),date=$('#k-d').value,method=$('#k-m').value;
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!date)return toast('اختار التاريخ');
  if(isClosed(date))return toast(`شهر ${MONTHS[+date.slice(5,7)-1]} مقفول`);
  const cat=ensureCat(it.name,'inc');
  const t={id:uid(),type:'inc',amount,cat:cat.id,method,date,note:$('#k-n').value.trim(),created:Date.now(),src:{k,id,p}};
  S.txs.push(t);setRec(k,id,p,{st:'done',txId:t.id,at:Date.now()});
  save();closeSheet();render();toast('اتسجّل التحصيل ✓');
}
function rejectIt(k,id,p){
  if(k!=='m')etSave(k,true);
  const it=item(k,id);if(!it)return;
  sheet(`<h2>✕ مرفوض: ${esc(it.name)}</h2>
  <label>السبب (اختياري)<input id="k-r" type="text" placeholder="مثلاً: العميل أجّل الدفع للشهر الجاي"></label>
  <button class="btn" style="background:var(--exp)" onclick="doReject('${k}','${id}',${pj(p)})">تأكيد الرفض</button>`);
}
function doReject(k,id,p){setRec(k,id,p,{st:'rej',reason:$('#k-r').value.trim(),at:Date.now()});save();closeSheet();render();toast('اتسجّل كمرفوض')}
function undoIt(k,id,p){
  const s=stOf(getRec(k,id,p));
  if(s.st==='done'){
    if(isClosed(s.t.date))return toast('الشهر بتاع التحصيل ده مقفول');
    if(!confirm('هيتلغي التحصيل ويتمسح من الحركات. متأكد؟'))return;
    S.txs=S.txs.filter(t=>t.id!==s.t.id);
  }
  setRec(k,id,p,null);save();render();toast('اتلغى');
}

function newTx(){

function txForm(){
  const orig=F.id&&S.txs.find(t=>t.id===F.id),locked=orig&&isClosed(orig.date);
  const cats=S.cats.filter(c=>c.kind===F.type&&(c.active||c.id===F.cat));
  const meths=S.methods.filter(m=>m.active||m.id===F.method||m.id===F.to);

  sheet(`<h2>${F.id?'تعديل حركة':'حركة جديدة'}</h2>
  ${locked?'<p class="warn">🔒 الشهر ده مقفول. افتحه من الإعدادات ← قفل الشهور عشان تعدّل.</p>':''}
  ${orig&&orig.src?'<p class="warn">📥 الحركة دي جاية من صفحة التحصيلات. لو مسحتها، التحصيل هيرجع "منتظر".</p>':''}
  <div class="seg">${types.map(([k,l])=>`<button class="${F.type===k?'on '+k:''}" onclick="grab();F.type='${k}';txForm()">${l}</button>`).join('')}</div>
  <input id="f-amt" class="amt-in" type="text" inputmode="decimal" placeholder="0" value="${esc(F.amount)}">
  ${F.type==='tr'
    ?`<label>من<select id="f-m">${opt(meths,F.method)}</select></label><label>إلى<select id="f-to">${opt(meths,F.to)}</select></label>`
    :`<div class="fl">البند<div class="inl"><select id="f-cat">${opt(cats,F.cat)}</select><button type="button" class="mini" onclick="quickCat()">+ جديد</button></div></div>
      <label>${F.type==='exp'?'دفعت بـ':'استلمت على'}<select id="f-m">${opt(meths,F.method)}</select></label>`}
  <label>التاريخ<input id="f-d" type="date" value="${F.date}"></label>
  <label>ملاحظة<input id="f-n" type="text" value="${esc(F.note)}" placeholder="اختياري"></label>
  <button class="btn" onclick="saveTx()" ${locked?'disabled':''}>سجّل</button>
  ${F.id&&!locked?'<button class="btn ghost danger" onclick="delTx()">حذف الحركة</button>':''}`);
  if(!F.id)setTimeout(()=>$('#f-amt')&&$('#f-amt').focus(),260);
}
function quickCat(){
  grab();
  const n=(prompt(F.type==='exp'?'اسم بند المصروف الجديد (مثلاً: طازة، قسط العربية)':'اسم بند التحصيل الجديد (مثلاً: الراتب، عقد صيانة)')||'').trim();
  if(!n)return;
  const c=ensureCat(n,F.type);c.active=true;save();F.cat=c.id;txForm();toast('اتضاف البند ✓');
}
function saveTx(){
  grab();const amount=parseNum(F.amount);
  if(!(amount>0))return toast('اكتب مبلغ صحيح');
  if(!F.date)return toast('اختار التاريخ');
  if(isClosed(F.date))return toast(`شهر ${MONTHS[+F.date.slice(5,7)-1]} مقفول`);
  if(!F.method)return toast('اختار طريقة الدفع');
  if(F.type==='tr'){if(!F.to||F.to===F.method)return toast('اختار طريقتين مختلفتين')}
  else if(!F.cat)return toast('اختار البند');
  const t={id:F.id||uid(),type:F.type,amount,method:F.method,date:F.date,note:(F.note||'').trim(),created:F.created||Date.now()};
  if(F.src)t.src=F.src;
  if(F.type==='tr')t.to=F.to;else t.cat=F.cat;
  const i=S.txs.findIndex(x=>x.id===t.id);if(i>=0)S.txs[i]=t;else S.txs.push(t);
  save();closeSheet();render();toast('اتسجّلت ✓');
}
function delTx(){if(!confirm('تمسح الحركة دي؟'))return;S.txs=S.txs.filter(t=>t.id!==F.id);save();closeSheet();render();toast('اتمسحت')}

/* --- طريقة دفع --- */
function editMethod(id){
  const m=id?M(id):{name:'',type:'cash',bank:'',color:COLORS[1],active:true};
  const used=id&&S.txs.some(t=>t.method===id||t.to===id);
  sheet(`<h2>${id?'تعديل':'إضافة'} طريقة دفع</h2>
  <label>الاسم<input id="m-name" value="${esc(m.name)}" placeholder="مثلاً: فيزا البنك الأهلي"></label>
  <label>النوع<select id="m-type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${m.type===k?'selected':''}>${l}</option>`).join('')}</select></label>
  <label>البنك / الجهة<input id="m-bank" value="${esc(m.bank)}" placeholder="اختياري"></label>
  <div style="margin-top:10px;font-size:13px;color:var(--mu)">اللون</div>
  <div class="colors">${COLORS.map(c=>`<button type="button" class="sw ${c===m.color?'on':''}" style="background:${c}" onclick="pickColor(this,'${c}')"></button>`).join('')}</div>
  <input type="hidden" id="m-color" value="${m.color}">
  ${id?`<label class="chk"><input type="checkbox" id="m-act" ${m.active?'checked':''}> شغالة (تظهر في تسجيل الحركات)</label>`:''}
  <button class="btn" onclick="saveMethod('${id||''}')">حفظ</button>
  ${id&&!used?`<button class="btn ghost danger" onclick="delMethod('${id}')">حذف</button>`:''}
  ${used?'<small class="muted">عليها حركات، تقدر توقفها بدل ما تمسحها.</small>':''}`);
}
function pickColor(el,c){document.querySelectorAll('.sw').forEach(x=>x.classList.remove('on'));el.classList.add('on');$('#m-color').value=c}
function saveMethod(id){
  const name=$('#m-name').value.trim();if(!name)return toast('اكتب الاسم');
  const m=id?M(id):{id:uid(),active:true};
  Object.assign(m,{name,type:$('#m-type').value,bank:$('#m-bank').value.trim(),color:$('#m-color').value});
  if($('#m-act'))m.active=$('#m-act').checked;if(!id)S.methods.push(m);
  save();closeSheet();render();toast('اتحفظ ✓');
}
function delMethod(id){if(!confirm('تمسح طريقة الدفع دي؟'))return;S.methods=S.methods.filter(m=>m.id!==id);save();closeSheet();render()}

/* --- بند (إضافة سريعة من الرئيسية) --- */
function editCat(id,kind){
  const c=id?C(id):{name:'',kind,active:true};
  sheet(`<h2>${id?'تعديل':'إضافة'} بند ${c.kind==='exp'?'مصروف':'تحصيل'}</h2>
  <label>الاسم<input id="c-name" value="${esc(c.name)}" placeholder="${c.kind==='exp'?'مثلاً: طازة، قسط العربية':'مثلاً: الراتب'}"></label>
  ${id?`<label class="chk"><input type="checkbox" id="c-act" ${c.active?'checked':''}> شغال (يظهر في تسجيل الحركات)</label>`:''}
  <button class="btn" onclick="saveCat('${id||''}','${c.kind}')">حفظ</button>`);
  if(!id)setTimeout(()=>$('#c-name')&&$('#c-name').focus(),260);
}
function saveCat(id,kind){
  const name=$('#c-name').value.trim();if(!name)return toast('اكتب اسم البند');
  if(S.cats.some(x=>x.kind===kind&&x.name===name&&x.id!==id))return toast('البند ده موجود قبل كده');
  const c=id?C(id):{id:uid(),kind,active:true};
  c.name=name;if($('#c-act'))c.active=$('#c-act').checked;if(!id)S.cats.push(c);
  save();closeSheet();render();toast('اتحفظ ✓');
}

/* ========== قفل الشهر ========== */
function closeMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`قفل ${MONTHS[m-1]} ${y}؟\nمش هتقدر تضيف أو تعدّل حركات الشهر ده لحد ما تفتحه تاني.`))return;
  const s=sums(monthTx(y,m));
  S.closed[k]={at:new Date().toISOString(),inc:s.inc,exp:s.exp};
  save();render();toast('اتقفل الشهر 🔒 وقت مناسب لنسخة احتياطية');
}
function openMonth(k){
  const[y,m]=k.split('-').map(Number);
  if(!confirm(`فتح ${MONTHS[m-1]} ${y}؟\nهتقدر تعدّل حركاته تاني.`))return;
  delete S.closed[k];save();render();toast('اتفتح الشهر');
}

/* ========== النسخ الاحتياطي ========== */
const backupJSON=()=>JSON.stringify({app:'masrofi',appVersion:APP_VERSION,exported:new Date().toISOString(),data:S});
const backupName=()=>`masrofi-backup-${today()}.json`;
function markBackup(){localStorage.setItem(BKEY,today());render()}
function backup(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([backupJSON()],{type:'application/json'}));
  a.download=backupName();document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);markBackup();toast('اتنزلت النسخة ✓');
}
async function shareBackup(){
  try{await navigator.share({files:[new File([backupJSON()],backupName(),{type:'application/json'})],title:'نسخة مصروفي'});markBackup()}catch(e){}
}
function restore(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    let d=JSON.parse(r.result);if(d.data)d=d.data;
    if(!Array.isArray(d.methods)||!Array.isArray(d.txs))throw 0;
    if(!confirm(`النسخة فيها ${d.txs.length} حركة.\nالاسترجاع هيمسح البيانات الحالية ويحط النسخة مكانها. نكمل؟`))return;
    S=normalize(d);save();go('home');toast('اتسترجعت البيانات ✓');
  }catch(e){alert('الملف ده مش نسخة احتياطية صالحة من مصروفي')}};
  r.readAsText(f);
}
function resetAll(){
  if(!confirm('هتمسح كل الحركات والإعدادات من الجهاز ده. متأكد؟'))return;
  if(!confirm('آخر تأكيد: عندك نسخة احتياطية؟ المسح مش هيترجع.'))return;
  S=defaults();save();go('home');toast('اتمسح كل شيء');
}

/* ========== تشغيل ========== */
$('#hd').textContent=NOW.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
save();render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(()=>setTimeout(pushAlerts,1500)).catch(()=>{}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){updateBell();pushAlerts()}});
</script>
</body>
</html>
